# zlu.me SEO keyword plan (BetterReads-style combo)
# Rules:
#   1. One primary query per URL (unique across this file).
#   2. Supporting phrases may overlap; primaries may not.
#   3. Prefer GSC almost-wins before minting new URLs.
#   4. Scorecards are judged separately — never mix weekly work.
#
# Regenerated judgment from Google Search Console + Bing Webmaster
# Queries/Pages exports (Web · last 3 months · ~2026-09-20 → 2026-11-09).
# Bing confirm: ~8.2k impr / ~22 clicks (0.27% CTR); thin uni shells dominate
# impressions (BR/RU); Monash course codes + image-processing-with-r convert.
# status: optimize | expand | monitor | ship
# Also 2026-11-15: depth-promoted linked course pages (material-backed) into tutor_leads
# as expand/ship — do not wait for clicks when private teaching depth is already strong.

scorecards:
  ai_authority:
    surfaces:
      - blog posts
      - /ai-glossary/
      - /algos/
    weekly_signal: "rising non-brand impressions + clicks on posts/glossary; Bing: image-processing-with-r + vector-db title CTR"
  tutor_leads:
    surfaces:
      - /teach/
      - /teach/courses/ (linked only)
      - /teach/universities/ (linked only)
    weekly_signal: "Monash/UTS/course-code clicks in AU (+ Bing TW/AU CTR); ignore uni-service shell + BR/RU/IN name impressions"
  hygiene:
    surfaces:
      - sitemap.xml
      - retired redirects
    weekly_signal: "uni-service /exam|/assignment|/sync|/preview soft-redirect to uni hub; absent from sitemap/IndexNow; collapse st-cloud/saint-cloud + miami art-design slug twins; Bing URL Removal for same corpses; 301 old etx3500-5500-… slug → /etx3500/"

