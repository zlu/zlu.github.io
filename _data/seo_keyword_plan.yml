# zlu.me SEO keyword plan (BetterReads-style combo)
# Rules:
#   1. One primary query per URL (unique across this file).
#   2. Supporting phrases may overlap; primaries may not.
#   3. Prefer GSC almost-wins before minting new URLs.
#   4. Scorecards are judged separately — never mix weekly work.
#
# Regenerate judgment from Search Console Queries/Pages exports.
# status: optimize | expand | monitor | ship

scorecards:
  ai_authority:
    surfaces:
      - blog posts
      - /ai-glossary/
      - /algos/
    weekly_signal: "rising non-brand impressions + clicks on posts/glossary"
  tutor_leads:
    surfaces:
      - /teach/
      - /teach/courses/ (linked only)
      - /teach/universities/ (linked only)
    weekly_signal: "Monash/UTS/course-code clicks; ignore uni-service shell impressions"
  hygiene:
    surfaces:
      - sitemap.xml
      - retired redirects
    weekly_signal: "uni-service /exam|/assignment|/sync|/preview soft-redirect to uni hub; absent from sitemap/IndexNow"

