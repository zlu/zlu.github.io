  lead_en: Database Database Systems at Cornell University is where one wrong schema or join quietly breaks
    every later query. The hard part is turning that arc into a method you can repeat on the next brief
    — not rereading slides the night before.
  lead_cn: 在康奈尔大学上 Database，Schema 或 join 偏一点，后面查询会整条链一起歪。
  overview_en: Database Database Systems sits in databases & information systems. Students stall when
    terminology outruns notes, when a demo makes sense in class but not alone, or when the write-up /
    autograder asks for a method the notebook never made explicit. Sample slides from our concept-review
    tutoring deck are below.
  overview_cn: Database 是康奈尔大学「数据库与信息系统」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告
    / autograder 要的方法在 notebook 里从未写清。 下方有我们概念复习辅导课件的样例页。
