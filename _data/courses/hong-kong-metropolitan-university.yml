    outruns notes, when a demo makes sense in class but not alone, or when the write-up / autograder asks
    for a method the notebook never made explicit. Sample slides from our concept-review tutoring deck
    are below.
  overview_cn: COMP S460F 是香港都会大学「数据科学与分析」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告
    / autograder 要的方法在 notebook 里从未写清。 下方有我们概念复习辅导课件的样例页。
