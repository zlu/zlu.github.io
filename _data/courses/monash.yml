  # GSC: fit3155
  - code: FIT3155
    title: Advanced Data Structures and Algorithms
    theme: algorithms
    lead_en: >-
      FIT3155 is algorithms under time pressure: English proofs, complexity talk, and
      implementations that must match the argument. The hard part is keeping the
      invariant, the complexity claim, and the code aligned.
    lead_cn: >-
      FIT3155 是限时压力下的算法课：英文证明、复杂度表述，以及必须与论证对齐的实现。
      难的是让不变量、复杂度结论和代码说的是同一件事。
    overview_en: >-
      Advanced Data Structures and Algorithms goes beyond intro DSA into harder
      structures, algorithm design patterns, and exam-style reasoning. Students stall
      when English proof sketches feel abstract, or when a correct idea dies in
      implementation bugs.
    overview_cn: >-
      Advanced Data Structures and Algorithms 在入门 DSA 之上进入更难的结构、算法设计模式
      与考试风格推理。卡点常在英文证明提纲过于抽象，或思路正确却死在实现 bug 上。
    topics:
      - en: "Advanced structures and when to reach for them"
        cn: "进阶结构及其适用场景"
      - en: "Invariants and short proof sketches in English"
        cn: "不变量与英文短证明提纲"
      - en: "Complexity arguments that survive marker scrutiny"
        cn: "经得起改卷的复杂度论证"
      - en: "Implementation that matches the algorithm you claimed"
        cn: "实现与你声称的算法一致"
    stuck:
