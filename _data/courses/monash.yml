  - en: Gates, circuits, and Karnaugh-map simplification
    cn: 门电路、电路与卡诺图化简
  - en: Network capture — wireless properties and traffic analysis
    cn: 网络抓包：无线特性与流量分析
  - en: Clients, servers, protocols, and reading packet evidence
    cn: 客户端、服务器、协议与读报文证据
  - en: Cybersecurity incident write-ups and comparative analysis
    cn: 网络安全事件报告与对比分析
  - en: Enterprise security controls and defence-in-depth diagrams
