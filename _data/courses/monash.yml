- code: FIT1058
  title: Foundations of Computing
  material: FIT1058 Foundations of computing
  theme: math-for-cs
  meta_description_en: FIT1058 Monash tutoring (Foundations of Computing). Stuck on sets, functions, proof
    methods, or predicate logic seminar prep? Bilingual exam drills.
  lead_en: 'FIT1058 is CS foundations as rigorous maths: sets, functions, proof methods, propositional
    then predicate logic. Seminars assume pre-reading is done; assessment rewards precise definitions
    and proof structure. The hard part is not “being bad at maths” — it is translating English / symbol-heavy
    notes into a proof you can write under time pressure.'
  lead_cn: FIT1058 是用严谨数学讲 CS 基础：集合、函数、证明方法，再到命题逻辑与谓词逻辑。 Seminar 默认你做过 pre-reading；评分看重定义准确与证明结构。难的不是「数学差」，
    而是把英文 / 符号很密的笔记，变成限时能写出来的证明。
  overview_en: Foundations of Computing develops abstract modelling, logical reasoning, and proof skills
    used across a CS degree. Course notes for early weeks cover sets and counting, functions (including
    CS views of functions), methods of proof (construction, cases, contradiction, induction), and propositional
    logic, then predicate logic. Weekly seminars come in multiple parts with worked examples; sample solutions
    reward clear structure. Students stall when school maths gaps meet new notation, when existential
    / universal quantifiers blur, or when a proof idea cannot be written as a sequence of justified steps.
    Sample slides from our concept-review tutoring deck are below.
  overview_cn: Foundations of Computing 训练整个 CS 学位都会用到的抽象建模、逻辑推理与证明。前几周 课程笔记覆盖集合与计数、函数（含 CS 视角）、证明方法（构造、分情形、反证、归纳）、
    命题逻辑，再进谓词逻辑。每周 seminar 多分场次并带例题；样例解答强调结构清楚。卡点常在 中学数学缺口撞上新记号、存在 / 全称量词搅在一起，或证明思路落不成一串有依据的步骤。
  topics:
  - en: Sets, subsets, and counting arguments
    cn: 集合、子集与计数论证
  - en: Functions, inverses, and CS interpretations of functions
    cn: 函数、逆与 CS 视角下的函数
  - en: Proof methods — construction, cases, contradiction, induction
    cn: 证明方法：构造、分情形、反证、归纳
  - en: Propositional logic and symbolic manipulation
    cn: 命题逻辑与符号演算
  - en: Predicate logic — variables, quantifiers, and predicates
    cn: 谓词逻辑：变量、量词与谓词
  - en: Seminar problem drill with bilingual definition cards
    cn: 带双语定义卡的 seminar 题型练习
  stuck:
  - en: Pre-reading unfinished → seminar speed feels impossible
    cn: pre-reading 没做完 → seminar 课速像跟不上
  - en: Can follow a proof in notes, cannot start one on a blank page
    cn: 能看懂笔记里的证明，白纸上却开不了头
  - en: Quantifiers and set notation mix until the claim is unclear
    cn: 量词与集合记号搅在一起，命题本身都不清楚
  - en: School maths gaps (logs, counting, functions) resurface mid-semester
    cn: 中学数学缺口（对数、计数、函数）学期中途反扑
  session_angles:
  - en: Definition → tiny example → exam-style write-up for each week’s idea
    cn: 每周概念都走：定义 → 小例子 → 考试风格书写
  - en: Proof templates you can reuse under time pressure
    cn: 限时能复用的证明模板
  - en: Bilingual glossary for the week’s symbols before the seminar
    cn: seminar 前用中英对照本周符号
  tutoring:
  - en: 'Lecture / seminar sync: bilingual rebuild of the week’s definitions and proof patterns.'
    cn: 同步跟课 / seminar：用中英双语重建当周定义与证明模式。
  - en: 'Problem sets: you write the proof; we check structure and missing justifications.'
    cn: 习题：你来写证明；我们检查结构与缺失依据。
  - en: 'Exam prep: timed short proofs and quantifier translation drills.'
    cn: 考前突击：限时短证明与量词翻译练习。
