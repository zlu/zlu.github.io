      - en: "Greek / asymptotic notation outrunning the plain-language claim"
        cn: "希腊字母 / 渐近记号跑在大白话结论前面"
      - en: "Exam figures and pseudocode that look cryptic under time pressure"
        cn: "限时下考试图与伪代码像天书"
    session_angles:
      - en: "Write the invariant before code"
        cn: "写代码前先写不变量"
      - en: "Dry-run on a tiny example, then generalise"
        cn: "先在小例子上手推，再一般化"
      - en: "Timed proof + code pairing drills"
        cn: "限时证明 + 代码配对练习"
    tutoring:
      - en: "Lecture sync: bilingual algorithm ideas until proofs and code share vocabulary."
        cn: "同步跟课：用中英双语把算法思想讲到证明与代码共用术语。"
      - en: "Assignments: design + debug with you implementing."
        cn: "作业辅导：设计 + debug，你来实现。"
      - en: "Exam prep: timed drills on proofs, complexity, and reading pseudocode."
        cn: "考前突击：限时练证明、复杂度与读伪代码。"

  # GSC: fit5197
  - code: FIT5197
    title: Modelling for Data Analysis
    theme: data-science
    lead_en: >-
      FIT5197 is statistical modelling in English: choose a model, check assumptions,
      and defend the fit. The hard part is interpretation under terminology denser than
      the software UI.
    lead_cn: >-
      FIT5197 是英文语境下的统计建模：选模型、查假设、为拟合辩护。难的是术语比软件界面更密，
      解释跟不上。
    overview_en: >-
      Modelling for Data Analysis focuses on building and justifying statistical models
      for assessment. Students struggle when English model names blur together, when
      diagnostics are ignored, or when the write-up cannot explain a coefficient or plot.
    overview_cn: >-
      Modelling for Data Analysis 重点是为评估建立并论证统计模型。卡点常在英文模型名搅在一起、
      忽略诊断，或报告解释不清系数 / 图。
    topics:
      - en: "Model choice for the question being asked"
        cn: "针对问题选择模型"
      - en: "Assumption checks and diagnostics"
        cn: "假设检查与诊断"
      - en: "English stats vocabulary next to software output"
