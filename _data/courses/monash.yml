- code: FIT1045
  title: Introduction to Programming
  material: fit1045
  theme: programming
  lead_en: FIT1045 is many students' first real programming unit. Briefs, Python syntax, and workshop
    logic hit at once. The hard part is not memorising keywords — it is turning a wordy task into working
    code without freezing in the IDE.
  lead_cn: FIT1045 往往是留学生第一门正经编程课。Brief、Python 语法、workshop 逻辑一起压过来。 难的不是背关键字，而是把题意变成能跑的代码，而不是在 IDE 里卡住。
  overview_en: Introduction to Programming covers Python fundamentals through workshops, quizzes, and
    coding tasks (control flow, functions, strings, simple algorithms such as classical ciphers). Students
    get stuck when the task wording is unclear, when errors look random, or when a solution “almost works”
    but fails hidden cases.
  overview_cn: Introduction to Programming 用 workshop、quiz 与编程任务带你入门 Python（控制流、函数、 字符串，以及恺撒 / 维吉尼亚一类经典密码练习）。真正卡人的是题意读不清、报错像随机事件，
    或代码「差不多能跑」却过不了隐藏测例。
  topics:
  - en: Python basics — variables, control flow, functions
    cn: Python 基础：变量、控制流、函数
  - en: Strings, lists, mutability, and simple data processing
    cn: 字符串、列表、可变性与简单数据处理
  - en: Reading a brief into a step-by-step plan
    cn: 把 brief 拆成可执行步骤
  - en: Debugging with traces instead of random edits
    cn: 用跟踪思路 debug，而不是乱改
  - en: Pre-class / workshop / quiz-style practice problems
    cn: Pre-class / workshop / quiz 风格练习
  - en: Multi-file projects (e.g. robot / geo feature tasks) and classic ciphers
    cn: 多文件项目（如 robot / 地理特征任务）与经典密码题
  stuck:
  - en: Assignment text makes sense in class, then freezes you alone at the keyboard
    cn: 课上听得懂题，自己对着键盘就停住
  - en: Syntax errors and stack traces feel random instead of diagnostic
    cn: 语法错误和堆栈像随机事件，不会当诊断信息读
  - en: A program that works on the sample input fails the autograder edge cases
    cn: 样例能过，autograder 边界一测就挂
  - en: Copying workshop demos without knowing which line does the real work
    cn: 会抄 workshop 演示，但分不清哪一行才是关键逻辑
  session_angles:
  - en: Translate the brief into a short checklist before typing code
    cn: 写代码前先把 brief 转化成短清单
  - en: You drive the IDE; we chase the failing case together
    cn: 你来操作 IDE，我们一起追失败测例
  - en: Exam / quiz drills on the same patterns workshops use
    cn: 用与 workshop 同构的题型做 quiz / 考试练习
  tutoring:
  - en: 'Lecture sync: bilingual walkthrough of Python concepts so workshop language matches the lectures.'
    cn: 同步跟课：用中英双语把 Python 概念讲透，与 workshop / 课堂用语对齐。
  - en: 'Assignments: approach review and live debug.'
    cn: 作业辅导：拆 brief、梳思路、现场 debug。
  - en: 'Quiz / exam prep: short timed drills on control flow, strings, and reading error messages under
      pressure.'
    cn: Quiz / 考前突击：限时练控制流、字符串，以及在压力下读懂报错。
  meta_description_en: FIT1045 Monash tutoring (Introduction to Programming). Assignment text makes sense
    in class, then freezes you alone at the keyboard? Bilingual help.
- code: FIT5196
  title: Data Wrangling
  material: FIT5196-datawrangling
  theme: data-science
  meta_description_en: FIT5196 Monash tutoring (Data Wrangling). Stuck on mis-structured text parse, dirty/outlier/missing
    tables, or rubric “enough cleaning”? Bilingual pandas help.
  lead_en: FIT5196 punishes messy notebooks. A1 is semi-structured text parse into vocab / count vectors;
    A2 is dirty, outlier, and missing tables with a written method trail. The hard part is a clean, reproducible
    pipeline the marker can re-run — not one lucky pandas line.
  lead_cn: FIT5196 最怕凌乱 notebook。A1 是半结构化文本解析进 vocab / count vector；A2 是 dirty / outlier / missing 三张脏表，还要留下方法轨迹。难的不是碰巧跑通一行
    pandas，而是交出改卷人能复跑的干净流水线。
  overview_en: 'Data Wrangling covers the full import → clean → explore → reshape loop in Python (pandas
    notebooks), plus group assessments and declarations. Early weeks introduce wrangling and EDA / pre-processing;
    assessments then force real mess: mis-structured XML-like review dumps, wrong input zip = zero output
    marks, and cleansing decisions you must justify. Students stall when regex / field extraction is brittle,
    when joins invent silent NaNs, when EDA has no question, or when the rubric asks for method clarity
    the notebook never shows.'
  overview_cn: Data Wrangling 覆盖 Python（多为 pandas notebook）里导入 → 清洗 → 探索 → 重塑全流程， 加上小组评估与声明。前几周讲 wrangling
    与 EDA / 预处理；作业立刻变成真脏活：半结构化 评论 dump、输错 zip 输出分直接零、清洗决策必须写清。卡点常在正则 / 字段抽取一碰就碎、 join 悄悄造 NaN、EDA 没有问题意识，或评分要方法说明而
    notebook 里从未写清。
  topics:
  - en: Parsing semi-structured text / Excel into tidy tables
    cn: 把半结构化文本 / Excel 解析成整齐表
  - en: Vocab, count vectors, and text pre-processing for A1-style tasks
    cn: A1 风格的 vocab、count vector 与文本预处理
  - en: Dirty / outlier / missing cleansing with an EDA-first checklist
    cn: 先 EDA 再洗 dirty / outlier / missing
  - en: pandas dtypes, joins / merges without silent row inflation
    cn: pandas dtype、join / merge 不悄悄膨胀行数
  - en: Rubric, group declarations, and reproducible notebooks
    cn: 评分量表、小组声明与可复现 notebook
  - en: EDA / pre-processing before any modelling story
    cn: 建模叙事之前的 EDA / 预处理
  stuck:
  - en: Wrong group input files → output marks go to zero
    cn: 小组输入文件拿错 → 输出分直接归零
  - en: Brief + rubric language — unsure what 'enough cleaning' means
    cn: Brief + 评分表述——不清楚「清洗到什么程度算够」
  - en: Regex / field extract works on sample, fails on the full dump
    cn: 样例上正则 / 字段抽取能过，全量 dump 就挂
  - en: Group notebooks with unclear ownership and broken paths
    cn: 小组 notebook 权责不清、路径一换就挂
  session_angles:
  - en: Map A1 / A2 tasks to a short parse → clean → evidence checklist
    cn: 把 A1 / A2 映射成 解析 → 清洗 → 证据 短清单
  - en: You drive the notebook; we sanity-check joins, missingness, and output schemas
    cn: 你来跑 notebook，我们一起核验 join、缺失值与输出 schema
  - en: Tighten the write-up so each cleansing decision has a trail
    cn: 收紧报告，让每个清洗决策都有轨迹
  tutoring:
  - en: 'Lecture sync: bilingual walkthrough of wrangling ideas (import → clean → explore → reshape) aligned
      with workshop language.'
    cn: 同步跟课：用中英双语把清洗主线讲透（导入 → 清洗 → 探索 → 重塑），与 workshop 用语对齐。
  - en: 'Assignments: approach review and live notebook debug for A1 parse and A2 cleansing.'
    cn: 作业辅导：拆 A1 解析 / A2 清洗 brief，现场 debug notebook。
  - en: 'Assessment prep: rubric-focused drills so each task leaves a clear method trail.'
    cn: 评估突击：按评分量表练，让每个任务都留下清晰方法轨迹。
- code: ETX3500
  title: High Dimensional Data Analysis
  aliases:
  - ETX5500
  material: etx3500-5500-High-Dimensional-Data-Analysis
  theme: data-science
  meta_description_en: ETX3500 / ETX5500 Monash tutoring (High Dimensional Data Analysis). Stuck on R
    / tidyverse / R Markdown or method choice under dense formulae? Bilingual help.
  lead_en: ETX3500 / ETX5500 mixes stats language with high-dimensional intuition. Early weeks jump from
    unit intro into R, tidy data, and R Markdown while formulae and plots keep coming. The hard part is
    knowing what the method does to your table — not copying a slide title into the write-up.
  lead_cn: ETX3500 / ETX5500 把统计术语和高维直觉绑在一起。前几周从课程介绍直接进入 R、 tidy data 与 R Markdown，公式和图还在不停切换。难的不是把课件标题抄进报告，
    而是说清这个方法对你的表到底做了什么。
  overview_en: 'High Dimensional Data Analysis (ETX3500 / ETX5500) covers statistical tools for data with
    many variables: R / tidyverse workflows, R Markdown reports, dimension reduction intuition, modelling
    choices, and reading plots. Tutorials and exercises expect you to move between symbols and output
    tables. Students stall when Greek letters and matrix talk outrun the picture of “what changed in my
    data,” or when the R Markdown knit fails while the deadline does not wait.'
  overview_cn: High Dimensional Data Analysis（ETX3500 / ETX5500）面向多变量数据：R / tidyverse 工作流、R Markdown 报告、降维直觉、建模选择与读图。Tutorial
    / 练习要求在符号与 输出表之间来回切换。卡点常在希腊字母和矩阵表述跑在前面，脑子里却没有 「数据到底变了什么」的画面；或 R Markdown 织不出来，DDL 却不等你。
  topics:
  - en: R, tidyverse, and tidy-data habits for coursework
    cn: 课业用的 R、tidyverse 与 tidy data 习惯
  - en: R Markdown reports the marker can knit
    cn: 改卷人能 knit 出来的 R Markdown 报告
  - en: High-dimensional intuition vs ordinary regression habits
    cn: 高维直觉 vs 普通回归习惯
  - en: Reading stats terminology next to the formula
    cn: 统计术语与公式对照着读
  - en: Tutorial / exercise walkthroughs with a method checklist
    cn: Tutorial / 练习：带着方法清单过
  - en: Interpreting plots without hand-waving
    cn: 解读图表，不靠含糊其辞
  stuck:
  - en: R / R Markdown environment eats the week before any stats
    cn: 还没碰统计，R / R Markdown 环境就吃掉一周
  - en: Formulae memorised without knowing what the output table should look like
    cn: 公式背下来了，却不知道输出表该长什么样
  - en: Lecture speed outruns note-taking on symbols and assumptions
    cn: 课速超过记符号与假设的速度
  - en: Plots produced, but the write-up cannot defend the modelling choice
    cn: 图做出来了，报告却说不清为何选这个模型
  session_angles:
  - en: 'Rebuild each method as: input table → transform → what to report'
    cn: 每个方法都转化成：输入表 → 变换 → 要报告什么
  - en: Bilingual symbol glossary for the week’s Greek letters and terms
    cn: 用中英对照本周希腊字母与术语
  - en: Exercise drills that force interpretation, not only computation
    cn: 练习既要算，也要解释
  tutoring:
  - en: 'Lecture sync: bilingual concept catch-up so R + stats vocabulary matches the exercises.'
    cn: 同步跟课：用中英双语补概念，让 R 与统计词汇与练习对齐。
  - en: 'Assignments / tutorials: approach review with you driving the computation.'
    cn: 作业 / tutorial：你来操作计算，我旁路梳思路。
  - en: 'Exam prep: short drills on method choice, assumptions, and reading output.'
    cn: 考前突击：短练方法选择、假设与读输出。
- code: FIT2102
  title: Programming Paradigms
  theme: programming
  meta_description_en: FIT2102 Monash tutoring (Programming Paradigms). Stuck translating lecture vocabulary
    into a first working example? Bilingual Chinese/English lecture sync.
  lead_en: FIT2102 switches the ground rules of programming. Lectures introduce a new paradigm (often
    functional-style thinking) while assessment expects precise reasoning. The hard part is abstract rules
    that do not feel like “normal” Python / Java habits.
  lead_cn: FIT2102 会换掉很多同学习惯的编程手感。课上引入偏函数式的规则后，考核却要求推理写清楚： 不是代码能跑就够，而是要说明在当前范式下为什么这样写才合法。抽象规则一旦和原先的 Python
    / Java 习惯拧着，作业和考试都会突然变难。
  overview_en: Programming Paradigms asks you to think in more than one model of computation and write
    programs that match the paradigm’s rules. Students struggle when definitions stay abstract, when error
    messages come from an unfamiliar toolchain, or when exam questions test reasoning instead of syntax
    recall.
  overview_cn: Programming Paradigms 要求你用不止一种计算模型思考，并按该范式的规则写程序。留学生常见卡点是： 定义停在抽象层、小例子写不出来；工具链报错其实在提示规则被破坏，却被当成环境问题；考题措辞绕，
    看不出在考哪条范式规则。辅导会按「概念 → 小例子 → 你来扩展 → 限时短问」推进。
  topics:
  - en: Paradigm shift — what changes vs ordinary imperative code
    cn: 范式切换：相对命令式代码改了什么
  - en: Reading definitions into small executable examples
    cn: 把定义落到可执行小例子
  - en: Tooling / compiler errors as diagnostic text
    cn: 把工具链 / 编译报错当诊断文本读
  - en: Exam-style reasoning, not only coding syntax
    cn: 考试风格的推理，而不只是语法
  stuck:
  - en: Translating lecture vocabulary into the first working example
    cn: 把课堂术语变成第一个能跑的例子
  - en: Abstract concepts with no picture of data flow
    cn: 抽象概念对不上数据怎么流动的画面
  - en: Exam wording hides which paradigm rule is being tested
    cn: 考题措辞让人看不出在考哪条范式规则
  session_angles:
  - en: One concept → one tiny example → you extend it
    cn: 一个概念 → 一个小例子 → 你来扩展
  - en: Compare the paradigm rule to the imperative habit it replaces
    cn: 把范式规则和它替换掉的命令式习惯对照
  - en: Timed short questions that mimic exam phrasing
    cn: 用考试措辞做限时短问
  tutoring:
  - en: 'Lecture sync: bilingual walkthrough of paradigm ideas until examples feel concrete.'
    cn: 同步跟课：用中英双语把范式概念讲到例子落地。
  - en: 'Assignments: approach review and live debug with you at the keyboard.'
    cn: 作业辅导：拆题、现场 debug，你来操作键盘。
  - en: 'Exam prep: drills on reasoning under exam question wording.'
    cn: 考前突击：练在考题措辞下做推理。
- code: FIT2099
  title: Object Oriented Design and Implementation
  theme: programming
  meta_description_en: FIT2099 Monash tutoring (Object Oriented Design). Can code features but cannot
    explain the design choices? Bilingual design review and exam prep.
  lead_en: 'FIT2099 is a design-first course: classes, responsibilities, and diagrams before the code
    compiles. The hard part is justifying a design — not only making Java (or similar) run.'
  lead_cn: FIT2099 是设计课：先谈类、职责与图，再谈编译通过。难的是说清为什么这样设计， 而不只是让 Java（或类似语言）跑起来。
  overview_en: Object Oriented Design and Implementation focuses on modelling problems with objects, implementing
    designs, and communicating structure (often with diagrams and design vocabulary). Students stall when
    design jargon outruns the mental model, or when code works but the design story fails the rubric.
  overview_cn: Object Oriented Design and Implementation 强调用对象建模、落地实现，并用图与设计术语 讲清结构。卡点常在设计技术用语跑在前面，或代码能跑但设计叙事过不了评分。
  topics:
  - en: Objects, responsibilities, and collaboration
    cn: 对象、职责与协作
  - en: Design vocabulary vs the code you write
    cn: 设计术语与你写的代码对照
  - en: Diagrams that match the implementation
    cn: 与实现对齐的图
  - en: Refactoring a messy design without breaking behaviour
    cn: 在不破坏行为的前提下重构乱设计
  stuck:
  - en: Can code features but cannot explain the design choices
    cn: 功能能写，却说不清设计选择
  - en: Diagrams look neat but diverge from the actual classes
    cn: 图很整齐，却和真实类结构对不上
  - en: Inheritance / coupling choices that fight later requirements
    cn: 继承 / 耦合选择与后续需求打架
  session_angles:
  - en: Start from responsibilities, then names, then code
    cn: 先职责，再命名，再写代码
  - en: You implement; we check the design story against the rubric
    cn: 你来实现；我们按评分核对设计叙事
  - en: Short design critiques like exam / review questions
    cn: 像考试 / review 一样做短设计点评
  tutoring:
  - en: 'Lecture sync: bilingual OOP design vocabulary tied to small examples.'
    cn: 同步跟课：用中英双语把 OOP 设计术语绑到小例子上。
  - en: 'Assignments: design review + implementation debug.'
    cn: 作业辅导：设计评审 + 实现 debug。
  - en: 'Exam / review prep: justify designs under exam / review prompts.'
    cn: 考试 / review 突击：在题目要求下为设计辩护。
- code: FIT3152
  title: Data Analytics
  theme: data-science
  meta_description_en: FIT3152 Monash tutoring (Data Analytics). Tool output produced but interpretation
    missing? Bilingual help on EDA, model choice, and write-ups.
  lead_en: FIT3152 mixes analytics tools with statistical storytelling. The hard part is turning a brief
    into a justified analysis — not producing charts that look busy.
  lead_cn: FIT3152 把分析工具和统计叙事绑在一起。难的是把 brief 转化成站得住脚的分析， 而不是做出看起来很忙的图。
  overview_en: Data Analytics covers exploratory analysis, modelling choices, and communicating results
    for assessment. Students struggle with method names, when to trust a plot, and write-ups that must
    defend assumptions.
  overview_cn: Data Analytics 覆盖探索性分析、建模选择，以及为评估写清结果。卡点常在方法名混在一起、 何时相信一张图，以及报告必须为假设辩护。
  topics:
  - en: EDA with a question, not only plots
    cn: 带着问题做 EDA，而不只是画图
  - en: Model choice and assumption checks
    cn: 模型选择与假设检查
  - en: Analytics vocabulary next to the output
    cn: 分析术语与输出对照
  - en: Write-ups that match the evidence in the tables
    cn: 报告结论与表格证据一致
  stuck:
  - en: Tool output produced, interpretation missing
    cn: 工具输出有了，解释没有
  - en: Brief terms map poorly onto the buttons you clicked
    cn: Brief 术语对不上你点过的按钮
  - en: Overfitting a story to whatever the software spat out
    cn: 软件吐什么就编什么故事
  session_angles:
  - en: Brief → question → method → claim checklist
    cn: Brief → 问题 → 方法 → 结论清单
  - en: You run the analysis; we pressure-test the interpretation
    cn: 你来跑分析；我们一起压测解释是否站得住
  - en: Short exam-style interpretation drills
    cn: 考试风格的短解读练习
  tutoring:
  - en: 'Lecture sync: bilingual analytics concepts aligned with assessment language.'
    cn: 同步跟课：用中英双语对齐分析概念与评估用语。
  - en: 'Assignments: pipeline and write-up review with you driving the tools.'
    cn: 作业辅导：流水线与报告评审，你来操作工具。
  - en: 'Exam prep: interpret outputs under timed prompts.'
    cn: 考前突击：限时提示下解读输出。
- code: FIT3155
  title: Advanced Data Structures and Algorithms
  theme: algorithms
  meta_description_en: FIT3155 Monash tutoring (Advanced DSA). Correct intuition but incomplete proof
