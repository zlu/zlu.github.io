- code: FIT2102
  title: Programming Paradigms
  theme: programming
  meta_description_en: FIT2102 Monash Programming Paradigms tutoring. Imperative / OOP / functional /
    declarative; FRP and Haskell-style assignments; bilingual help.
  lead_en: 'FIT2102 Programming Paradigms at Monash compares imperative, object-oriented, functional,
    and declarative styles. Core ideas: abstraction, composition, data modelling, state and side effects,
    evaluation strategies (strict vs lazy), and types. Practical work often includes Functional Reactive
    Programming and a Haskell-style project, plus workshop / quiz work — not only “code that runs”.'
  lead_cn: Monash 的 FIT2102 Programming Paradigms 对比命令式、面向对象、函数式、声明式这几类写法。 核心概念是抽象、组合、数据建模、状态与副作用、求值策略（严格
    / 惰性）、类型。作业常见 Functional Reactive Programming 和偏 Haskell 风格的项目，还有 workshop / quiz——不只是代码能跑。
  overview_en: You need to solve the same kind of problem in more than one style, then explain trade-offs
    in clarity and maintainability. Students stall when JavaScript / FRP event thinking clashes with old
    imperative habits, when Haskell types and purity block the first compiling program, or when interview
    / quiz wording asks which paradigm rule is being tested.
  overview_cn: 课要求同一类问题能用不止一种范式来写，并说清可读性和可维护性上的取舍。常见卡住：JS / FRP 的事件思路和以前的命令式习惯冲突；Haskell 类型和纯函数卡在第一份能编译的程序；quiz
    / 面试式提问时，看不出在考哪条范式规则。
  topics:
  - en: Imperative vs OOP vs functional vs declarative — what changes
    cn: 命令式 / OOP / 函数式 / 声明式分别改了什么
  - en: Abstraction, composition, state, side effects
    cn: 抽象、组合、状态、副作用
  - en: Strict vs lazy evaluation; role of types
    cn: 严格求值 vs 惰性求值；类型起什么作用
  - en: Functional Reactive Programming assignments
    cn: Functional Reactive Programming 作业
  - en: Haskell-style pure functional programming
    cn: Haskell 风格的纯函数式编程
  stuck:
  - en: Cannot turn lecture vocabulary into a first working example
    cn: 课上术语对不上第一个能跑的例子
  - en: FRP / event model fights imperative habits
    cn: FRP / 事件模型和以前的命令式写法冲突
  - en: Assignment brief makes sense in class, freezes you alone
    cn: 作业 brief 课上听得懂，自己对着就停住
  - en: Quiz wording hides which paradigm rule is tested
    cn: Quiz 措辞让人看不出在考哪条规则
  session_angles:
  - en: One concept → tiny example → you extend it
    cn: 一个概念 → 小例子 → 你来改大
  - en: Same problem in two paradigms; compare the trade-off out loud
    cn: 同一题用两种范式写，口头说清取舍
  - en: Timed short questions in exam / quiz phrasing
    cn: 用考试 / quiz 措辞做限时短问
  tutoring:
  - en: 'Lecture sync: bilingual walkthrough until FRP / Haskell examples feel concrete.'
    cn: 跟课：中英对照把 FRP / Haskell 例子讲到能自己写。
  - en: 'Assignments: approach review and live debug with you at the keyboard.'
    cn: 作业：拆题、现场 debug，你来敲键盘。
  - en: 'Quiz / exam prep: drills on paradigm rules under question wording.'
    cn: Quiz / 考前：按题目措辞练范式规则。
- code: FIT2099
  title: Object Oriented Design and Implementation
  theme: programming
  meta_description_en: FIT2099 Monash Object Oriented Design tutoring. UML class / interaction diagrams,
    Java OOP (abstraction, inheritance, polymorphism), bilingual design review.
  lead_en: 'FIT2099 Object Oriented Design and Implementation at Monash is design first: UML class and
    interaction diagrams, then Java implementation using abstraction, information hiding, inheritance,
    and polymorphism. Projects and quizzes expect you to justify the design — not only that the feature
    runs.'
  lead_cn: Monash 的 FIT2099 Object Oriented Design and Implementation 先做设计再写代码： UML 类图 / 交互图，再用 Java 实现抽象、信息隐藏、继承、多态。项目和
    quiz 要你能说清 为什么这样设计，不只是功能能跑。
  overview_en: Learning outcomes stress iterative OO design against requirements, describing design quality,
    implementing in Java, systematic refactor / debug in an IDE, and team practice with version control.
    Students stall when diagrams diverge from classes, when inheritance choices fight later requirements,
    or when the rubric asks for a design story the code never shows.
  overview_cn: 课纲强调：按需求迭代做 OO 设计、评价设计质量、用 Java 实现、在 IDE 里有条理地重构 / debug， 以及用版本控制和同学协作。常见卡住：图和真实类对不上；继承选错，后面需求一改就难受；
    评分要设计说明，代码里却写不出来。
  topics:
  - en: UML class diagrams and interaction diagrams
    cn: UML 类图与交互图
  - en: Responsibilities, collaboration, information hiding
    cn: 职责、协作、信息隐藏
  - en: Inheritance and polymorphism in Java
    cn: Java 里的继承与多态
  - en: Refactor / debug with IDE and version control
    cn: 用 IDE 和版本控制做重构 / debug
  stuck:
  - en: Features work; design choices cannot be explained
    cn: 功能能写，设计理由说不清
  - en: Neat diagrams that do not match the classes
    cn: 图画得整齐，和真实类对不上
  - en: Inheritance / coupling fights later requirements
    cn: 继承 / 耦合选错，后面需求改不动
  session_angles:
  - en: Responsibilities → names → diagram → code
    cn: 先职责 → 再命名 → 再画图 → 再写代码
  - en: You implement; we check the design against the rubric
    cn: 你实现；我们按评分核对设计说明
  - en: Short design critiques like quiz / review prompts
    cn: 按 quiz / review 题型做短设计点评
  tutoring:
  - en: 'Lecture sync: bilingual OO vocabulary tied to small Java examples.'
    cn: 跟课：OO 术语中英对照，绑到小 Java 例子上。
  - en: 'Assignments: design review + implementation debug.'
    cn: 作业：看设计 + 帮你 debug 实现。
  - en: 'Quiz / review prep: justify designs under exam-style prompts.'
    cn: Quiz / review：按考试题型练「为设计辩护」。
- code: FIT3152
  title: Data Analytics
  theme: data-science
  meta_description_en: 'FIT3152 Monash Data Analytics tutoring. R / RStudio: cleanse, visual analysis,
    networks, statistical learning, clustering, NLP; bilingual write-ups.'
  lead_en: 'FIT3152 Data Analytics at Monash introduces big-data style analysis in R / RStudio: data management
    and transformation, visual analysis, social network analysis, statistical learning, clustering, and
    natural language processing. Assessment expects a justified pipeline — not only busy plots.'
  lead_cn: Monash 的 FIT3152 Data Analytics 用 R / RStudio 做偏大数据场景的分析：数据整理与变换、 可视化、社会网络分析、统计学习、聚类、自然语言处理。作业要的是说得清的分析流程，
    不是图很多但解释没有。
  overview_en: 'Outcomes: turn a real problem into an analytics task, cleanse and prepare data, analyse
    with statistical / graphical / ML techniques, validate results, and communicate to a broad audience.
    Applied sessions run through the semester. Students stall when method names blur, when plots are not
    validated, or when the write-up cannot defend assumptions.'
  overview_cn: 课纲要求：把实际问题变成分析任务、清洗准备数据、用统计 / 图形 / 机器学习方法分析、 验证结果，再写成别人能看懂的报告。学期里有 applied session。常见卡住：方法名混在一起；
    图画了却不验证；报告里假设说不清。
  topics:
  - en: Data cleansing and transformation in R
    cn: 用 R 做清洗与变换
  - en: Visual analysis with a clear question
    cn: 带着明确问题做可视化
  - en: Clustering and statistical learning basics
    cn: 聚类与统计学习基础
  - en: Social network analysis and text / NLP tasks
    cn: 社会网络分析与文本 / NLP 任务
  - en: Validate results and write the claim carefully
    cn: 验证结果，报告结论写严谨
  stuck:
  - en: Tool output produced; interpretation missing
    cn: 工具输出有了，解释没有
  - en: Brief terms do not map to the R steps you ran
    cn: Brief 里的词对不上你在 R 里做的步骤
  - en: Story fitted to whatever the software printed
    cn: 软件吐什么结论就写什么
  session_angles:
  - en: Brief → question → method → claim checklist
    cn: Brief → 问题 → 方法 → 结论清单
  - en: You run R; we pressure-test the interpretation
    cn: 你跑 R；我们一起压测解释是否站得住
  - en: Short exam-style interpretation drills
    cn: 考试风格的短解读练习
  tutoring:
  - en: 'Lecture sync: bilingual analytics topics aligned with R lab language.'
    cn: 跟课：分析主题中英对照，对齐 R lab 用语。
  - en: 'Assignments: pipeline and write-up review with you driving RStudio.'
    cn: 作业：看流水线和报告，你操作 RStudio。
  - en: 'Exam prep: timed interpretation of outputs and assumptions.'
    cn: 考前：限时练读输出和假设。
- code: FIT3155
  title: Advanced Data Structures and Algorithms
  theme: algorithms
  meta_description_en: FIT3155 Monash Advanced DSA tutoring. Amortized analysis, advanced sort/search,
    tree/string/graph structures, proofs and complexity; bilingual drills.
  lead_en: 'FIT3155 Advanced Data Structures and Algorithms at Monash goes past intro DSA: amortized analysis,
    advanced sorting and searching, tree / string / graph structures, number-theoretic algorithms, and
    proving correctness with space / time arguments. Labs and workshops expect the invariant, the complexity
    claim, and the code to match.'
  lead_cn: Monash 的 FIT3155 Advanced Data Structures and Algorithms 比入门 DSA 更深： 均摊分析、进阶排序 / 查找、树 / 字符串
    / 图结构、数论相关算法，还要证明正确性并说清 时空复杂度。Lab / workshop 要求不变量、复杂度结论和代码对得上。
  overview_en: Assessment typically includes artefacts and an exam. Students stall when proof sketches
    stay vague, when asymptotic notation is written without a plain claim, or when a correct idea dies
    in implementation bugs under time pressure.
  overview_cn: 考核一般有作业 artefact 和考试。常见卡住：证明只写个大概；渐近记号写了，白话结论没有； 思路对，限时一写代码就挂。
  topics:
  - en: Amortized analysis
    cn: 均摊分析
  - en: Advanced sorting and searching
    cn: 进阶排序与查找
  - en: Tree, string, and graph data structures / algorithms
    cn: 树、字符串、图的数据结构与算法
  - en: Correctness proofs and space / time complexity
    cn: 正确性证明与时空复杂度
  stuck:
  - en: Intuition OK; proof incomplete or complexity wrong
    cn: 直觉对，证明不完整或复杂度写错
  - en: Asymptotic notation without a plain-language claim
    cn: 只会写渐近记号，说不清大白话结论
  - en: Exam pseudocode unreadable under time pressure
    cn: 考试限时读伪代码读不动
  session_angles:
  - en: Write the invariant before code
    cn: 写代码前先写不变量
  - en: Dry-run on a tiny example, then generalise
    cn: 先在小例子上手推，再一般化
  - en: Timed proof + code pairing drills
    cn: 限时证明 + 代码配对练习
  tutoring:
  - en: 'Lecture sync: bilingual algorithm ideas until proofs and code share vocabulary.'
    cn: 跟课：算法思路中英对照，证明和代码用同一套词。
  - en: 'Assignments: design + debug with you implementing.'
    cn: 作业：设计 + debug，你来实现。
  - en: 'Exam prep: timed drills on proofs, complexity, and reading pseudocode.'
    cn: 考前：限时练证明、复杂度和读伪代码。
- code: FIT5197
  title: Statistical Data Modelling
  theme: data-science
  meta_description_en: FIT5197 Monash Statistical Data Modelling tutoring. Probability, MLE, CI, hypothesis
    tests, regression / classification, clustering; bilingual help.
  lead_en: 'FIT5197 Statistical Data Modelling at Monash builds the maths / stats base for later data
    science and ML units: sample statistics, probability, expectation, parametrised distributions, maximum
    likelihood, confidence intervals, hypothesis testing, then predictive models (regression / classification)
    and unsupervised clustering. The hard part is reading output and defending the model — not only calling
    a library function.'
  lead_cn: Monash 的 FIT5197 Statistical Data Modelling 给后面的数据科学 / 机器学习课打统计基础： 样本统计量、概率、期望、参数分布、极大似然、置信区间、假设检验，再到回归
    / 分类这类预测模型， 以及聚类。难的是会读输出、能说清为什么选这个模型，不只是调用库函数。
  overview_en: 'Outcomes: EDA with descriptive stats, inferential models, predictive models, sampling
    / simulation / tests, implement models in code, and interpret results. Students stall when model names
    blur, diagnostics are ignored, or exam questions test interpretation instead of button clicks.'
  overview_cn: 课纲要求：用描述统计做 EDA、建推断模型、建预测模型、做抽样 / 模拟 / 检验、用代码实现， 并解释结果。常见卡住：模型名搅在一起；诊断图画了不会读；考题考解读，不考点哪里。
  topics:
  - en: Probability, expectation, and common distributions
    cn: 概率、期望与常见分布
  - en: MLE, confidence intervals, hypothesis testing
    cn: 极大似然、置信区间、假设检验
  - en: Regression and classification as predictive models
    cn: 回归与分类（预测模型）
  - en: Clustering as unsupervised grouping
    cn: 聚类（无监督分组）
  - en: Diagnostics and honest interpretation in the write-up
    cn: 诊断图，以及报告里老实写结论
  stuck:
  - en: Assignment brief makes sense in class, freezes you alone
    cn: 作业 brief 课上听得懂，自己对着就停住
  - en: Diagnostic plots produced but not read
    cn: 诊断图做了却不会读
  - en: Exam asks interpretation, not software clicks
    cn: 考题考解读，不考点哪里
  session_angles:
  - en: Question → candidate models → diagnostics → claim
    cn: 问题 → 候选模型 → 诊断 → 结论
  - en: You fit; we read the uncomfortable diagnostics together
    cn: 你拟合；我们一起读难看的诊断
  - en: Short interpretation drills under exam wording
    cn: 考试措辞下的短解读练习
  tutoring:
  - en: 'Lecture sync: bilingual modelling concepts aligned with lab language.'
    cn: 跟课：建模概念中英对照，对齐 lab 用语。
  - en: 'Assignments: model choice and write-up review with you driving the software.'
    cn: 作业：看模型选择和报告，你操作软件。
  - en: 'Exam prep: timed interpretation of outputs and assumptions.'
    cn: 考前：限时练读输出和假设。
- code: FIT9136
  title: Introduction to Python Programming
  theme: programming
  meta_description_en: FIT9136 Monash Introduction to Python Programming tutoring. Control flow, datatypes,
    functions, OOP basics, OnTrack portfolio; bilingual help.
  lead_en: 'FIT9136 Introduction to Python Programming at Monash covers programming fundamentals: control
    structures, built-in and complex datatypes, modularity, basic libraries, good practices, and team
    coding. Assessment is portfolio-style (OnTrack pass tasks / in-class discussion) — “it runs” is not
    enough if the structure and hand-execution story are weak.'
  lead_cn: Monash 的 FIT9136 Introduction to Python Programming 是 Python 入门：控制结构、 内置和复合数据类型、模块化、常用库、良好习惯，以及小组协作。考核偏
    OnTrack 作品集 / 课上讨论——代码能跑不够，结构和手推执行也要说得清。
  overview_en: Outcomes include systems thinking about program structure, implementing with sequence /
    selection / iteration / functions / types / libraries, hand-executing code to explain state, disciplined
    test / debug / document habits, and basic OOP organisation. Students stall when briefs assume prior
    CS habits, when OnTrack tasks fail discussion sign-off, or when edge cases are never tested.
  overview_cn: 课纲要求：说清程序结构、会写顺序 / 分支 / 循环 / 函数 / 类型 / 库调用、能手推执行解释状态、 有测试 / debug / 文档习惯，并用基础 OOP 组织代码。常见卡住：题干默认你有
    CS 基础； OnTrack 任务过不了课上讨论；边界情况没测。
  topics:
  - en: Sequence, selection, iteration, and functions
    cn: 顺序、分支、循环与函数
  - en: Built-in / complex datatypes and program state
    cn: 内置 / 复合类型与程序状态
  - en: Hand execution and debugging method
    cn: 手推执行与 debug 方法
  - en: Basic OOP structure and readable modules
    cn: 基础 OOP 结构与可读模块
  - en: OnTrack portfolio tasks and edge-case testing
    cn: OnTrack 作品集任务与边界测试
  stuck:
  - en: Syntax OK; no clear plan for the task
    cn: 语法没问题，任务没有清晰计划
  - en: OnTrack discussion / sign-off fails
    cn: OnTrack 课上讨论 / 签字过不了
  - en: Autograder or tests fail with no debug method
    cn: 自动测试挂了，没有 debug 步骤
  session_angles:
  - en: Brief → plan → code → edge cases
    cn: Brief → 计划 → 代码 → 边界
  - en: You type; we keep the plan visible beside the editor
    cn: 你打字；计划放在编辑器旁边对照
  - en: Short quiz-style foundation drills
    cn: 基础题短练
  tutoring:
  - en: 'Lecture sync: bilingual foundations so Python vocabulary matches workshops.'
    cn: 跟课：Python 基础中英对照，对齐 workshop 用语。
  - en: 'Portfolio tasks: plan review and live debug.'
    cn: 作品集任务：看计划、现场 debug。
  - en: 'In-class / quiz prep: timed foundation drills and hand execution.'
    cn: 课上 / quiz：限时基础练和手推执行。
- code: FIT5202
  title: Data Processing for Big Data
  material: FIT5202
  theme: data-science
  meta_description_en: FIT5202 Monash tutoring (Data Processing for Big Data). Stuck on Spark RDD vs DataFrame,
    ML pipelines, or Kafka streaming checkpoints? Bilingual PySpark help.
  lead_en: FIT5202 is Spark under deadline pressure. Weeks move from volume / parallel DB ideas into RDD
    and DataFrame APIs, then ML pipelines, clustering, and a Kafka + Structured Streaming assignment.
    The hard part is keeping the cluster mental model, the notebook, and the checkpoint/output layout
    aligned — not memorising one Spark transform.
  lead_cn: FIT5202 是 DDL 压力下的 Spark 课。周课从 volume / 并行库概念进到 RDD 与 DataFrame， 再进 ML pipeline、聚类，以及 Kafka
    + Structured Streaming 作业。难的不是背一个 transform，而是让集群心智模型、notebook 与 checkpoint / 输出目录说的是同一件事。
  overview_en: 'Data Processing for Big Data centres on Apache Spark (PySpark): parallel search, joins,
    aggregation / sort / groupBy, then featurization, estimators / transformers / pipelines, classification,
    clustering, and collaborative filtering. Assessments mirror that arc — A1 analyses property data with
    RDDs and DataFrames; A2A builds energy-prediction models; A2B wires a Kafka producer, Spark streaming
    job, and consumer with watermarks and parquet sinks. Students stall when partitioning talk stays abstract,
    when RDD vs DataFrame choice is unclear, when ML stages silently mismatch schemas, or when streaming
    only works until the first checkpoint restart. Sample slides from our concept-review tutoring deck
    are below.'
  overview_cn: Data Processing for Big Data 以 Apache Spark（PySpark）为主线：并行搜索、join、 aggregation / sort /
    groupBy，再进特征化、estimator / transformer / pipeline、 分类、聚类与协同过滤。作业跟着这条弧走——A1 用 RDD / DataFrame 分析房产数据；
    A2A 做能耗预测模型；A2B 串起 Kafka producer、Spark streaming 与 consumer，还要管 watermark 与 parquet 输出。卡点常在分区概念停在抽象层、RDD
    vs DataFrame 分不清、 ML stage schema 对不上，或 streaming 一重启 checkpoint 就崩。 下方有我们概念复习辅导课件的样例页。
  topics:
  - en: SparkSession, partitioning, and local-cluster mental models
    cn: SparkSession、分区与本地集群心智模型
  - en: RDD vs DataFrame / SQL for the same property-style query
    cn: 同一类房产查询下的 RDD vs DataFrame / SQL
  - en: Parallel joins, aggregations, sort, and groupBy
    cn: 并行 join、聚合、排序与 groupBy
  - en: ML pipelines — transformers, estimators, featurization
    cn: ML pipeline：transformer、estimator、特征化
  - en: Classification, clustering, and model persistence
    cn: 分类、聚类与模型持久化
  - en: Kafka + Structured Streaming, watermarks, and checkpoints
    cn: Kafka + Structured Streaming、watermark 与 checkpoint
  stuck:
  - en: RDD code runs, but the Markdown explanation of partitioning is empty
    cn: RDD 能跑，分区策略的 Markdown 解释却是空的
  - en: DataFrame schema / join keys wrong → silent nulls or exploded rows
    cn: DataFrame schema / join key 错了 → 静默 null 或行数爆炸
  - en: Pipeline stages compile, prediction columns never appear
    cn: Pipeline stage 能编过，预测列却始终不出现
  - en: Kafka topics up, streaming notebook empty until the deadline panic
    cn: Kafka topic 建了，streaming notebook 空转到 DDL 才慌
  session_angles:
  - en: 'Restate each task as: input → Spark abstraction → output schema'
    cn: 每个任务都说成：输入 → Spark 抽象 → 输出 schema
  - en: You drive the notebook / Docker image; we chase the failing stage together
    cn: 你来跑 notebook / Docker 环境，我们一起追失败 stage
  - en: Clean restart checklist for Kafka, checkpoints, and parquet sinks
    cn: Kafka、checkpoint、parquet 输出的干净重启清单
  tutoring:
  - en: 'Lecture sync: bilingual walkthrough of Spark volume / ML weeks so lab language matches the slides.'
    cn: 同步跟课：用中英双语把 Spark volume / ML 周讲透，与 lab 用语对齐。
  - en: 'Assignments: approach review for A1 RDD/DF, A2A modelling, and A2B streaming debug.'
    cn: 作业辅导：拆 A1 RDD/DF、A2A 建模与 A2B streaming，现场 debug。
  - en: 'Assessment prep: short drills on when to use which Spark API and how to read streaming failures.'
    cn: 评估突击：短练何时用哪种 Spark API，以及怎么读 streaming 报错。
  sample_slides:
    title_en: FIT5202 — sample slides
