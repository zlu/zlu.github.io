- code: ETX3500
  title: High Dimensional Data Analysis
  aliases:
  - ETX5500
  material: etx3500-5500-High-Dimensional-Data-Analysis
  theme: data-science
  meta_description_en: ETX3500 / ETX5500 Monash High Dimensional Data Analysis tutoring. Cluster, PCA,
    MDS, factor analysis in R; bilingual R Markdown help.
  lead_en: 'ETX3500 / ETX5500 High Dimensional Data Analysis (Monash Business / EBS) is multivariate methods
    for survey-style data with many variables: cluster analysis; PCA, correspondence analysis, and multidimensional
    scaling for dimension reduction; factor analysis for explaining outcomes. Early weeks also lock in
    R, tidy data, ggplot, and R Markdown so exercises and the group report can knit.'
  lead_cn: Monash 的 ETX3500 / ETX5500 High Dimensional Data Analysis 学的是多变量方法，适合问卷这类变量很多的数据： 聚类；PCA、对应分析、多维尺度这类降维；因子分析用来解释结果。前几周还会把
    R、tidy data、ggplot、 R Markdown 用熟，后面练习和小组报告才能顺利 knit。
  overview_en: Assessment typically mixes short individual exercises, a quiz, a group analysis report,
    and a final exam. Seminars mix theory and practice; tutorials are R hands-on. Students stall when
    R Markdown will not knit, when they run a method without saying what changed in the table, or when
    the write-up cannot defend method choice (cluster vs PCA vs factor). Sample slides from our concept-review
    tutoring deck are below.
  overview_cn: 考核一般是个人短练习、小测、小组分析报告和期末考试。Seminar 讲理论和操作，tutorial 主要在 R 里练。 常见卡住：R Markdown knit 不出来；方法跑了但说不清表里发生了什么；报告里选
    cluster / PCA / factor 却讲不出理由。 下方有我们概念复习辅导课件的样例页。
  topics:
  - en: R, tidyverse, ggplot, and knit-able R Markdown
    cn: R、tidyverse、ggplot，以及能 knit 的 R Markdown
  - en: Cluster analysis for distinct groups
    cn: 用聚类找出不同组别
  - en: PCA, correspondence analysis, multidimensional scaling
    cn: PCA、对应分析、多维尺度（降维 / 可视化）
  - en: Factor analysis for explaining / predicting outcomes
    cn: 用因子分析解释或预测结果
  - en: Reading output tables and plots in plain language
    cn: 用白话读输出表和图
  stuck:
  - en: R / RStudio / knit setup blocks the first exercises
    cn: 前几周卡在 R / RStudio / knit 环境
  - en: Method names memorised; unclear what the output means
    cn: 方法名背了，输出表看不懂
  - en: Plots done, but the report cannot defend the method choice
    cn: 图有了，报告说不清为什么选这个方法
  - en: 'Group report: five people, inconsistent R Markdown structure'
    cn: 小组报告五人分工，R Markdown 结构对不齐
  session_angles:
  - en: 'Each method as: input table → transform → what to report'
    cn: 每个方法按「输入表 → 变换 → 报告写什么」过一遍
  - en: Bilingual glossary for the week’s terms next to R output
    cn: 本周术语中英对照，对着 R 输出看
  - en: Exercise + short interpretation, not only code that runs
    cn: 练习既要跑通，也要能解释
  tutoring:
  - en: 'Lecture sync: bilingual catch-up on the week’s multivariate topic + R workflow.'
    cn: 跟课：本周多变量主题 + R 流程，中英对照补。
  - en: 'Exercises / tutorials: you drive R; we check method choice and knit.'
    cn: 练习 / tutorial：你操作 R；我帮你看方法选择和能不能 knit。
  - en: 'Exam / quiz prep: short drills on when to use cluster, PCA, MDS, factor analysis.'
    cn: 考前：短练什么时候用聚类、PCA、MDS、因子分析。
