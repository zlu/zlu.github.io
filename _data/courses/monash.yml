- code: FIT5196
  title: Data Wrangling
  material: FIT5196-datawrangling
  theme: data-science
  meta_description_en: FIT5196 Monash Data Wrangling tutoring. A1 text parse / vocab / countvec, A2 dirty·outlier·missing
    cleansing, bilingual pandas notebooks.
  lead_en: 'FIT5196 Data Wrangling at Monash is about making raw data usable in Python (mostly pandas
    notebooks): parse messy files, assess quality, clean, integrate, and leave a method trail. A1-style
    work is semi-structured text → tidy tables plus vocab / count vectors. A2-style work is dirty / outlier
    / missing tables with EDA before each fix. Markers care that the pipeline re-runs cleanly — not that
    one lucky cell once worked.'
  lead_cn: Monash 的 FIT5196 Data Wrangling 主要练一件事：用 Python（多半是 pandas notebook）把脏数据做成能分析的数据。 流程就是解析、检查质量、清洗、整合，再把做法写清楚。A1
    常见是半结构化文本抽字段，再做 vocab / count vector； A2 常见是 dirty / outlier / missing 三张表，要先 EDA 再改。改卷看的是能不能干净复跑，不是某次碰巧跑通。
  overview_en: Unit objectives line up with parse → quality → clean → integrate → document. Group assessments
    often mix Excel + mis-structured text dumps; wrong group zip means zero output marks. Sample slides
    below are from our FIT5196 tutoring deck (not university lecture notes). Bring your brief, rubric,
    and notebook when you book.
  overview_cn: 课纲目标对应：解析 → 质量检查 → 清洗 → 整合 → 写清过程。小组作业常混 Excel 和半结构化文本； 输错小组 zip，输出分经常直接是零。下面样例页来自我们的 FIT5196
    辅导课件（不是学校讲义）。 预约时请带上你自己的 brief、评分表和 notebook。
  topics:
  - en: Semi-structured text / Excel parse into JSON and CSV schemas
    cn: 半结构化文本 / Excel 解析成 JSON、CSV 规定格式
  - en: Vocab, count vectors, token rules, and stopwords
    cn: Vocab、count vector、分词规则与停用词
  - en: EDA-first dirty / outlier / missing cleansing
    cn: 先 EDA，再做 dirty / outlier / missing 清洗
  - en: Joins with helper tables without silent row inflation
    cn: 和辅助表 join，别悄悄涨行或造 NaN
  - en: Rubric methodology + re-runnable group notebooks
    cn: 评分里的 methodology，以及能复跑的小组 notebook
  stuck:
  - en: Wrong group input zip → output marks go to zero
    cn: 小组输入 zip 拿错 → 输出分归零
  - en: Regex / field extract OK on sample, fails on the full dump
    cn: 样例上正则能过，全量文件就挂
  - en: Assignment brief makes sense in class, freezes you alone
    cn: 作业 brief 课上听得懂，自己对着就停住
  - en: Group notebook paths break; declaration / ownership unclear
    cn: 小组 notebook 路径一换就挂，声明和分工也不清
  session_angles:
  - en: Brief → parse / clean checklist → you type → re-check schema
    cn: Brief → 解析/清洗清单 → 你来敲 → 再对输出格式
  - en: You drive the notebook; we check joins, missingness, and outputs
