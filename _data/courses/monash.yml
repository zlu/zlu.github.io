- code: ENG1014
  title: Engineering Numerical Analysis
  material: eng1014
  theme: math-for-cs
  meta_description_en: ENG1014 Monash tutoring (Engineering Numerical Analysis). Stuck on curve fitting,
    numerical integration / ODEs, or the CO₂ assignment interview? Bilingual help.
  lead_en: ENG1014 teaches numerical methods through Python, not through abstract proofs alone. Weekly
    notes move from numerical programming and data communication into curve fitting, program control,
    equation solving, integration, and ODEs — then a climate / CO₂ assignment you must explain in interview.
    The hard part is connecting the maths object to a stable numpy routine the demonstrator can interrogate.
  lead_cn: ENG1014 用 Python 教数值方法，不只背证明。周笔记从数值编程与数据表达，进到曲线拟合、 程序控制、方程求解、积分与 ODE，再接到气候 / CO₂ 大作业，还要过面试讲解。难的是把
    数学对象接到 demonstrator 追问得动的稳定 numpy 流程上。
  overview_en: 'Engineering Numerical Analysis covers coding for numerical work in the unit environment
    (numpy, matplotlib, eng1014.py — pandas banned in the assignment): importing and preparing data, linear
    / non-linear curve fitting, program control, numerical equation solving, integration, and ODE solvers,
    with workshop notebooks and quizzes each week. The individual assignment (“Coding for Climate Change”)
    expects template-faithful outputs and an oral defence of your approach. Students stall when they treat
    notebooks as disposable scratchpads, when fit quality is never checked, or when interview questions
    expose code they cannot explain. Sample slides from our concept-review tutoring deck are below.'
  overview_cn: Engineering Numerical Analysis 在课程环境里用数值编程（numpy、matplotlib、eng1014.py， 作业禁用 pandas）：导入与准备数据、线性
    / 非线性曲线拟合、程序控制、数值方程求解、 积分与 ODE，每周还有 workshop notebook 与 quiz。个人大作业「Coding for Climate Change」 要求严格按模板出结果，并在面试里讲清思路。卡点常在把
    notebook 当一次性草稿、从不检查 拟合质量，或面试一问就露馅——代码自己也讲不清。 下方有我们概念复习辅导课件的样例页。
