- code: FIT5124
  title: Emerging Topics for Cybersecurity in Practice
  material: fit5124-networking-ml
  theme: security
  meta_description_en: FIT5124 Monash tutoring (Emerging Cybersecurity). Stuck on ML privacy attacks —
    model extraction, membership inference — or defence write-ups? Bilingual help.
  lead_en: FIT5124 is cybersecurity where the lab is a machine-learning system. Assessment work on privacy
    attacks (model extraction, membership inference) expects a clear threat model, a working experiment,
    and defences you can justify. The hard part is not running a notebook once — it is explaining attacker
    goals, assumptions, and why a countermeasure actually reduces the risk.
  lead_cn: FIT5124 是把机器学习系统当成安全实验场的课。隐私攻击评估（模型窃取、成员推断） 要求威胁模型说清、实验能跑、防御说得出来。难的不是 notebook 跑通一次，而是讲清 攻击者目标、假设，以及反制措施为什么真的降低风险。
  overview_en: Emerging Topics for Cybersecurity in Practice focuses on security and privacy risks in
    modern ML systems. The privacy-attacks assessment asks you to explain objectives and threat models
    with real-world examples, then design and implement model extraction and membership inference attacks
    with countermeasures — marked on technical correctness, clarity, and presentation quality. Students
    stall when attack code is copied without a threat model, when metrics are reported without saying
    what “success” means for the attacker, or when defences are named but not evaluated.
  overview_cn: Emerging Topics for Cybersecurity in Practice 关注现代 ML 系统的安全与隐私风险。 隐私攻击作业要求结合真实案例讲清目标与威胁模型，再设计并实现模型窃取与成员推断
    及对应防御——按技术正确性、表述清晰与呈现质量给分。卡点常在只抄攻击代码没有威胁 模型、报了指标却说不清对攻击者而言何谓成功，或防御只点名不评估。
  topics:
  - en: Threat models for ML systems and privacy risk
    cn: 面向 ML 系统的威胁模型与隐私风险
  - en: Model extraction — goals, setup, and evidence
    cn: 模型窃取：目标、设置与证据
  - en: Membership inference — attack success vs chance
    cn: 成员推断：攻击成功 vs 随机水平
  - en: Defences and what they actually change in the metrics
    cn: 防御及其在指标上真正改变了什么
  - en: Write-ups that separate method, result, and claim
    cn: 区分方法、结果与结论的报告写法
  stuck:
  - en: Attack notebook runs; threat model paragraph is still vague
    cn: 攻击 notebook 能跑，威胁模型段落仍然含糊
  - en: Accuracy / attack-rate numbers with no baseline to compare
    cn: 准确率 / 攻击成功率没有基线可比
  - en: Defence named from a paper, never measured on your own run
    cn: 防御从论文里点了名，从未在自己的实验上测过
  - en: Report reads like a tool log instead of an argument
    cn: 报告读起来像工具日志，不像论证
  session_angles:
  - en: One paragraph threat model before any attack code
    cn: 写任何攻击代码前先写一段威胁模型
  - en: You run the experiment; we interpret metrics against the attacker goal
    cn: 你来跑实验；我们按攻击者目标解读指标
  - en: Structure the PDF around tasks 3.x / 4.x the marker expects
    cn: 按改卷人期待的 3.x / 4.x 任务结构组织 PDF
  tutoring:
  - en: 'Lecture sync: bilingual walkthrough of ML privacy attack ideas and vocabulary.'
    cn: 同步跟课：用中英双语把 ML 隐私攻击思路与术语讲清。
  - en: 'Assignments: threat-model review, experiment debug, and defence evaluation.'
    cn: 作业辅导：威胁模型评审、实验 debug 与防御评估。
  - en: 'Write-up prep: clarity drills so technical ideas survive the presentation mark.'
    cn: 报告突击：练表述清晰，让技术点撑住呈现分。
