- code: FIT1008
  title: Fundamentals of Algorithms
  aliases:
  - FIT2085
  material: fit1008
  theme: algorithms
  meta_description_en: FIT1008 / FIT2085 Monash tutoring (Fundamentals of Algorithms). Stuck on complexity,
    ADTs, hash tables, or recursive sorts? Bilingual invariant + code drills.
  lead_en: FIT1008 / FIT2085 is algorithms and ADTs with complexity talk attached. Lectures move from
    Big-O into sorting, stacks / queues / sets, array and linked lists, iterators, hash tables, and recursion.
    Workshops and applied sessions expect you to implement, not only recognise the diagram. The hard part
    is keeping the invariant, the complexity claim, and the Python code aligned.
  lead_cn: FIT1008 / FIT2085 是带复杂度表述的算法与 ADT 课。讲座从 Big-O 进到排序、栈 / 队列 / 集合、数组与链表、迭代器、哈希表与递归。Workshop /
    applied 要求你能实现，而不只认得图。 难的是让不变量、复杂度结论和 Python 代码说的是同一件事。
  overview_en: Fundamentals of Algorithms covers algorithmic complexity, classical sorting, abstract data
    types (stacks, queues, sets), list representations (arrays and linked structures), iterators, hash
    tables, and recursive thinking / recursive sorts. Weekly workshops and applied sheets push implementations
    such as circular queues and referential arrays. Students stall when Big-O is memorised without a dry-run,
    when linked-structure pointer updates corrupt the structure, or when a recursive idea has no clear
    base case before coding. Sample slides from our concept-review tutoring deck are below.
  overview_cn: Fundamentals of Algorithms 覆盖算法复杂度、经典排序、抽象数据类型（栈、队列、集合）、 列表表示（数组与链表）、迭代器、哈希表，以及递归思维 / 递归排序。每周
    workshop 与 applied 会推到环形队列、引用数组一类实现。卡点常在 Big-O 只会背不会手推、链表指针 一改就坏结构，或递归还没想清基准情形就动手写。 下方有我们概念复习辅导课件的样例页。
  topics:
  - en: Big-O intuition and comparing algorithm candidates
    cn: Big-O 直觉与算法方案比较
  - en: Sorting algorithms — behaviour, not only names
    cn: 排序算法：看行为，不只背名字
  - en: ADTs — stacks, queues, sets, and when to use each
    cn: ADT：栈、队列、集合及适用场景
  - en: Array lists, linked lists, and iterators
    cn: 数组列表、链表与迭代器
  - en: Hash tables — hashing, collisions, and load
    cn: 哈希表：散列、冲突与负载
  - en: Recursion and recursive sorts with clear base cases
    cn: 带清晰基准情形的递归与递归排序
  stuck:
  - en: Correct intuition, wrong complexity or incomplete workshop justification
    cn: 直觉对，复杂度写错或 workshop 论证不完整
  - en: Linked / circular structures break after one off-by-one update
    cn: 链表 / 环形结构改一处 off-by-one 就全坏
  - en: Hash collision talk stays abstract until the applied sheet
    cn: 哈希冲突概念停在抽象，直到 applied 才慌
  - en: Recursion that works on the demo input and loops on the edge case
    cn: 递归在演示输入能过，边界上死循环
  session_angles:
  - en: Write the invariant and complexity claim before typing the method
    cn: 写方法前先写不变量与复杂度结论
  - en: Dry-run on a tiny array / list, then implement
    cn: 先在小数组 / 链表上手推，再实现
  - en: Workshop-style short questions under time pressure
    cn: 限时做 workshop 风格短问
  tutoring:
  - en: 'Lecture sync: bilingual rebuild of the week’s ADT / algorithm idea until code and proof share
      vocabulary.'
    cn: 同步跟课：用中英双语把当周 ADT / 算法思想讲到代码与论证共用术语。
  - en: 'Workshops / applied: you implement; we check invariants and edge cases.'
    cn: Workshop / applied：你来实现；我们检查不变量与边界。
  - en: 'Exam prep: timed complexity + short implementation drills.'
    cn: 考前突击：限时练复杂度与短实现。
