    cn: 图有了，图注说不清为何这样画
  - en: Joins explode row counts unnoticed
    cn: Join 把行数炸开却没发现
  - en: Notebook order unreproducible for the marker
    cn: notebook 顺序让改卷人无法复现
  session_angles:
  - en: State the question, then pick the table grain
    cn: 先陈述问题，再定表的粒度
  - en: Keep a transform log beside the notebook
    cn: 在 notebook 旁保留变换日志
  tutoring:
  - en: 'Lecture sync for CSCI446: bilingual walkthrough of Data wrangling — tidy tables, joins, missingness
      → EDA and visualisation that answer a question → Feature hygiene and leakage checks → Simple models
      / summaries appropriate to the brief so tutorial language matches.'
    cn: 按 CSCI446 同步跟课：用中英双语把「数据整理 — 整洁表、连接、缺失 → 能回答问题的 EDA 与可视化 → 特征卫生与泄漏检查」讲透，对齐 tutorial 用语。
  - en: 'Assignments / labs: approach review and live debug (you at the keyboard).'
    cn: 作业 / Lab：拆 brief、梳思路，现场 debug（你来操作键盘）。
  - en: 'Exam prep: timed drills on Data wrangling — tidy tables, joins, missingness question shapes for
      this course.'
    cn: 考前突击：按本课「数据整理 — 整洁表、连接、缺失」等题型做限时练习。
  faq:
  - q_en: What does CSCI446 cover?
    q_cn: CSCI446 学什么？
    a_en: Data wrangling — tidy tables, joins, missingness; EDA and visualisation that answer a question;
      Feature hygiene and leakage checks; Simple models / summaries appropriate to the brief…. Say which
      week or assessment you are on when booking.
    a_cn: 数据整理 — 整洁表、连接、缺失、能回答问题的 EDA 与可视化、特征卫生与泄漏检查、适合 brief 的简单模型 / 汇总。预约时说明你卡在哪一周或哪次评估。
  - q_en: What should I bring to the first session?
    q_cn: 第一次课前准备什么？
    a_en: School, course code, deadline, plus your brief/PDF, code, or a screenshot of the lecture slide
      you are stuck on.
    a_cn: 学校、课号、截止日期，再加上 brief/PDF、代码，或卡住的那页课件截图。
