- code: COMP9021
  title: Principles of Programming
  material: comp9021 25T3 期末班资料
  theme: programming
  meta_description_en: COMP9021 UNSW tutoring (Principles of Programming). Stuck on Python quizzes, recursion,
    grids, or OOP? Bilingual Chinese/English help.
  lead_en: 'COMP9021 Principles of Programming is accelerated postgraduate Python: lists/dicts/sets, files
    and formatting, recursion and memoisation, classes, then grids/NumPy/search-style problems under weekly
    quizzes and a heavy final. Tutoring rebuilds the week’s technique, then drills the quiz or exam shape
    you are failing — not a generic “read the brief” pep talk.'
  lead_cn: COMP9021 Principles of Programming 是加速的研究生 Python：list/dict/set、文件与格式化、递归与记忆化、类，再到网格 / NumPy
    / 搜索类题，配上周 quiz 和很重的期末。辅导重建当周技法，再练你挂掉的 quiz / 考试题型——不是泛泛的「先读 brief」鸡汤。
  overview_en: 'One-to-one tutoring for COMP9021 at UNSW (6 UoC, Level 0 bridging, no formal prereq —
    steep curve). Public arc: Python operators and containers → base systems/Unicode/sorting/lambdas →
    complexity, slices, files, bitwise ops → generators, 2-D lists, NumPy, regex → recursion/memoisation
    → classes/OOP → linked structures, stacks/queues/trees, DP, inheritance. Assessment is typically weekly
    quizzes, two assignments, and a large final. Bring your quiz stub, assignment brief, failing test,
    or past-paper style question when you book. Sample slides from our tutoring deck are below.'
  overview_cn: UNSW COMP9021 一对一辅导（6 学分，Level 0 桥接，无正式先修——曲线很陡）。公开主线：Python 运算符与容器 → 进制 / Unicode / 排序
    / lambda → 复杂度、切片、文件、位运算 → 生成器、二维 list、NumPy、正则 → 递归 / 记忆化 → 类 / OOP → 链表结构、栈 / 队列 / 树、DP、继承。考核常见为周
    quiz、两次作业和大头期末。预约时请带上 quiz 骨架、作业 brief、失败测例或真题风格题。下方有辅导课件样例。
