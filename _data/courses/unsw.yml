    cn: 同步跟课：用中英双语把 MIPS → 数据表示 → 文件 / 进程 / 线程讲到与 tut-lab 用语一致。
  - en: 'Labs / assignments: approach review and live debug (you at the keyboard).'
    cn: Lab / 作业：拆题、梳思路，现场 debug（你来操作键盘）。
  - en: 'Weekly-test / exam drills: MIPS traces, bitwise/float encodings, and systems-C question shapes.'
    cn: 周测 / 考前突击：MIPS 手推、位运算 / 浮点编码，以及系统 C 常考题型。
  faq:
  - q_en: What does COMP1521 cover?
    q_cn: COMP1521 学什么？
    a_en: How C runs at machine level — MIPS, data representation, Unix files/processes, plus intro concurrency
