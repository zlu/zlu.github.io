- code: COMP1511
  title: Programming Fundamentals
  theme: programming
  meta_description_en: COMP1511 UNSW tutoring (Programming Fundamentals). Stuck on C, pointers, arrays,
    or autotest? Bilingual Chinese/English help.
  lead_en: 'COMP1511 Programming Fundamentals is UNSW’s first C course: types and control flow, arrays
    and strings, pointers and memory, then structs/linked lists under dense briefs and autotest. Tutoring
    rebuilds the week’s C model, then debugs the lab or assignment where your pointer diagram and the
    failing autotest disagree — not a generic “read the brief” pep talk.'
  lead_cn: COMP1511 Programming Fundamentals 是 UNSW 的第一门 C 课：类型与控制流、数组与字符串、指针与内存，再到结构体 / 链表，配上密 brief
    和 autotest。辅导重建当周 C 模型，再在指针图和失败 autotest 对不上时 对着 Lab / 作业 debug——不是泛泛的「先读 brief」鸡汤。
  overview_en: 'One-to-one tutoring for COMP1511 at UNSW (6 UoC). Public arc: C basics and I/O → control
    flow and functions → arrays/strings → pointers and memory → structs and linked lists → style and testing
    for autotest. Bring your brief, failing autotest, or a screenshot of the lecture slide you are stuck
    on.'
  overview_cn: UNSW COMP1511 一对一辅导（6 学分）。公开主线：C 基础与 I/O → 控制流与函数 → 数组 / 字符串 → 指针与内存 → 结构体与链表 → 面向 autotest
    的风格与测试。预约时请带上 brief、失败 autotest，或卡住的那页课件截图。
  topics:
  - en: C basics — types, control flow, functions, stdio
    cn: C 基础 — 类型、控制流、函数、stdio
  - en: Arrays, strings, and common off-by-one / NUL bugs
    cn: 数组、字符串与常见 off-by-one / NUL 坑
  - en: Pointers, addresses, and the stack vs heap picture
    cn: 指针、地址，以及栈 / 堆图景
  - en: Structs, linked lists, and modular .c / .h layout
    cn: 结构体、链表与 .c / .h 模块划分
  - en: Reading dense COMP1511 briefs and mapping to autotest
    cn: 读密 COMP1511 brief 并映射到 autotest
  - en: Debugging — print / gdb when sample passes but submit fails
    cn: 调试 — 样例能过提交挂时用打印 / gdb
  stuck:
  - en: Local samples pass; autotest fails on string edges or I/O format
    cn: 本地样例能过；autotest 在字符串边界或 I/O 格式挂
  - en: Pointer diagram clear in lecture; your code still segfaults
    cn: 课上指针图画得清，自己的代码仍 segfault
  - en: Brief read thrice; still unsure which ADT or loop structure to build
    cn: brief 读了三遍，仍不确定要建哪个 ADT 或循环结构
  - en: Malloc / free — leak or use-after-free only shows under autotest
    cn: malloc / free — 泄漏或 use-after-free 只在 autotest 下暴露
  - en: Style / header layout fails check while logic looks fine
    cn: 逻辑看起来没问题，风格 / 头文件布局却过不了检查
  session_angles:
  - en: Draw the pointer / array picture before typing
    cn: 动手前先画指针 / 数组图
  - en: 'You drive: we chase the failing autotest with a minimal repro'
    cn: 你来操作：一起用最小复现追失败的 autotest
  - en: Restate I/O and edges from the brief on a whiteboard first
    cn: 先在白板上复述 brief 里的 I/O 与边界
  tutoring:
  - en: 'Lecture sync: bilingual walkthrough of C → arrays/strings → pointers/lists so lab language matches.'
    cn: 同步跟课：用中英双语把 C → 数组 / 字符串 → 指针 / 链表讲透，对齐 Lab 用语。
  - en: 'Labs / assignments: approach review and live debug on your code (you at the keyboard).'
    cn: Lab / 作业：拆题、梳思路，对着你的代码现场 debug（你来操作键盘）。
  - en: 'Exam / weekly-test drills: pointer traces, string edges, and brief-reading under time pressure.'
    cn: 考试 / 周测突击：限时练指针手推、字符串边界与读 brief。
  faq:
  - q_en: What does COMP1511 cover?
    q_cn: COMP1511 学什么？
    a_en: First-year C — control flow, arrays/strings, pointers/memory, structs/lists — under dense briefs
      and autotest. Say which week or lab you are on when booking.
    a_cn: 大一 C——控制流、数组 / 字符串、指针 / 内存、结构体 / 链表，配上密 brief 和 autotest。预约时说明你卡在哪一周或哪个 Lab。
  - q_en: I have never used C — can I still book?
    q_cn: 没用过 C 也能约吗？
    a_en: Yes. Sessions start from the construct you are on (loops → arrays → pointers) and build a debug
      method you can reuse on the next autotest.
    a_cn: 可以。课上从你正在学的构造开始（循环 → 数组 → 指针），练出下一份 autotest 还能用的排查方法。
  - q_en: What should I bring to the first session?
    q_cn: 第一次课前准备什么？
    a_en: Lab or assignment brief, your .c files, the failing autotest output, and the week topic name
      (e.g. pointers, strings, linked lists).
    a_cn: Lab 或作业 brief、你的 .c 文件、失败 autotest 输出，以及当周主题名（如指针、字符串、链表）。
- code: COMP1521
  title: Computer Systems Fundamentals
  theme: systems
  meta_description_en: COMP1521 UNSW tutoring (Computer Systems Fundamentals). Stuck on MIPS, bitwise
    ops, processes, or threads? Bilingual Chinese/English help.
  lead_en: 'COMP1521 Computer Systems Fundamentals bridges C to the machine: MIPS assembly (mipsy), data
    representation (ints, IEEE-754, UTF-8), Unix files and processes, then intro threads and virtual memory.
    Tutoring rebuilds the week’s model, then debugs your tut-lab or assignment when registers, autotest,
    or errno disagree with the lecture.'
  lead_cn: COMP1521 Computer Systems Fundamentals 把 C 接到机器层：MIPS 汇编（mipsy）、数据表示（整数、IEEE-754、UTF-8）、Unix
    文件与进程，再到线程与虚拟内存入门。辅导先重建当周模型，再在寄存器、autotest 或 errno 和课件对不上时，对着你的 tut-lab / 作业 debug。
  overview_en: 'One-to-one tutoring for COMP1521 at UNSW (6 UoC; usually after COMP1511). Public syllabus
    arc: MIPS basics → control → data → functions; integers and bitwise ops; floating point and Unicode;
    file I/O; processes; threads/concurrency; brief virtual memory. Bring your lab exercise, failing autotest,
    or a screenshot of the lecture slide you are stuck on.'
  overview_cn: UNSW COMP1521 一对一辅导（6 学分；通常在 COMP1511 之后）。公开大纲主线：MIPS 基础 → 控制流 → 数据 → 函数；整数与位运算；浮点与 Unicode；文件
    I/O；进程；线程 / 并发；虚拟内存入门。预约时请带上 Lab 题、失败 autotest，或卡住的那页课件截图。
  topics:
  - en: MIPS basics, control, data, and functions (mipsy)
    cn: MIPS 基础、控制流、数据与函数（mipsy）
  - en: C constructs mapped to assembly and calling conventions
    cn: C 构造如何落到汇编与调用约定
  - en: Integer representation and bitwise operations
    cn: 整数表示与位运算
  - en: IEEE-754 floating point and UTF-8 / Unicode
    cn: IEEE-754 浮点与 UTF-8 / Unicode
  - en: Unix file I/O, metadata, and directories
    cn: Unix 文件 I/O、元数据与目录
  - en: Processes; intro to threads and concurrency
    cn: 进程；线程与并发入门
  - en: Brief virtual memory / caching intuition
    cn: 虚拟内存 / 缓存直觉入门
  stuck:
  - en: MIPS control / $ra / stack frame clear in lecture; your program loops or clobbers registers
    cn: 课上 MIPS 控制流 / $ra / 栈帧听得懂，自己的程序却死循环或弄坏寄存器
  - en: Two’s-complement or bitwise exam figures collapse under time pressure
    cn: 限时下补码 / 位运算题目直接崩盘
  - en: IEEE-754 or UTF-8 looks familiar until the exam encoding changes
    cn: IEEE-754 或 UTF-8 眼熟，考试换一种编码就不会算
  - en: C file / process lab fails with errno you cannot map back to the API
    cn: C 文件 / 进程 Lab 因 errno 挂掉，对不上是哪个 API 用错
  - en: Threads race only under timing you cannot reproduce alone
    cn: 线程竞态只在某种时序下出现，自己复现不了
  session_angles:
  - en: Hand-trace registers and memory before editing MIPS or C
    cn: 改 MIPS 或 C 前先手推寄存器与内存
  - en: 'Tut-lab debug: you drive; we chase mipsy output, autotest diffs, and errno'
    cn: Tut-lab 调试：你来操作；一起追 mipsy 输出、autotest diff 和 errno
  - en: Build a bilingual cheat sheet for weekly tests (MIPS + representation + systems C)
    cn: 为周测整理双语速查（MIPS + 数据表示 + 系统 C）
  tutoring:
  - en: 'Lecture sync: MIPS → representation → files / processes / threads in bilingual terms matching
