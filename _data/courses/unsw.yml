  title: Programming Fundamentals
  theme: programming
  lead_cn: >-
    COMP1511 很难的地方，常常不是「完全不会写 C」，而是 brief 读了三遍仍不确定要你实现什么，
    样例能过一提交就被边界和 I/O 卡住。辅导会先把题意和测试对齐，再在你的环境里一起排查。
  overview_cn: >-
    Programming Fundamentals 是 UNSW 入门编程课，作业规格写得很细，autograder 也严。
    留学生常见会卡在：题意翻译成步骤不完整、指针和字符串细节不熟、本地能跑交上去却一片红。
    一对一会按拆题、动手、复盘推进；代码仍由你完成提交，我负责把方法和排查路径讲透。
