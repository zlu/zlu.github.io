  - en: Indexes, plans, and why a query is slow
    cn: 索引、执行计划与慢查询原因
  - en: Transactions — ACID, isolation, locking
    cn: 事务 — ACID、隔离级别、锁
  - en: Integrity constraints and schema evolution
    cn: 完整性约束与 Schema 演化
  - en: Application ↔ DB boundary (ORM / prepared statements)
    cn: 应用与数据库边界（ORM / 预处理语句）
  stuck:
  - en: Join results look right until a duplicate or NULL appears
    cn: Join 结果看起来对，一出现重复或 NULL 就崩
  - en: Normalisation on paper; schema in code still denormalised
    cn: 纸上范式对了，代码里 Schema 仍不规范
  - en: Transaction / isolation questions collapse under time pressure
    cn: 限时下事务 / 隔离级别题直接崩盘
  session_angles:
  - en: Draw the ER, then write the join checklist
    cn: 先画 ER，再写 join 清单
  - en: Explain the plan before tuning indexes
    cn: 调索引前先说清执行计划
  tutoring:
  - en: 'Lecture sync for COMP3311: bilingual walkthrough of ER / relational modelling and normalisation
      → SQL — select, join, aggregation, nested queries → Indexes, plans, and why a query is slow → Transactions
      — ACID, isolation, locking so tutorial language matches.'
    cn: 按 COMP3311 同步跟课：用中英双语把「ER / 关系建模与范式 → SQL — 查询、连接、聚合、嵌套 → 索引、执行计划与慢查询原因」讲透，对齐 tutorial 用语。
