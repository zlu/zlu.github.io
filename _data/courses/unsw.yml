    stack fast and labs fail for reasons that look opaque. Private materials show code submissions / practice
    files. The hard part is turning that arc into a method you can repeat on the next brief — not rereading
    slides the night before.
  lead_cn: 在新南威尔士大学上 COMP2511，抽象叠得快，Lab 挂掉时又常常看不出是概念错还是环境错。现有材料里能看到代码提交 / 练习文件。难的不是考前把课件再扫一遍，而是把这条主线练成下一份
    brief 还能复用的方法。
  overview_en: COMP2511 Software Design And Architecture sits in systems, networks & architecture. Evidence
    from the course folder points to Programming foundations and debugging; Web / mobile app structure.
    Students stall when terminology outruns notes, when a demo makes sense in class but not alone, or
    when the write-up / autograder asks for a method the notebook never made explicit.
  overview_cn: COMP2511 是新南威尔士大学「系统、网络与体系结构」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。从课程材料看，学期里常会绕着编程基础与调试、Web / 移动应用结构这些点转。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告
    / autograder 要的方法在 notebook 里从未写清。
