  code: COMP2521
  lead_cn: COMP2521 同时考结构选择、实现细节和复杂度表述。很多同学卡在「本地样例能过、大数据或边界就崩」， 或代码勉强对却说不清为什么不用另一种结构。辅导会先画清状态，再落到实现和表述。
  overview_cn: Data Structures and Algorithms 要求你在正确性、效率和口头/书面解释之间同时站得住。 常见痛点是指针与服务函数缠在一起、空表等边界没测全、复杂度一问就空——样例能过，大数据或边界却崩。
    一对一会先在纸上画清状态，再落到最小例子和实现，最后才谈优化与怎么把理由说清楚。
  title: Data Structures and Algorithms
  stuck:
  - en: Clear on paper; tangled in C by pointers and helpers
    cn: 纸上清楚，一写进 C 就被指针和服务函数缠住
  - en: Know which structure, cannot explain the trade-off
    cn: 知道用哪种结构，却说不清为什么不用另一种
  - en: Tests hit empty tables, dupes, free — fix one, two appear
    cn: 测试专卡空表、重复键、释放；修一个冒出两个
