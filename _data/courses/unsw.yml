- code: COMP2017
  title: Systems Programming
  material: comp2017-9017-system-programming
  theme: systems
  meta_description_en: COMP2017 tutoring (Systems Programming). Stuck on pointers, fork, IPC, or pthreads
    sync? Bilingual Chinese/English help.
  lead_en: 'COMP2017 Systems Programming is Unix C end-to-end: pointers and the memory model, files and
    linked lists, signals and low-level I/O, then fork, IPC, pthreads, and synchronisation. Tutoring follows
    that technical arc — not week-0 administrivia — and debugs the lab where your process tree, pipe,
    or mutex disagrees with the lecture.'
  lead_cn: COMP2017 Systems Programming 是一整条 Unix C 主线：指针与内存模型、文件与链表、信号与底层 I/O，再到 fork、IPC、pthreads 与同步。辅导跟这条技术线——不做第
    0 周 Administrivia——并在进程树、管道或 mutex 和课件对不上时对着 Lab debug。
  overview_en: 'One-to-one tutoring for COMP2017. Covered lecture themes (from the weekly PDFs, skipping
    admin/unit-intro): C/Unix and memory, aggregates and files, malloc and linked lists, function pointers/signals/I/O,
    preprocessor and linking, processes and fork, interprocess communication, threads, synchronisation,
    and parallel performance. Bring your brief, failing test, or the lecture topic name (e.g. fork, pipes,
    mutex). Sample slides from our systems tutoring deck are below.'
  overview_cn: COMP2017 一对一辅导。按周课 PDF 的实质主题（跳过行政 / 单元介绍）：C/Unix 与内存、聚合与文件、malloc 与链表、函数指针 / 信号 / I/O、预处理与链接、进程与
    fork、进程间通信、线程、同步、并行性能。预约时请带上 brief、失败测例，或主题名（如 fork、管道、mutex）。下方有我们系统方向辅导课件样例。
  topics:
