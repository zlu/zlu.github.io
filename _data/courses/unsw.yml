    (about week 1–3) plus assessed work that expects you to apply the same ideas under deadline pressure.
    Students stall when terminology outruns notes, when a demo makes sense in class but not alone, or
    when the write-up / autograder asks for a method the notebook never made explicit.
  overview_cn: INFO3616 是新南威尔士大学「安全与隐私」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。从课程材料看，学期里常会绕着操作系统 / 系统编程、安全 / 隐私威胁模型与实验这些点转。大约第
    1–3 周有连续周课主线，作业会要求你在 DDL 下用同一套方法。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告 / autograder 要的方法在
    notebook 里从未写清。
  topics:
  - en: OS / systems programming
    cn: 操作系统 / 系统编程
  - en: Security / privacy threat models and labs
    cn: 安全 / 隐私威胁模型与实验
