  - en: Session / persistence bugs that only show on a teammate’s flow
    cn: session / 持久化 bug 只在队友的操作路径下出现
  - en: Bad merge left Git history messy; afraid to undo
    cn: 错误合并后 Git 历史一团糟，不敢 undo
  - en: Features work; demo cannot explain design or complexity choices
    cn: 功能能跑，demo 讲不清设计或复杂度选择
  session_angles:
  - en: Map routes and status codes to a checklist before coding
    cn: 写代码前先把路由与状态码列成清单
  - en: 'Iteration debug: you drive; we chase failing HTTP tests and session edges'
    cn: Iteration 调试：你来操作；一起追失败的 HTTP 测试与 session 边界
  - en: Rehearse the demo — what you own, what changed, what you would improve
    cn: 彩排 demo——你负责什么、改了什么、下一步改进什么
  tutoring:
  - en: 'Lecture sync: JS/TS → testing → Express / auth in bilingual terms used in lab.'
