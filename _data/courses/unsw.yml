  - topics:
      - en: "Unpack the brief: I/O, edge cases, and marking points before coding"
        cn: 先拆 brief：输入输出、边界和评分点，再动手写
      - en: Hand-trace a minimal sample so state changes are clear
        cn: 先手推最小样例，把状态变化走清楚
      - en: Pointers, strings, and file I/O as implementation details
        cn: 指针、字符串与文件读写等实现细节
      - en: "Autograder failures: format, edges, and missing cases"
        cn: autograder 挂掉：格式、边界与漏测用例
    theme: programming
    session_angles:
      - en: List inputs, outputs, edges, and marks — separate from guesses about intent
        cn: 先列输入输出、边界和评分点，和「我以为老师想要什么」分开
      - en: Pseudocode the smallest sample before opening the editor
        cn: 打开编辑器前，先用伪代码走最小样例
      - en: "Ask: is this failure understanding or an implementation detail?"
        cn: 先问：这次失败是理解问题，还是实现细节？
    tutoring:
      - en: "Assignments: align the brief, sketch a path you can finish, then debug with
          you at the keyboard."
        cn: 作业：先对齐 brief，梳一条你能写完的思路，再在你的环境里一起排查。
      - en: "Lecture sync: bilingual walkthrough of the week's ideas until you can
          restate them."
        cn: 同步跟课：用中英双语把本周概念讲到你能复述为止。
      - en: "Habits for later COMP2521: break problems down before chasing structures
          and complexity."
        cn: 为后面的 COMP2521 打底：先练拆题习惯，再谈结构和复杂度。
    code: COMP1511
