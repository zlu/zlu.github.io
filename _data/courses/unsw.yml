  - en: 'Iterations: live debug on your owned routes and tests (you at the keyboard).'
    cn: Iteration：对着你负责的路由与测试现场 debug（你来操作键盘）。
  - en: 'Demo prep: explain HTTP design and test evidence under time pressure.'
    cn: Demo 准备：限时讲清 HTTP 设计与测试证据。
