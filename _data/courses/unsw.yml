  - q_en: I am new to programming — can I still take tutoring?
    q_cn: 零基础也能辅导吗？
    a_en: Yes. The course assumes no prior Python, but the pace is steep. Sessions start from the construct
      you are on (list/dict → recursion → class) and build a method you can reuse on the next quiz.
    a_cn: 可以。课程不假定你会 Python，但节奏很快。课上从你正在学的构造开始（list/dict → 递归 → 类），练出下一份 quiz 还能用的方法。
  - q_en: What should I bring to the first session?
    q_cn: 第一次课前准备什么？
    a_en: Quiz stub or assignment PDF, your attempt, failing output, and the week topic name (e.g. recursion,
