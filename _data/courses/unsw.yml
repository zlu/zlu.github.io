  - en: Python containers — lists, tuples, dicts, sets, strings
    cn: Python 容器 — list、tuple、dict、set、字符串
  - en: Functions, lambdas, generators, slices, and complexity intuition
    cn: 函数、lambda、生成器、切片与复杂度直觉
  - en: Files, directories, formatting, bitwise ops
    cn: 文件 / 目录、格式化、位运算
  - en: Recursion, memoisation, and dynamic programming patterns
    cn: 递归、记忆化与动态规划模式
  - en: Classes / OOP — identity, equality, inheritance
    cn: 类 / OOP — 身份、相等、继承
  - en: 2-D grids, NumPy, regex, DFS/BFS-style search
    cn: 二维网格、NumPy、正则、DFS/BFS 式搜索
  - en: Weekly quiz + assignment problem shapes under time pressure
    cn: 限时下的周 quiz + 作业题型
  stuck:
  - en: Quiz almost finished; slice / mutability / dict-key edges fail
    cn: Quiz 差不多写完；切片 / 可变性 / dict 键边界挂掉
  - en: Recursion idea clear; base case or memo key wrong under the clock
    cn: 递归思路清楚；限时下 base case 或 memo 键写错
  - en: Grid / path questions — cannot settle on a state representation
    cn: 网格 / 路径题 — 状态表示定不下来
  - en: Class works on sample; equality / hashing breaks hidden tests
    cn: 样例上类能跑；相等 / 哈希在隐藏测试崩
  - en: File-parse or format-print questions lose marks on exact output
    cn: 文件解析或格式化打印题在精确输出上丢分
  session_angles:
  - en: Hand-trace a tiny input before editing the quiz skeleton
    cn: 改 quiz 骨架前先手推一个小输入
  - en: 'You type: we chase the failing edge (slice, key, base case, grid bound)'
    cn: 你来打字：一起追失败边界（切片、键、base case、网格边界）
  - en: Timed drill on one exam family — recursion, grid, or OOP
    cn: 限时练一类考试题族 — 递归、网格或 OOP
  tutoring:
  - en: 'Lecture sync: bilingual walkthrough of containers → files → recursion/OOP → grids/NumPy so quiz
      language matches.'
    cn: 同步跟课：用中英双语把「容器 → 文件 → 递归/OOP → 网格/NumPy」讲透，对齐 quiz 用语。
  - en: 'Quizzes / assignments: approach review and live debug on your stub (you at the keyboard).'
    cn: Quiz / 作业：拆题、梳思路，对着你的骨架现场 debug（你来操作键盘）。
  - en: 'Exam prep: timed drills on recursion, grids, file I/O, and class question shapes.'
    cn: 考前突击：按递归、网格、文件 I/O 与类的题型做限时练习。
  faq:
  - q_en: What does COMP9021 cover?
    q_cn: COMP9021 学什么？
    a_en: Accelerated Python problem-solving — containers, files, recursion/DP, OOP, grids/NumPy/search,
      plus weekly quizzes and a large final. Say which quiz week or assignment you are on when booking.
