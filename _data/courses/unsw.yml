    before.
  lead_cn: 在新南威尔士大学上 COMP2017，真正难的往往不是语法，而是 brief 读不透、工具链不熟，以及 autograder 专砸边界。现有材料里能看到大约第 0–12 周的周课笔记、磁盘上的作业
    brief / lab、代码提交 / 练习文件。难的不是考前把课件再扫一遍，而是把这条主线练成下一份 brief 还能复用的方法。
  overview_en: COMP2017 Systems Programming sits in programming & software construction. Evidence from
    the course folder points to OS / systems programming; Security / privacy threat models and labs; Algorithms,
    ADTs, and complexity. There is a weekly arc (about week 0–12) plus assessed work that expects you
    to apply the same ideas under deadline pressure. Students stall when terminology outruns notes, when
    a demo makes sense in class but not alone, or when the write-up / autograder asks for a method the
    notebook never made explicit.
  overview_cn: COMP2017 是新南威尔士大学「编程与软件构造」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。从课程材料看，学期里常会绕着操作系统 / 系统编程、安全 / 隐私威胁模型与实验、算法、ADT
    与复杂度这些点转。大约第 0–12 周有连续周课主线，作业会要求你在 DDL 下用同一套方法。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告 / autograder
    要的方法在 notebook 里从未写清。
