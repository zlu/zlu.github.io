    theme: programming
    session_angles:
      - en: List inputs, outputs, edges, and marks — separate from guesses about intent
        cn: 先列输入输出、边界和评分点，和「我以为老师想要什么」分开
      - en: Pseudocode the smallest sample before opening the editor
        cn: 打开编辑器前，先用伪代码走最小样例
      - en: "Ask: is this failure understanding or an implementation detail?"
        cn: 先问：这次失败是理解问题，还是实现细节？
    tutoring:
      - en: "Assignments: align the brief, sketch a path you can finish, then debug with
