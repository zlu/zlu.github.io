      - en: "Unpack the brief: I/O, edge cases, and marking points before coding"
        cn: 先拆 brief：输入输出、边界和评分点，再动手写
      - en: Hand-trace a minimal sample so state changes are clear
        cn: 先手推最小样例，把状态变化走清楚
      - en: Pointers, strings, and file I/O as implementation details
