    a_cn: 用 mipsy 做 MIPS，再加上带 autotest 的 C 系统练习。请带上失败测例或 starter，对着你的环境 debug。
- code: COMP1531
  title: Software Engineering Fundamentals
  theme: web-mobile
  meta_description_en: COMP1531 UNSW tutoring (Software Engineering Fundamentals). Stuck on Express, TypeScript,
    Git, or project iterations? Bilingual Chinese/English help.
  lead_en: 'COMP1531 Software Engineering Fundamentals is an agile group project course: Git, JavaScript/TypeScript,
    testing, and an HTTP backend (Express, persistence, auth/sessions) you must demo. Tutoring turns the
    iteration interface into routes and tests you can own and explain — not a generic “how to study” talk.'
  lead_cn: COMP1531 Software Engineering Fundamentals 是敏捷小组项目课：Git、JavaScript/TypeScript、测试，以及你要在 demo
    里讲清的 HTTP 后端（Express、持久化、认证 / session）。辅导把 iteration 接口拆成你能负责、能讲清的路由与测试——不是泛泛的「怎么学习」。
  overview_en: 'One-to-one tutoring for COMP1531 at UNSW (6 UoC after COMP1511). Covered practices: Git
    solo/team, JS/TS and packages, dynamic/static verification and lint, JSON interchange, Express HTTP
    servers, persistence, auth/sessions, CI/deployment, and requirements (user stories / use cases). Bring
    your repo, failing test, or iteration brief when you book.'
  overview_cn: UNSW COMP1531 一对一辅导（6 学分，通常在 COMP1511 之后）。覆盖 Git 个人 / 团队、JS/TS 与包管理、动态 / 静态验证与 lint、JSON
    数据交换、Express HTTP、持久化、认证 / session、CI / 部署，以及需求（user story / use case）。预约时请带上仓库、失败测例或 iteration brief。
  topics:
  - en: Git solo and team workflows (branch, review, undo)
    cn: Git 个人与团队工作流（分支、review、撤销）
  - en: JavaScript / TypeScript, npm packages, multi-file imports
    cn: JavaScript / TypeScript、npm 包、多文件导入
  - en: Dynamic & static verification, linting, coverage
    cn: 动态 / 静态验证、lint、覆盖率
  - en: Express HTTP servers and JSON data interchange
    cn: Express HTTP 服务与 JSON 数据交换
  - en: Persistence; authentication, sessions, password hashing
    cn: 持久化；认证、session、密码哈希
  - en: CI, deployment, and iteration demos
    cn: CI、部署与 iteration demo
  - en: Requirements — user stories, use cases, validation
    cn: 需求 — user story、use case、验证
  stuck:
  - en: Iteration interface is clear in the meeting; Express routes freeze you alone
