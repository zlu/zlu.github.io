    from the course folder points to OS / systems programming; Computer architecture and organisation;
    Security / privacy threat models and labs; Automata, formal languages, and proofs. Assessed work expects
    you to apply lecture ideas under deadline pressure. Students stall when terminology outruns notes,
    when a demo makes sense in class but not alone, or when the write-up / autograder asks for a method
    the notebook never made explicit.
