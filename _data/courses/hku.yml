  meta_description_en: COMP1117B HKU tutoring (Computer Programming). Assignment brief (“Assignment3”)
    makes sense in class, freezes you alone? Bilingual Chinese/English help.
  lead_en: COMP1117B Computer Programming at The University of Hong Kong is where briefs, tooling, and
    autograder edge cases hit harder than syntax itself. Private materials show assignment briefs / labs
    on disk, code submissions / practice files. The hard part is turning that arc into a method you can
    repeat on the next brief — not rereading slides the night before.
  lead_cn: 在香港大学上 COMP1117B，真正难的往往不是语法，而是 brief 读不透、工具链不熟，以及 autograder 专砸边界。现有材料里能看到磁盘上的作业 brief / lab、代码提交
    / 练习文件。难的不是考前把课件再扫一遍，而是把这条主线练成下一份 brief 还能复用的方法。
  overview_en: COMP1117B Computer Programming sits in programming & software construction. Evidence from
    the course folder points to Networking layers, packets, and protocols; Programming foundations and
    debugging. Assessed work expects you to apply lecture ideas under deadline pressure. Students stall
    when terminology outruns notes, when a demo makes sense in class but not alone, or when the write-up
    / autograder asks for a method the notebook never made explicit.
  overview_cn: COMP1117B 是香港大学「编程与软件构造」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。从课程材料看，学期里常会绕着网络分层、报文与协议、编程基础与调试这些点转。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告
    / autograder 要的方法在 notebook 里从未写清。
  topics:
  - en: Networking layers, packets, and protocols
    cn: 网络分层、报文与协议
  - en: Programming foundations and debugging
    cn: 编程基础与调试
  - en: Assignment briefs mapped to a step-by-step plan
    cn: 把作业 brief 映射成可执行步骤
  - en: Reading the brief and designing before typing
    cn: 先读题、先设计，再动手写
  - en: Functions, modules, and readable structure
    cn: 函数、模块与可读结构
  - en: Recursion, ADTs, and common lab patterns
    cn: 递归、抽象数据类型与常见 Lab 模式
  stuck:
  - en: Assignment brief (“Assignment3”) makes sense in class, freezes you alone
    cn: 作业 brief（「Assignment3」）课上听得懂，自己对着就停住
  - en: Code almost works; edge cases and error messages have no debug method
    cn: 代码差不多能跑，边界和报错却没有 debug 方法
  - en: Code that “almost works” with no systematic debug plan
    cn: 代码“差不多能跑”，但没有系统调试计划
  - en: Autograder mismatches from edge cases or I/O format
    cn: 边界条件或 I/O 格式导致 autograder 不过
  - en: Copy-paste solutions that cannot be explained in viva / demo
    cn: 粘贴来的解法，演示或口头答不上来
  session_angles:
  - en: Map the brief to a short checklist; you drive, we chase the failing case
    cn: 把 brief 映射成短清单；你来操作，一起追失败测例
  - en: You type in your environment; we keep the plan visible beside the editor
    cn: 你在自己的环境里打字；计划始终放在编辑器旁边
  - en: Restate the problem and sketch data flow on a whiteboard
    cn: 复述题意，白板画出数据流
