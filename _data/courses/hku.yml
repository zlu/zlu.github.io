- code: COMP3340
  title: Applied Deep Learning
  department: School of Computing and Data Science
  theme: machine-learning
  meta_description_en: COMP3340 tutoring (Applied Deep Learning). Stuck on Neural net basics — layers,
    activations, backprop intuition? Bilingual Chinese/English help.
  lead_en: 'COMP3340 Applied Deep Learning at The University of Hong Kong: Neural net basics — layers,
    activations, backprop intuition → CNNs / RNNs / Transformers when the course uses them → Losses, optimisers,
    and training loops → Regularisation — dropout, weight decay, early stopping…. Architectures and loss
    jargon outrun the debugging loop when shapes and gradients fail. Tutoring rebuilds that syllabus arc,
    then debugs the lab or assignment where it breaks.'
  lead_cn: 在香港大学上 COMP3340，主线是神经网络基础 — 层、激活、反向传播直觉 → 课程用到的 CNN / RNN / Transformer → 损失函数、优化器与训练循环 → 正则
    — dropout、权重衰减、早停。结构和 loss 术语跑得比 debug 循环快，一遇到维度或梯度问题就停住。辅导先重建这条大纲主线，再对着 Lab / 作业里断开的地方 debug。
  overview_en: 'One-to-one tutoring for COMP3340 Applied Deep Learning at The University of Hong Kong.
    Covered topics: Neural net basics — layers, activations, backprop intuition; CNNs / RNNs / Transformers
    when the course uses them; Losses, optimisers, and training loops; Regularisation — dropout, weight
    decay, early stopping; Shape debugging and common framework errors. Bring your brief, failing test,
    lecture slide screenshot, or the topic name you are stuck on.'
  overview_cn: COMP3340（香港大学）一对一辅导。覆盖主题包括神经网络基础 — 层、激活、反向传播直觉、课程用到的 CNN / RNN / Transformer、损失函数、优化器与训练循环、正则
    — dropout、权重衰减、早停。预约时请带上 brief、失败测例、卡住的课件截图，或主题名。
  topics:
  - en: Neural net basics — layers, activations, backprop intuition
    cn: 神经网络基础 — 层、激活、反向传播直觉
  - en: CNNs / RNNs / Transformers when the course uses them
    cn: 课程用到的 CNN / RNN / Transformer
  - en: Losses, optimisers, and training loops
    cn: 损失函数、优化器与训练循环
  - en: Regularisation — dropout, weight decay, early stopping
    cn: 正则 — dropout、权重衰减、早停
  - en: Shape debugging and common framework errors
    cn: 维度 debug 与常见框架报错
  - en: Eval protocol and reporting that matches the brief
    cn: 与 brief 对齐的评估协议与报告
  stuck:
  - en: Forward pass runs; loss NaNs or never decreases
    cn: 前向能跑；loss 变 NaN 或一直不降
  - en: Architecture named correctly; tensor shapes still wrong
    cn: 结构名字说对了，张量维度仍错
  - en: Cannot explain why this model fits the task in the write-up
    cn: 报告里说不清为何这个模型适合该任务
  session_angles:
  - en: Print shapes at each block before tuning hyperparameters
    cn: 调超参前先把每块维度打出来
  - en: Tie architecture choice back to the data modality
    cn: 把结构选择拉回数据模态
  tutoring:
  - en: 'Lecture sync for COMP3340: bilingual walkthrough of Neural net basics — layers, activations,
      backprop intuition → CNNs / RNNs / Transformers when the course uses them → Losses, optimisers,
      and training loops → Regularisation — dropout, weight decay, early stopping so tutorial language
      matches.'
    cn: 按 COMP3340 同步跟课：用中英双语把「神经网络基础 — 层、激活、反向传播直觉 → 课程用到的 CNN / RNN / Transformer → 损失函数、优化器与训练循环」讲透，对齐
      tutorial 用语。
  - en: 'Assignments / labs: approach review and live debug (you at the keyboard).'
    cn: 作业 / Lab：拆 brief、梳思路，现场 debug（你来操作键盘）。
  - en: 'Exam prep: timed drills on Neural net basics — layers, activations, backprop intuition question
      shapes for this course.'
    cn: 考前突击：按本课「神经网络基础 — 层、激活、反向传播直觉」等题型做限时练习。
  faq:
  - q_en: What does COMP3340 cover?
    q_cn: COMP3340 学什么？
    a_en: Neural net basics — layers, activations, backprop intuition; CNNs / RNNs / Transformers when
      the course uses them; Losses, optimisers, and training loops; Regularisation — dropout, weight decay,
      early stopping…. Say which week or assessment you are on when booking.
    a_cn: 神经网络基础 — 层、激活、反向传播直觉、课程用到的 CNN / RNN / Transformer、损失函数、优化器与训练循环、正则 — dropout、权重衰减、早停。预约时说明你卡在哪一周或哪次评估。
