  - '41039'
  meta_description_en: IPRO001 / 41039 UTS tutoring (Programming 1). Code that almost runs but the student
    cannot explain each step? Bilingual Chinese/English help.
- topics:
  - en: Scenario and use-cases that fit weeks 1–6 only
    cn: 选题与用例只落在前几周已教内容里
  - en: Decompose the domain into high-cohesion / low-coupling tasks
    cn: 把问题域拆成高内聚、低耦合的任务
  - en: 'GitHub collaboration: branches, ownership, merge interfaces'
    cn: GitHub 协作：分支、职责归属、合并接口
  - en: 'Class design: parent / child, enum, lists and maps'
    cn: 类设计：父类 / 子类、枚举、List 与 Map
  - en: Assign responsibilities and integrate with the shared menu
    cn: 分配职责并与共享菜单、集合集成
  - en: Explain inheritance, interfaces, overload / override, polymorphism
    cn: 能讲清继承、接口、重载 / 重写与多态
  material: programming2-IPRO002
  theme: programming
  lead_en: 'IPRO002 extends Programming 1 into OO design and a group project: scenario, use-cases, class
    relationships, and code that stays inside weeks 1–6. Tutoring turns an open topic into cohesive tasks,
    GitHub ownership, and an integrable design.'
  tutoring:
  - en: 'Lecture sync: bilingual walkthrough of weeks 1–6 (OOP, collections, inheritance / interfaces)
      so lab and project language match.'
    cn: 同步跟课：用中英双语把前几周主线讲透（OOP、集合、继承 / 接口），让 lab 与项目用语对齐。
  - en: 'Group project: pick a scenario inside taught constructs; decompose use-cases into cohesive tasks
      with clear owners; set GitHub branches and merge interfaces; design classes, assign responsibilities,
      and integrate with the rest of the program.'
    cn: 小组项目：选题落在已教内容；把用例拆成高内聚任务并明确负责人；约定 GitHub 分支与合并接口；设计类、分配职责，再与整组菜单和集合集成。
  - en: 'Implementation sessions: you drive your owned classes; we debug boundaries, naming, and integration
      until the design holds and you can explain each OO choice.'
    cn: 实现课：你负责自己的类；一起排查边界、命名与集成，直到设计站得住，并且你能解释每一处 OO 选择。
  - en: 'Exam / practice: short drills on inheritance, interfaces, and collection use when you are not
      in project mode.'
    cn: 考前 / 练习：非项目周针对继承、接口与集合用法做短练。
  code: IPRO002
  lead_cn: IPRO002 在 Programming 1 之上做 OO 设计与小组项目：场景、用例、类关系， 以及只用前几周教过的写法。辅导把开放选题拆成高内聚低耦合的任务、GitHub 分工，
    再落到能合并进整组程序的类设计。
  overview_en: 'Programming 2 at UTS (Diploma of IT) builds on IPRO001: inheritance, interfaces, enums,
    lists and maps, and a group object-oriented application. The hard part is rarely typing Java alone.
    It is choosing a scenario that fits taught constructs, splitting use-cases into high-cohesion / low-coupling
    tasks for 2–3 people, collaborating on GitHub, then designing classes and integrating with the shared
    menu and collections so the explanation can justify inheritance, interfaces, overload / override,
    and polymorphism. Sample slides from our concept-review tutoring deck are below.'
  overview_cn: UTS（Diploma of IT）的 Programming 2 接在 IPRO001 后面：继承、接口、枚举、 List / Map，以及一个小组面向对象应用。真正难的往往不是「会不会敲
    Java」， 而是选题是否落在已教内容里、把用例拆成 2–3 人可并行的高内聚低耦合任务、 用 GitHub 协作，再设计类并并入共享菜单与集合，使说明能讲清继承、接口、 重载 / 重写与多态。
    下方有我们概念复习辅导课件的样例页。
