    material: programming1-IPRO001
    theme: programming
    lead_en: "IPRO001 is the Java foundation before Programming 2: menus, classes,
      and small programs that still have to compile, run, and be explainable.
      Tutoring builds habits you will reuse in IPRO002 group work."
    tutoring:
      - en: "Lecture sync: bilingual walkthrough of weekly Java ideas until you can
          restate them and match lab wording."
        cn: 同步跟课：用中英双语把本周 Java 概念讲透，能复述并能对齐 lab 用语。
      - en: "Assignments: you drive; we place behaviour in the right class, fix the menu
          path, and debug until you can explain the change."
        cn: 作业：你来操作；一起把行为放到正确的类，理顺菜单路径，debug 到你能自己解释每一处改动。
      - en: "Exam / practice: timed drills on class design and short programs, then
          wrong-answer review before IPRO002."
        cn: 考前 / 练习：针对类设计与短程序限时练，做错题复盘，为 IPRO002 打底。
    code: IPRO001
    lead_cn: IPRO001 是 Programming 2 之前的 Java 基础：菜单驱动、类与小程序既要能编译运行，
      又要能讲清楚。辅导会把这些习惯立住，后面 IPRO002 小组作业才能接得上。
    overview_en: Programming 1 at UTS (Diploma of IT) introduces Java through text
      menus, objects, and simple collections. Students usually struggle less
      with "never saw syntax" and more with reading the brief, placing behaviour
      in the right class, and debugging when the menu path and data do not
      match. IPRO002 extends the same line into inheritance, interfaces, and a
      group project.
    overview_cn: UTS（Diploma of IT）的 Programming 1 用 Java 把文本菜单、对象和小集合跑通。
      真正卡人的往往不是「语法完全没见过」，而是 brief 读不清、行为该放哪个类、 菜单路径和数据对不上时不会排查。IPRO002
      在同一条线上继续：继承、接口与小组项目。
    title: Programming 1
    stuck:
      - en: Code that almost runs but the student cannot explain each step
        cn: 代码差不多能跑，但每一步自己讲不清楚
      - en: Mixing menu I/O with business logic in one class
        cn: 把菜单输入输出和业务逻辑塞进同一个类
      - en: Collections used by copy-paste without knowing what is stored
        cn: 集合靠粘贴用上了，却说不清里面存的是什么
      - en: Falling behind early, then IPRO002 group work feels impossible
        cn: 前面掉队，到 IPRO002 小组作业就接不住
    aliases:
      - "41039"
  - topics:
