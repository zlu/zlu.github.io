    material: programming2-IPRO002
    theme: programming
    lead_en: "IPRO002 extends Programming 1 into OO design and a group project:
      scenario, use-cases, class relationships, and code that stays inside weeks
      1–6. Tutoring turns an open topic into cohesive tasks, GitHub ownership,
      and an integrable design."
    tutoring:
      - en: "Lecture sync: bilingual walkthrough of weeks 1–6 (OOP, collections,
          inheritance / interfaces) so lab and project language match."
        cn: 同步跟课：用中英双语把前几周主线讲透（OOP、集合、继承 / 接口），让 lab 与项目用语对齐。
      - en: "Group project: pick a scenario inside taught constructs; decompose
          use-cases into cohesive tasks with clear owners; set GitHub branches
          and merge interfaces; design classes, assign responsibilities, and
          integrate with the rest of the program."
        cn: 小组项目：选题落在已教内容；把用例拆成高内聚任务并明确负责人；约定 GitHub 分支与合并接口；设计类、分配职责，再与整组菜单和集合集成。
      - en: "Implementation sessions: you drive your owned classes; we debug boundaries,
          naming, and integration until the design holds and you can explain
          each OO choice."
        cn: 实现课：你负责自己的类；一起排查边界、命名与集成，直到设计站得住，并且你能解释每一处 OO 选择。
      - en: "Exam / practice: short drills on inheritance, interfaces, and collection
          use when you are not in project mode."
        cn: 考前 / 练习：非项目周针对继承、接口与集合用法做短练。
    code: IPRO002
    lead_cn: IPRO002 在 Programming 1 之上做 OO 设计与小组项目：场景、用例、类关系，
      以及只用前几周教过的写法。辅导把开放选题拆成高内聚低耦合的任务、GitHub 分工， 再落到能合并进整组程序的类设计。
    overview_en: "Programming 2 at UTS (Diploma of IT) builds on IPRO001:
      inheritance, interfaces, enums, lists and maps, and a group
      object-oriented application. The hard part is rarely typing Java alone. It
      is choosing a scenario that fits taught constructs, splitting use-cases
      into high-cohesion / low-coupling tasks for 2–3 people, collaborating on
      GitHub, then designing classes and integrating with the shared menu and
      collections so the explanation can justify inheritance, interfaces,
      overload / override, and polymorphism."
    overview_cn: UTS（Diploma of IT）的 Programming 2 接在 IPRO001 后面：继承、接口、枚举、 List /
      Map，以及一个小组面向对象应用。真正难的往往不是「会不会敲 Java」， 而是选题是否落在已教内容里、把用例拆成 2–3
      人可并行的高内聚低耦合任务、 用 GitHub 协作，再设计类并并入共享菜单与集合，使说明能讲清继承、接口、 重载 / 重写与多态。
    title: Programming 2
    stuck:
      - en: Open topic, but the design needs libraries or ideas not yet taught
        cn: 选题太开放，设计却用了还没教的库或写法
      - en: Use-cases that are really one CRUD path counted as three tasks
        cn: 其实是同一条增删改路径，却拆成三个假任务
      - en: Everyone edits the same classes; merges fight and nobody owns an interface
        cn: 所有人改同一批类，合并冲突不断，没有人守住接口约定
      - en: Classes exist but responsibilities are mixed; integration breaks the menu
        cn: 类有了但职责搅在一起，一集成菜单或集合就断
      - en: Code runs, but the write-up cannot justify OO choices
        cn: 程序能跑，说明里却讲不清为什么这样用 OO
    aliases:
      - "41040"
