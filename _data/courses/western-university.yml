  lead_en: 'DS1000b Data Science Concepts at Western University. Messy notebooks and weak method stories
    lose marks even when a model runs. Tutoring: lecture catch-up, assignment debug, exam drills — methods
    you can reuse.'
  lead_cn: 在西安大略大学上 DS1000b，就算模型能跑，凌乱 notebook 和站不住的方法叙事也会丢分。辅导对着你卡住的步骤练，练到下一份 brief 还能自己做。
  overview_en: 'DS1000b Data Science Concepts (Data science & analytics) at Western University. Common
    topics: Data wrangling / analytics tables; OS / systems programming; Math foundations and proof habits.
    People stall when terms outrun notes, when a class demo does not replay alone, or when the write-up
    / autograder wants a method the notebook never showed. Sample slides from our concept-review tutoring
    deck are below.'
  overview_cn: DS1000b 是西安大略大学的「数据科学与分析」课，既要真懂，也要能动手。常见内容包括数据清洗 / 分析表、操作系统 / 系统编程、数学基础与证明习惯。很多人不是完全没学过，而是课上术语太快、自己复不出来，或报告
    / autograder 要的方法在 notebook 里从没写清。 下方有我们概念复习辅导课件的样例页。
