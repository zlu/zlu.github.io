  meta_description_en: COMP3011 Adelaide tutoring (Cloud and Concurrent Programming). Stuck on Java threads,
    REST APIs, or race conditions? Bilingual Chinese/English help.
  lead_en: 'COMP3011 Cloud and Concurrent Programming pairs concurrency theory with cloud web services
    in Java: threads and synchronisation, REST/API clients, and thread-safe designs that survive races,
    deadlocks, and timeouts. Assessment is project-heavy (design, problem-solving, professional simulation)
    rather than a classic final exam; tutoring turns the brief into a thread model you can debug.'
  lead_cn: COMP3011 Cloud and Concurrent Programming 把并发理论与云端 Web 服务合在一门 Java 课里：线程与同步、REST/API 客户端，以及能扛住竞态、死锁和超时的线程安全设计。考核偏项目
    （设计、问题解决、职业仿真），不像传统期末大考；辅导会把 brief 拆成你能逐步 debug 的线程模型。
  overview_en: 'One-to-one tutoring for COMP3011 at University of Adelaide: lecture catch-up on concurrency
    models and cloud APIs, then live debug on your Java project (player / service / client). Semester
    2, 6 units — expect seminar + practical contact plus substantial independent coding. Bring your brief,
    starter, or failing test when you book. Sample slides from our concurrency concept-review tutoring
    deck are below.'
  overview_cn: 阿德莱德大学 COMP3011 一对一辅导：先补并发模型与云 API 概念，再对着你的 Java 项目（播放器 / 服务 / 客户端）现场 debug。学期二、6 学分——课堂研讨
    + 实验之外，独立编码量不小。预约时请带上你的 brief、starter 或失败测例。下方有我们并发概念复习辅导课件的样例页。
