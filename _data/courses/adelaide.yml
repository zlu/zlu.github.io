  faq:
  - q_en: What does COMP3011 cover?
    q_cn: COMP3011 学什么？
    a_en: Concurrency theory and multi-threaded Java design, plus cloud web services and APIs — thread-safe
      clients/services, testing, and basic security / privacy when code depends on external platforms.
    a_cn: 并发理论与多线程 Java 设计，再加上云 Web 服务与 API——线程安全的客户端 / 服务、测试，以及依赖外部平台时的安全 / 隐私基础。
  - q_en: How is COMP3011 assessed?
    q_cn: COMP3011 怎么考核？
    a_en: Project- and simulation-based — typically a design project, a problem-solving task, and a larger
      professional simulation — not a traditional final exam. Bring your brief when booking so we target
      the weighted piece you are on.
    a_cn: 以项目与仿真为主——常见是设计项目、问题解决任务，以及更大的职业仿真——不是传统期末大考。预约时带上 brief，我们对准你正在做的那一块加权任务。
  - q_en: What should I know before Semester 2?
    q_cn: 学期二开课前要有什么基础？
    a_en: Formal prereqs are COMP1003 or COMP2021 (antirequisite INFT3043). In practice, solid Java plus
      willingness to reason about threads and HTTP/JSON APIs helps most before the first practical.
    a_cn: 正式先修是 COMP1003 或 COMP2021（反修 INFT3043）。实务上，扎实的 Java，再加上愿意推敲线程与 HTTP/JSON API，对第一次实验帮助最大。
