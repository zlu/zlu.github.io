- code: INFR08015
  title: Informatics 1 - Functional Programming
  theme: programming
  meta_description_en: INFR08015 tutoring (Informatics 1 - Functional…). Stuck on Variables, types, and
    expressions in the course language? Bilingual Chinese/English help.
