    and expressions in the course language → Control flow — branching, loops, and nested logic → Functions
    / procedures and stepwise decomposition → Collections — arrays/lists/strings and indexing bugs…. Problem
    decomposition and edge cases hit harder than memorising syntax. Tutoring rebuilds that syllabus arc,
    then debugs the lab or assignment where it breaks.'
