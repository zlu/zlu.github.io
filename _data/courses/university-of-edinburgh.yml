    on before last week’s method is solid? Bilingual Chinese/English help.
  lead_en: Econ Math Economics Mathematics at University of Edinburgh is where symbols and proof phrasing
    outrun calculation skill. The hard part is turning that arc into a method you can repeat on the next
    brief — not rereading slides the night before.
  lead_cn: 在爱丁堡大学上 Econ Math，符号与证明表述往往比计算本身更劝退。
  overview_en: Econ Math Economics Mathematics sits in math for computer science. There is a weekly arc
    (about week 1–1) plus assessed work that expects you to apply the same ideas under deadline pressure.
    Students stall when terminology outruns notes, when a demo makes sense in class but not alone, or
    when the write-up / autograder asks for a method the notebook never made explicit. Sample slides from
    our concept-review tutoring deck are below.
  overview_cn: Econ Math 是爱丁堡大学「计算机数学基础」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。大约第 1–1 周有连续周课主线，作业会要求你在 DDL 下用同一套方法。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告
    / autograder 要的方法在 notebook 里从未写清。 下方有我们概念复习辅导课件的样例页。
