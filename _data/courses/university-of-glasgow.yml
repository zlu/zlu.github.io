- material: 4043 Systems and Networks
  title: Systems and Networks
  code: COMPSCI4043
  theme: systems
  meta_description_en: COMPSCI4043 tutoring (Systems and Networks). Stuck on Layered models (OSI / TCP-IP)
    and where each job lives? Bilingual Chinese/English help.
  lead_en: 'COMPSCI4043 Systems and Networks at University of Glasgow: Layered models (OSI / TCP-IP) and
    where each job lives → Sockets, TCP vs UDP, and reliable delivery → Routing, addressing, and forwarding
    intuition → HTTP/DNS and application-layer protocols…. Layers, packets, and failure modes blur until
    you can trace one request end-to-end. Tutoring rebuilds that syllabus arc, then debugs the lab or
    assignment where it breaks.'
  lead_cn: 在格拉斯哥大学上 COMPSCI4043，主线是分层模型（OSI / TCP-IP）与各层职责 → Socket、TCP vs UDP 与可靠传输 → 路由、编址与转发直觉 → HTTP/DNS
    与应用层协议。分层、报文和故障模式搅在一起，直到你能把一次请求从头跟到尾。辅导先重建这条大纲主线，再对着 Lab / 作业里断开的地方 debug。
  overview_en: 'One-to-one tutoring for COMPSCI4043 Systems and Networks at University of Glasgow. Covered
    topics: Layered models (OSI / TCP-IP) and where each job lives; Sockets, TCP vs UDP, and reliable
    delivery; Routing, addressing, and forwarding intuition; HTTP/DNS and application-layer protocols;
    Congestion, flow control, and performance trade-offs. Bring your brief, failing test, lecture slide
