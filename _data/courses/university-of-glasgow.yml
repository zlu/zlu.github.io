- material: 4039 Programming
  title: Programming
  code: COMPSCI4039
  theme: programming
  meta_description_en: COMPSCI4039 Glasgow tutoring (Programming). Weekly lecture arc moves on before
    last week’s method is solid? Bilingual Chinese/English help.
  lead_en: COMPSCI4039 Programming at University of Glasgow is where briefs, tooling, and autograder edge
    cases hit harder than syntax itself. The hard part is turning that arc into a method you can repeat
    on the next brief — not rereading slides the night before.
  lead_cn: 在格拉斯哥大学上 COMPSCI4039，真正难的往往不是语法，而是 brief 读不透、工具链不熟，以及 autograder 专砸边界。
  overview_en: COMPSCI4039 Programming sits in programming & software construction. There is a weekly
    arc (about week 1–1) plus assessed work that expects you to apply the same ideas under deadline pressure.
    Students stall when terminology outruns notes, when a demo makes sense in class but not alone, or
    when the write-up / autograder asks for a method the notebook never made explicit. Sample slides from
    our concept-review tutoring deck are below.
  overview_cn: COMPSCI4039 是格拉斯哥大学「编程与软件构造」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。大约第 1–1 周有连续周课主线，作业会要求你在 DDL 下用同一套方法。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告
    / autograder 要的方法在 notebook 里从未写清。 下方有我们概念复习辅导课件的样例页。
