- code: COMPSCI5089
  title: Introduction to Data Science and Systems
  material: compsci5089-intro-to-datascience
  theme: data-science
  meta_description_en: COMPSCI5089 Glasgow tutoring (Introduction to Data Science and…). Weekly lecture
    arc moves on before last week’s method is solid?
  lead_en: COMPSCI5089 Introduction to Data Science and Systems at University of Glasgow is where messy
    notebooks and weak method stories lose marks even when a model runs. The hard part is turning that
    arc into a method you can repeat on the next brief — not rereading slides the night before.
  lead_cn: 在格拉斯哥大学上 COMPSCI5089，就算模型能跑，凌乱 notebook 和站不住的方法叙事也会丢分。
  overview_en: COMPSCI5089 Introduction to Data Science and Systems sits in data science & analytics.
    There is a weekly arc (about week 9–10) plus assessed work that expects you to apply the same ideas
    under deadline pressure. Students stall when terminology outruns notes, when a demo makes sense in
    class but not alone, or when the write-up / autograder asks for a method the notebook never made explicit.
    Sample slides from our concept-review tutoring deck are below.
  overview_cn: COMPSCI5089 是格拉斯哥大学「数据科学与分析」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。学期里常会绕着数据清洗 / 分析表、网络分层、报文与协议、数学基础与证明习惯这些点转。大约第
    9–10 周有连续周课主线，作业会要求你在 DDL 下用同一套方法。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告 / autograder 要的方法在
    notebook 里从未写清。 下方有我们概念复习辅导课件的样例页。
