  overview_en: COMPSCI5089 Introduction to Data Science and Systems sits in data science & analytics.
    There is a weekly arc (about week 9–10) plus assessed work that expects you to apply the same ideas
    under deadline pressure. Students stall when terminology outruns notes, when a demo makes sense in
    class but not alone, or when the write-up / autograder asks for a method the notebook never made explicit.
