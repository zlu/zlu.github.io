  overview_en: 6114 非结构化数据分析(R) sits in data science & analytics. Evidence from the course folder points
    to Spark / distributed data processing; Data wrangling / analytics tables; ML pipelines, features,
    and model choice; Computer architecture and organisation. There is a weekly arc (about week 3–3) plus
    assessed work that expects you to apply the same ideas under deadline pressure. Students stall when
    terminology outruns notes, when a demo makes sense in class but not alone, or when the write-up /
    autograder asks for a method the notebook never made explicit.
  overview_cn: 6114 是马来西亚国立大学「数据科学与分析」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。从课程材料看，学期里常会绕着Spark / 分布式数据处理、数据清洗 /
    分析表、ML 流水线、特征与模型选择这些点转。大约第 3–3 周有连续周课主线，作业会要求你在 DDL 下用同一套方法。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告
    / autograder 要的方法在 notebook 里从未写清。
