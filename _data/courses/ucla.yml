- code: COM SCI 111
  title: Operating Systems Principles
  theme: systems
  meta_description_en: COM SCI 111 tutoring (Operating Systems Principles). Stuck on OS architecture —
    kernel vs user, system calls, interrupts? Bilingual Chinese/English help.
  lead_en: 'COM SCI 111 Operating Systems Principles at University of California, Los Angeles: OS architecture
    — kernel vs user, system calls, interrupts → Processes, threads, PCBs, and scheduling → Concurrency
    — mutexes, semaphores, condition variables, deadlock → Virtual memory — paging, TLB, replacement (FIFO/LRU/CLOCK)….
    Processes, memory, concurrency, and file-system ideas stack faster than labs can catch up. Tutoring
    rebuilds that syllabus arc, then debugs the lab or assignment where it breaks.'
  lead_cn: 在加州大学洛杉矶分校上 COM SCI 111，主线是操作系统结构 — 内核/用户态、系统调用、中断 → 进程、线程、PCB 与调度 → 并发 — mutex、信号量、条件变量、死锁
    → 虚拟内存 — 分页、TLB、置换（FIFO/LRU/CLOCK）。进程、内存、并发和文件系统叠得比 Lab 跟得上的速度还快。辅导先重建这条大纲主线，再对着 Lab / 作业里断开的地方 debug。
  overview_en: 'One-to-one tutoring for COM SCI 111 Operating Systems Principles at University of California,
    Los Angeles. Covered topics: OS architecture — kernel vs user, system calls, interrupts; Processes,
    threads, PCBs, and scheduling; Concurrency — mutexes, semaphores, condition variables, deadlock; Virtual
    memory — paging, TLB, replacement (FIFO/LRU/CLOCK); File systems — inodes, allocation, journaling,
