  overview_en: 'COMP1000 Foundations of Algorithms (Algorithms & data structures) at University of Melbourne.
    Common topics: OS / systems programming. Weekly arc about week 1–12, plus assessed work under deadline.
    People stall when terms outrun notes, when a class demo does not replay alone, or when the write-up
    / autograder wants a method the notebook never showed. Sample slides from our concept-review tutoring
    deck are below.'
  overview_cn: COMP1000 是墨尔本大学的「算法与数据结构」课，既要真懂，也要能动手。常见内容包括操作系统 / 系统编程。大约第 1–12 周有连续周课，作业会要求你在 DDL 下用同一套方法。很多人不是完全没学过，而是课上术语太快、自己复不出来，或报告
