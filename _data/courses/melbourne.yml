- code: COMP2000
  title: COMP 5 Intro. To Numerical Computation In C
  material: COMP20005 - Intro. to Numerical Computation in C
  theme: math-for-cs
  meta_description_en: COMP2000 Melbourne tutoring (COMP 5 Intro. To Numerical…). Can follow a worked
    example, cannot start from a blank page under time pressure?
  lead_en: COMP2000 COMP 5 Intro. To Numerical Computation In C at University of Melbourne is where symbols
    and proof phrasing outrun calculation skill. The hard part is turning that arc into a method you can
    repeat on the next brief — not rereading slides the night before.
  lead_cn: 在墨尔本大学上 COMP2000，符号与证明表述往往比计算本身更劝退。
  overview_en: COMP2000 COMP 5 Intro. To Numerical Computation In C sits in math for computer science.
    Assessed work expects you to apply lecture ideas under deadline pressure. Students stall when terminology
    outruns notes, when a demo makes sense in class but not alone, or when the write-up / autograder asks
    for a method the notebook never made explicit. Sample slides from our concept-review tutoring deck
    are below.
  overview_cn: COMP2000 是墨尔本大学「计算机数学基础」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。学期里常会绕着SQL、Schema 与数据库、网络分层、报文与协议、安全
    / 隐私威胁模型与实验这些点转。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告 / autograder 要的方法在 notebook 里从未写清。
    下方有我们概念复习辅导课件的样例页。
