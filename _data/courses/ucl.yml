    week 1–6) plus assessed work that expects you to apply the same ideas under deadline pressure. Students
    stall when terminology outruns notes, when a demo makes sense in class but not alone, or when the
    write-up / autograder asks for a method the notebook never made explicit. Sample slides from our concept-review
    tutoring deck are below.
