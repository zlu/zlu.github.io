  title: Business Analytics / Management Analytics
  material: MANG2092
  theme: data-science
  meta_description_en: MANG2092 Southampton tutoring (Business Analytics / Management…). Weekly lecture
    arc moves on before last week’s method is solid?
  lead_en: MANG2092 Business Analytics / Management Analytics at University of Southampton is where messy
    notebooks and weak method stories lose marks even when a model runs. The hard part is turning that
    arc into a method you can repeat on the next brief — not rereading slides the night before.
  lead_cn: 在南安普顿大学上 MANG2092，就算模型能跑，凌乱 notebook 和站不住的方法叙事也会丢分。
  overview_en: MANG2092 Business Analytics / Management Analytics sits in data science & analytics. There
    is a weekly arc (about week 1–10) plus assessed work that expects you to apply the same ideas under
    deadline pressure. Students stall when terminology outruns notes, when a demo makes sense in class
    but not alone, or when the write-up / autograder asks for a method the notebook never made explicit.
    Sample slides from our concept-review tutoring deck are below.
  overview_cn: MANG2092 是南安普顿大学「数据科学与分析」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。大约第 1–10 周有连续周课主线，作业会要求你在 DDL 下用同一套方法。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告
    / autograder 要的方法在 notebook 里从未写清。 下方有我们概念复习辅导课件的样例页。
  topics:
