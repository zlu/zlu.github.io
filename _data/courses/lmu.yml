  lead_en: Symbolische Programmiersprache Symbolische Programmiersprache at Ludwig-Maximilians-Universität
    München is where briefs, tooling, and autograder edge cases hit harder than syntax itself. Private
    materials show weekly notes spanning roughly week 1–11, assignment briefs / labs on disk, notebooks,
    code submissions / practice files. The hard part is turning that arc into a method you can repeat
    on the next brief — not rereading slides the night before.
  lead_cn: 在慕尼黑大学上 Symbolische Programmiersprache，真正难的往往不是语法，而是 brief 读不透、工具链不熟，以及 autograder 专砸边界。
  overview_en: Symbolische Programmiersprache Symbolische Programmiersprache sits in programming & software
    construction. There is a weekly arc (about week 1–11) plus assessed work that expects you to apply the
    same ideas under deadline pressure. Students stall when terminology outruns notes, when a demo makes
    sense in class but not alone, or when the write-up / autograder asks for a method the notebook never
    made explicit.
  overview_cn: Symbolische Programmiersprache 是慕尼黑大学「编程与软件构造」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。学期里常会绕着ML
    流水线、特征与模型选择、自动机、形式语言与证明、编程基础与调试这些点转。大约第 1–11 周有连续周课主线，作业会要求你在 DDL 下用同一套方法。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告
    / autograder 要的方法在 notebook 里从未写清。
