    write-ups, not only the final number. Tutoring follows the diagnostic shape: extrema and first-order
    ODEs, 2×2 eigenpairs, Bayes and stars-and-bars, nested-loop counting and coin-to-bits. A free sample
    of the concept-review deck is on this page; the full 90-minute pack comes with tutoring.'
  overview_cn: 港科大 Data-Driven Modeling 理学硕士入学笔试更看重方法与英文书写步骤，而不只是最终数字。 辅导对齐诊断卷结构：极值与一阶 ODE、2×2 特征对、Bayes
    与 stars-and-bars、嵌套循环计数与 硬币到比特。本页有概念复习课件样例；完整 90 分钟讲义在预约辅导后提供。
