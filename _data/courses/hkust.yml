  - en: Calculus — critical points, concavity, separable ODEs
    cn: 微积分 — 临界点、凹凸性、可分离 ODE
  - en: Linear algebra — eigenvalues, eigenvectors, discriminant
    cn: 线性代数 — 特征值、特征向量、判别式
  - en: Probability — Bayes updates and stars-and-bars counting
    cn: 概率 — Bayes 更新与 stars-and-bars 计数
  - en: Programming logic — nested-loop counts, Big-O, fair bits
