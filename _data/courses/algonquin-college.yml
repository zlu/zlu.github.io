    edge cases hit harder than syntax itself. Tutoring: lecture catch-up, assignment debug, exam drills
    — methods you can reuse.'
  lead_cn: 在亚岗昆学院上 ESC4402，真正难的往往不是语法，而是 brief 读不透、工具链不熟，以及 autograder 专砸边界。辅导对着你卡住的步骤练，练到下一份 brief 还能自己做。
  overview_en: 'ESC4402 Engineering Software Computing (Programming & software construction) at Algonquin
    College. Common topics: SQL, schema design, and databases; Automata, formal languages, and proofs;
    Web / mobile app structure. Weekly arc about week 1–9, plus assessed work under deadline. People stall
    when terms outrun notes, when a class demo does not replay alone, or when the write-up / autograder
    wants a method the notebook never showed. Sample slides from our concept-review tutoring deck are
    below.'
