    brief 还能复用的方法。
  overview_en: ESC4402 Engineering Software / Computing sits in databases & information systems. Evidence
    from the course folder points to SQL, schema design, and databases; Automata, formal languages, and
    proofs; Web / mobile app structure. There is a weekly arc (about week 1–9) plus assessed work that
    expects you to apply the same ideas under deadline pressure. Students stall when terminology outruns
    notes, when a demo makes sense in class but not alone, or when the write-up / autograder asks for
    a method the notebook never made explicit.
