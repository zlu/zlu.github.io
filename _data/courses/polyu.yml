  lead_en: COMP5941 Ai Thesis at The Hong Kong Polytechnic University is where method names blur together
    until pipelines, metrics, and write-ups diverge. Private materials show code submissions / practice
    files. The hard part is turning that arc into a method you can repeat on the next brief — not rereading
    slides the night before.
  lead_cn: 在香港理工大学上 COMP5941，方法名搅在一起，pipeline、指标和报告对不上就会崩。现有材料里能看到代码提交 / 练习文件。难的不是考前把课件再扫一遍，而是把这条主线练成下一份
    brief 还能复用的方法。
  overview_en: COMP5941 Ai Thesis sits in machine learning & ai. Evidence from the course folder points
    to Spark / distributed data processing. Students stall when terminology outruns notes, when a demo
    makes sense in class but not alone, or when the write-up / autograder asks for a method the notebook
    never made explicit.
  overview_cn: COMP5941 是香港理工大学「机器学习与人工智能」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。从课程材料看，学期里常会绕着Spark / 分布式数据处理这些点转。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告
    / autograder 要的方法在 notebook 里从未写清。
