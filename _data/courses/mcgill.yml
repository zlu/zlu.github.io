- code: COMP 251
  title: Algorithms and Data Structures
  theme: algorithms
  meta_description_en: COMP 251 tutoring (Algorithms and Data Structures). Stuck on Complexity — Big-O,
    recurrence, and arguing bounds? Bilingual Chinese/English help.
  lead_en: 'COMP 251 Algorithms and Data Structures at McGill University: Complexity — Big-O, recurrence,
    and arguing bounds → Core ADTs — lists, stacks, queues, trees, heaps, hash tables → Sorting and searching
    families → Graph algorithms — BFS/DFS, shortest paths, MSTs…. Invariants, complexity claims, and code
    must stay aligned under time pressure. Tutoring rebuilds that syllabus arc, then debugs the lab or
    assignment where it breaks.'
  lead_cn: 在麦吉尔大学上 COMP 251，主线是复杂度 — Big-O、递推与界的论证 → 核心 ADT — 表、栈、队列、树、堆、哈希表 → 排序与查找族 → 图算法 — BFS/DFS、最短路、最小生成树。限时下不变量、复杂度结论和代码必须说的是同一件事。辅导先重建这条大纲主线，再对着
    Lab / 作业里断开的地方 debug。
  overview_en: 'One-to-one tutoring for COMP 251 Algorithms and Data Structures at McGill University.
    Covered topics: Complexity — Big-O, recurrence, and arguing bounds; Core ADTs — lists, stacks, queues,
    trees, heaps, hash tables; Sorting and searching families; Graph algorithms — BFS/DFS, shortest paths,
    MSTs; Greedy, divide-and-conquer, and dynamic programming patterns. Bring your brief, failing test,
    lecture slide screenshot, or the topic name you are stuck on.'
  overview_cn: COMP 251（麦吉尔大学）一对一辅导。覆盖主题包括复杂度 — Big-O、递推与界的论证、核心 ADT — 表、栈、队列、树、堆、哈希表、排序与查找族、图算法 — BFS/DFS、最短路、最小生成树。预约时请带上
    brief、失败测例、卡住的课件截图，或主题名。
  topics:
  - en: Complexity — Big-O, recurrence, and arguing bounds
    cn: 复杂度 — Big-O、递推与界的论证
  - en: Core ADTs — lists, stacks, queues, trees, heaps, hash tables
    cn: 核心 ADT — 表、栈、队列、树、堆、哈希表
  - en: Sorting and searching families
    cn: 排序与查找族
  - en: Graph algorithms — BFS/DFS, shortest paths, MSTs
    cn: 图算法 — BFS/DFS、最短路、最小生成树
  - en: Greedy, divide-and-conquer, and dynamic programming patterns
    cn: 贪心、分治与动态规划模式
