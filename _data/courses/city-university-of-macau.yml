- code: BCS021
  title: 密码学及其应用
  material: BCS021-密码学及其应用
  theme: security
  meta_description_en: BCS021 CityU Macau tutoring (密码学及其应用). Classical crypto through AES, RSA, signatures
    — and a final report you write yourself. Bilingual help.
  lead_en: BCS021 密码学及其应用 at City University of Macau is where classical ciphers, AES modes, public-key
    (DH / RSA), and hash-vs-signature jobs stack into one terminology wall — then the final report asks
    for a verifiable experiment in your own words. Tutoring rebuilds the primitive jobs, walks your chosen
    topic’s method, and coaches the write-up you type yourself (no generative-AI drafting).
  lead_cn: 在澳门城市大学上 BCS021，古典密码、AES 工作模式、公钥（DH / RSA）和「散列 vs 签名」的职责叠成一堵术语墙， 期末报告还要你自己写出可核查的实验。辅导先把原语职责对齐，再按你选的题目梳方法，陪你自己动笔写报告（不用生成式
    AI 代写 / 改写）。
  overview_en: BCS021 密码学及其应用 sits in security & privacy. The weekly arc runs from classical crypto and
    cryptanalysis, through math tools, modern symmetric / AES modes, Diffie–Hellman and RSA, hash / MAC
    / signatures, protocols, and key management. Assessment mixes attendance, in-class practice, and a
    substantial individual final report (IEEE LaTeX, experiment + discussion, AI-detection rules). Students
    stall when primitives get swapped (hash for signature, DH success for identity), when AES-GCM / RSA-OAEP
    hybrid flows are fuzzy, or when the report needs a clear question, tables, and a voice that is clearly
    theirs. Sample slides from our concept-review tutoring deck are below.
  overview_cn: BCS021 是澳门城市大学「安全与隐私」方向的课。周课主线从古典密码与密码分析、数学工具，到现代对称密码 / AES 工作模式、Diffie–Hellman 与 RSA、散列
    / MAC / 数字签名、密码协议与密钥管理。考核通常含考勤、课堂练习和一份 个人期末报告（IEEE LaTeX、实验与讨论，并有 AI 检测规则）。留学生真正吃力的，往往是原语职责搞混（用散列当签名、把
    DH 算通当成身份认证）、AES-GCM / RSA-OAEP 混合流程说不清，或报告缺明确问题、对照表和能过 viva 的本人表述。 下方有我们概念复习辅导课件的样例页。
  topics:
  - en: Classical crypto & cryptanalysis (Caesar, affine, Vigenère)
    cn: 古典密码与密码分析（凯撒、仿射、维吉尼亚）
  - en: Math tools for classical practice
    cn: 古典密码实践的数学工具
  - en: Modern symmetric crypto, AES, and block-cipher modes
    cn: 现代对称密码、AES 与分组密码工作模式
  - en: Public-key crypto · Diffie–Hellman and RSA
    cn: 公钥密码 · Diffie–Hellman 与 RSA
  - en: Hash functions, MACs, and digital signatures
    cn: 散列函数、消息认证与数字签名
  - en: Crypto protocols, key distribution & management
    cn: 密码协议、密钥分配与密钥管理
  - en: Final report · experiment design and self-authored write-up
    cn: 期末报告 · 实验设计与本人执笔写作
  stuck:
  - en: Primitives swapped — treating a hash match as publisher verification
    cn: 原语搞混——把「摘要匹配」当成发布者已验证
  - en: AES-GCM nonce reuse or fuzzy hybrid AES + RSA-OAEP file flow
    cn: AES-GCM nonce 复用，或 AES + RSA-OAEP 混合传文件流程说不清
  - en: DH shared secret computed, but MITM / identity still fuzzy
    cn: DH 共同密钥算出来了，中间人与身份认证仍糊
  - en: Final-report topic chosen, but no verifiable experiment table yet
    cn: 期末选题定了，可核查的实验对照表还没搭起来
  - en: Wanting an AI rewrite when the brief expects your own drafting
    cn: 想用 AI 改写交卷，但 brief 要求本人执笔
  session_angles:
  - en: Name the job of hash vs MAC vs signature on one example file
    cn: 对着同一份文件说清散列 / MAC / 签名各自证明什么
  - en: Sketch the AES-GCM + RSA-OAEP send/receive flow before coding
    cn: 写代码前先画 AES-GCM + RSA-OAEP 收发流程
  - en: Outline the final report — question, method, one condition change, limits
    cn: 梳期末报告骨架——问题、方法、一项条件变化、局限
  - en: Draft the next section in your words while we pressure-test claims
    cn: 你自己写下一段，我盯住没有图表支撑的断言
  tutoring:
  - en: 'Lecture sync for BCS021: bilingual catch-up on classical → AES → public-key → hash/sign so workshop
      language matches the lectures.'
    cn: 按 BCS021 当周进度跟课：用中英双语把古典 → AES → 公钥 → 散列/签名补齐，并保留课堂会用的英文说法。
  - en: 'Final report coaching: pick a topic, design the experiment / demo, build result tables, and draft
      in your own words (structure + viva — not generative-AI writing).'
    cn: 期末报告辅导：选题、设计实验 / 演示、搭结果对照表，并陪你本人动笔（梳结构、练 viva，不用生成式 AI 代写）。
  - en: 'Assignments / in-class practice: approach review and live debug against the real brief you bring.'
    cn: 作业 / 课堂练习：对着你带来的真实 brief 拆题、梳思路、现场 debug。
  - en: 'Exam / quiz prep: timed drills on primitive jobs, modes, and protocol pitfalls for this course.'
    cn: 考试 / quiz 突击：按这门课的原语职责、工作模式和协议陷阱做限时练习。
  faq:
