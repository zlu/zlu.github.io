  lead_en: BCS010 數據庫系統 at City University of Macau is where one wrong schema or join quietly breaks every
    later query. The hard part is turning that arc into a method you can repeat on the next brief — not
    rereading slides the night before.
  lead_cn: 在澳门城市大学上 BCS010，Schema 或 join 偏一点，后面查询会整条链一起歪。
  overview_en: BCS010 數據庫系統 sits in databases & information systems. There is a weekly arc (about week
    1–6) plus assessed work that expects you to apply the same ideas under deadline pressure. Students
    stall when terminology outruns notes, when a demo makes sense in class but not alone, or when the
    write-up / autograder asks for a method the notebook never made explicit. Sample slides from our concept-review
    tutoring deck are below.
  overview_cn: BCS010 是澳门城市大学「数据库与信息系统」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。学期里常会绕着SQL、Schema 与数据库这些点转。大约第 1–6
    周有连续周课主线，作业会要求你在 DDL 下用同一套方法。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告 / autograder 要的方法在 notebook
