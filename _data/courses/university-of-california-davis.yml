    meta_description_en: >-
      ECS 032A UC Davis tutoring (Fall 2026). Gentle Python for non-CS majors
      (econ and beyond), oriented toward data analysis. Bilingual help on weekly
      quizzes, Gradescope homework, and the concepts that actually stick.
    lead_en: >-
      ECS 032A is built for students outside Computer Science — economics and other
      majors who need useful Python, not a CS pipeline. The workload is real, but the
      pacing is gentle: short weekly quizzes instead of midterms, and homework that
      builds from I/O toward files and data. Success is mostly consistency — show up
      for every quiz, finish the HWs, and learn the concepts instead of patching
      until Gradescope goes green.
    lead_cn: >-
      ECS 032A 面向非计算机专业（经济等）的同学，目标是写出对自己专业有用的 Python，
      而不是走 CS 主线。节奏偏温和：用短周测代替期中，作业从输入输出逐步做到文件与数据。
      真正拉开差距的是坚持——每次 quiz 都去、作业按时交、把概念学透，而不是只会改到
      Gradescope 变绿。
    overview_en: >-
      Introduction to Programming (FQ 2026, sections B01–B06) teaches Python as a
      practical tool for problem-solving and light data analysis: talking to the user,
      working with data files, and using built-in structures so you can automate work
      in your own field. The usual text is Severance’s Python for Everybody (exploring
      data with Python 3), with lecture readings and a core-Python cheat sheet on
      Canvas. Assessment is split evenly: about half from frequent in-lab open-note
      quizzes (best eight count; an optional final pair of comprehensive quizzes can
      only help), and half from programming homework (eight full assignments after a
      short welcome task — typically the top six count, with a small share for code
      comments). Late work often uses a blend of on-time and late scores. Staffed
      “stay late and code” nights support weeks with due dates. Plan on substantial
      weekly practice; fluency comes from writing programs, not from rereading slides.
    overview_cn: >-
      Introduction to Programming（2026 秋，B01–B06）把 Python 当成解决实际问题、
      做轻度数据分析的工具：与用户交互、读写数据文件、使用内置数据结构，好把本专业的
      重复劳动自动化。常用教材是 Severance《Python for Everybody》（用 Python 3
      探索数据），Canvas 上还有讲义阅读与 Core Python 速查表。成绩大致对半开：一半来自
      讨论课机房的开卷短测（取最好的八次；可选期末综合测验只会抬分不会拉低），一半来自
      编程作业（欢迎作业之后约八次完整作业，通常取最高六次，另有一小部分看代码注释）。
      迟交常按准时分与迟交分的折中计。作业周有 SLAC 晚间答疑。每周要留出够用的练习时间；
      编程靠写，不靠反复看幻灯片。
