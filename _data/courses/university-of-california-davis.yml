  session_angles:
  - en: Map this week’s reading to one small data task before opening the assignment
    cn: 写作业前，先把本周阅读对应到一个小数据任务
  - en: You drive the IDE; we read Gradescope failures as diagnostics, not as a score scare
    cn: 你来操作 IDE，我们把 Gradescope 失败当诊断信息，而不是分数惊吓
  - en: Quiz drills in the same open-note, short-problem style as discussion section
    cn: 按讨论课开卷短题风格做 quiz 练习
  - en: After each HW, name the concept you reused — that is what the next quiz actually checks
    cn: 每次作业后点名你复用的概念——那才是下次 quiz 真正在考的
  tutoring:
  - en: 'Lecture sync: bilingual walkthrough of the week’s Python ideas with a data-analysis lens (files,
      lists, simple summaries).'
    cn: 同步跟课：用中英双语按数据分析视角过本周 Python 概念（文件、列表、简单汇总）。
  - en: 'Homework: brief → plan → live debug in your environment; comments that match what the code really
      does.'
    cn: 作业：拆题 → 梳步骤 → 在你的环境里现场 debug；注释写清代码实际在做什么。
  - en: 'Quiz prep: short timed drills so weekly lab quizzes and the optional final pair feel familiar.'
    cn: 测验突击：短时限练习，让每周机房 quiz 和可选期末综合测验更熟悉。
  - en: 'Success habits: keep the quiz streak, submit HW early enough to iterate, and lock concepts before
      the next unit.'
    cn: 成功习惯：测验不断档、作业提早交好留改分轮次，并在进入下一单元前把概念钉牢。
