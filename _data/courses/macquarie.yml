      the course uses them; Losses, optimisers, and training loops; Regularisation — dropout, weight decay,
      early stopping…. Say which week or assessment you are on when booking.
    a_cn: 神经网络基础 — 层、激活、反向传播直觉、课程用到的 CNN / RNN / Transformer、损失函数、优化器与训练循环、正则 — dropout、权重衰减、早停。预约时说明你卡在哪一周或哪次评估。
  - q_en: What should I bring to the first session?
