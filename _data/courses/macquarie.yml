  meta_description_en: COMP2200 Macquarie tutoring (Data Science). Weekly lecture arc moves on before
    last week’s method is solid? Bilingual Chinese/English help.
  lead_en: COMP2200 Data Science at Macquarie University is where messy notebooks and weak method stories
    lose marks even when a model runs. The hard part is turning that arc into a method you can repeat
    on the next brief — not rereading slides the night before.
  lead_cn: 在麦考瑞大学上 COMP2200，就算模型能跑，凌乱 notebook 和站不住的方法叙事也会丢分。
  overview_en: COMP2200 Data Science sits in data science & analytics. There is a weekly arc (about week
    1–4) plus assessed work that expects you to apply the same ideas under deadline pressure. Students
    stall when terminology outruns notes, when a demo makes sense in class but not alone, or when the
    write-up / autograder asks for a method the notebook never made explicit.
  overview_cn: COMP2200 是麦考瑞大学「数据科学与分析」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。学期里常会绕着ML 流水线、特征与模型选择、数学基础与证明习惯这些点转。大约第
    1–4 周有连续周课主线，作业会要求你在 DDL 下用同一套方法。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告 / autograder 要的方法在
    notebook 里从未写清。
  topics:
  - en: ML pipelines, features, and model choice
    cn: ML 流水线、特征与模型选择
  - en: Math foundations and proof habits
    cn: 数学基础与证明习惯
  - en: Pandas / dplyr style transforms and joins
    cn: Pandas / dplyr 风格的变换与 join
  - en: EDA, distributions, and “what question am I answering?”
    cn: 探索性分析、分布，以及“我在回答什么问题”
  - en: Feature hygiene before modelling
    cn: 建模前的特征卫生
  - en: Visualisation that supports a claim
    cn: 能支撑结论的可视化
  - en: Group projects — ownership of one clear analysis thread
    cn: 小组作业——把住一条清晰分析主线
  - en: Reproducible notebooks and environments
    cn: 可复现的 notebook 与环境
  stuck:
  - en: Weekly lecture arc moves on before last week’s method is solid
    cn: 周课往前赶，上一周的方法还没练稳
  - en: Tool output produced, write-up cannot defend method choice
    cn: 工具输出有了，报告却说不清为何选这个方法
  - en: Messy merges and silent NaNs that break later metrics
    cn: 混乱的 merge 与静默 NaN，后面指标全歪
  - en: Pretty plots that do not answer the brief
    cn: 图很漂亮，但没回答题目要求
  - en: Last-minute modelling with no data story
    cn: 临近 DDL 才建模，没有数据故事
  session_angles:
  - en: Rebuild this week’s lecture idea before touching the homework
    cn: 先重建当周讲座概念，再碰作业
  - en: Rebuild the analysis pipeline step by step from the brief
    cn: 按 brief 逐步重建分析流水线
  - en: Sanity-check joins, missingness, and leakage risks
    cn: 核验 join、缺失值与泄漏风险
  tutoring:
  - en: 'Lecture sync for COMP2200: bilingual catch-up so workshop / tutorial language matches the lectures.'
    cn: 按 COMP2200 当周进度跟课：用中英双语把没听清的概念补上，并保留 workshop / tutorial 会用的英文说法。
  - en: 'Assignments: approach review and live debug against the real brief.'
    cn: 作业辅导：对着真实 brief 拆题、梳思路、现场 debug。
  - en: 'Exam / quiz prep: timed drills on weak spots and recurring question shapes for this course.'
    cn: 考试 / quiz 突击：按这门课常考题型和你的薄弱点做限时练习。
