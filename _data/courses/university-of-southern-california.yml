  lead_en: 'EE 155 Introduction to Computer Programming for Electrical Engineers at USC is a 4-unit C++
    course built around Brief C++: Late Objects (3rd ed., Cay S. Horstmann): data representation → control
    structures → functions → recursion → arrays and composite types → basic algorithm analysis → file
    I/O, with weekly lab programming on EdStem. The hard part is rarely “never seen cout” — it is paper
    midterms and labs where almost-correct code still fails on prototypes, pointer vs reference parameter
    choice, recursion base cases, or vector/map edge behaviour. Tutoring rebuilds that syllabus arc in
    bilingual walkthroughs, then drills the question shapes and live-debugs the lab where it breaks.'
  lead_cn: 'USC 的 EE 155（电气工程计算机编程导论）是 4 学分 C++ 课，教材用 Cay S. Horstmann《Brief C++: Late Objects》第 3 版：数据表示
    → 控制结构 → 函数 → 递归 → 数组与复合类型 → 基础算法分析 → 文件 I/O，配合每周 EdStem Lab。真正难的往往不是「没见过 cout」——而是纸笔 Midterm 与 Lab：代码差不多对，一碰上函数原型、指针
    vs 引用传参、递归终止条件，或 vector / map 边界就挂。辅导用中英双语重建这条大纲主线，再按真题题型练，并在你的 Lab 断开处现场 debug。'
  overview_en: 'One-to-one tutoring for EE 155 at the University of Southern California. The course introduces
    programming and algorithmic thinking for EE through C++, following Brief C++: Late Objects (Horstmann,
    3rd ed.). Covered topics: data representation (ints, floats, strings); control structures; functions
    and modular design; recursion; arrays, vectors/deques, maps, and structs; basic algorithm analysis;
    file I/O; weekly lab assignments. Exams are typically paper (with a provided cheat sheet) via Gradescope
    regrades; labs and lecture exercises run on EdStem. Bring your lab brief, failing EdStem case, lecture-slide
    screenshot, or the Horstmann chapter / topic you cannot map onto the midterm question. Sample slides
    from our concept-review tutoring deck are below.'
  overview_cn: 'EE 155（南加州大学）一对一辅导。课程用 C++ 把编程与算法思维带给 EE，教材对齐 Horstmann《Brief C++: Late Objects》第 3 版。覆盖主题包括数据表示（整数、浮点、字符串）、控制结构、函数与模块化、递归、数组、
    vector / deque、map 与 struct、基础算法分析、文件 I/O，以及每周 Lab。考试多为纸笔（会发 cheat sheet）， 复议走 Gradescope；Lab 与课上练习在
    EdStem。预约时请带上 Lab brief、失败测例、卡住的课件截图，或对不上 Midterm 题的 Horstmann 章节 / 主题名。 下方有我们概念复习辅导课件的样例页。'
