  lead_en: 'CS229 is classic Stanford machine learning: supervised learning, learning theory, and generative
    / discriminative models under problem-set pressure. The hard part is not recognising algorithm names
    — it is deriving updates, choosing models for a brief, and writing proofs / derivations that match
    the lecture notation.'
  lead_cn: CS229 是斯坦福经典机器学习：监督学习、学习理论，以及问题集压力下的生成 / 判别模型。难的不是认得算法名字，而是推导更新式、按 brief 选模型，并用与课堂一致的记号把证明
    / 推导写清楚。
  overview_en: Machine Learning (CS229) covers core supervised methods, probabilistic models, and the
    math used to justify them. Problem sets expect derivations and careful notation, not only library
    calls. Students stall when Greek letters outrun the update rule picture, when generative vs discriminative
    choice is fuzzy, or when a derivation skips the step the marker wants to see.
  overview_cn: Machine Learning（CS229）覆盖核心监督学习、概率模型，以及为它们辩护的数学。问题集要推导和严谨记号，而不只是调库。卡点常在希腊字母跑在更新式画面前面、生成
