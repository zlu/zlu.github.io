- code: CSC209H1
  title: Software Tools and Systems Programming
  theme: systems
  meta_description_en: CSC209H1 tutoring (Software Tools and Systems…). Stuck on OS architecture — kernel
    vs user, system calls, interrupts? Bilingual Chinese/English help.
  lead_en: 'CSC209H1 Software Tools and Systems Programming at University of Toronto: OS architecture
    — kernel vs user, system calls, interrupts → Processes, threads, PCBs, and scheduling → Concurrency
    — mutexes, semaphores, condition variables, deadlock → Virtual memory — paging, TLB, replacement (FIFO/LRU/CLOCK)….
    Processes, memory, concurrency, and file-system ideas stack faster than labs can catch up. Tutoring
    rebuilds that syllabus arc, then debugs the lab or assignment where it breaks.'
  lead_cn: 在多伦多大学上 CSC209H1，主线是操作系统结构 — 内核/用户态、系统调用、中断 → 进程、线程、PCB 与调度 → 并发 — mutex、信号量、条件变量、死锁 → 虚拟内存
    — 分页、TLB、置换（FIFO/LRU/CLOCK）。进程、内存、并发和文件系统叠得比 Lab 跟得上的速度还快。辅导先重建这条大纲主线，再对着 Lab / 作业里断开的地方 debug。
  overview_en: 'One-to-one tutoring for CSC209H1 Software Tools and Systems Programming at University
    of Toronto. Covered topics: OS architecture — kernel vs user, system calls, interrupts; Processes,
    threads, PCBs, and scheduling; Concurrency — mutexes, semaphores, condition variables, deadlock; Virtual
    memory — paging, TLB, replacement (FIFO/LRU/CLOCK); File systems — inodes, allocation, journaling,
    protection. Bring your brief, failing test, lecture slide screenshot, or the topic name you are stuck
    on.'
  overview_cn: CSC209H1（多伦多大学）一对一辅导。覆盖主题包括操作系统结构 — 内核/用户态、系统调用、中断、进程、线程、PCB 与调度、并发 — mutex、信号量、条件变量、死锁、虚拟内存
    — 分页、TLB、置换（FIFO/LRU/CLOCK）。预约时请带上 brief、失败测例、卡住的课件截图，或主题名。
  topics:
  - en: OS architecture — kernel vs user, system calls, interrupts
    cn: 操作系统结构 — 内核/用户态、系统调用、中断
  - en: Processes, threads, PCBs, and scheduling
    cn: 进程、线程、PCB 与调度
  - en: Concurrency — mutexes, semaphores, condition variables, deadlock
    cn: 并发 — mutex、信号量、条件变量、死锁
  - en: Virtual memory — paging, TLB, replacement (FIFO/LRU/CLOCK)
    cn: 虚拟内存 — 分页、TLB、置换（FIFO/LRU/CLOCK）
  - en: File systems — inodes, allocation, journaling, protection
    cn: 文件系统 — inode、分配、日志、保护
