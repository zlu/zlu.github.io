- code: CS2106
  title: Introduction to Operating Systems
  theme: systems
  meta_description_en: CS2106 NUS tutoring (Introduction to Operating Systems). Stuck on processes, concurrency,
    paging, or C/Linux labs? Bilingual Chinese/English help.
  lead_en: 'CS2106 Introduction to Operating Systems links OS structure to real Unix/Linux behaviour:
    processes and scheduling, concurrency and synchronisation, virtual memory, and file systems. Labs
    are C in a Linux environment — tutoring turns lecture abstractions into a method you can debug when
    fork, locks, or paging behave differently than the slide.'
  lead_cn: CS2106 Introduction to Operating Systems 把操作系统结构接到真实 Unix/Linux 行为上：进程与调度、并发与同步、虚拟内存、文件系统。Lab
    是 Linux 环境下的 C——辅导会把课上抽象变成方法，当你的 fork、锁或分页和课件对不上时，能按步骤 debug。
  overview_en: 'One-to-one tutoring for CS2106 at NUS: lecture catch-up on kernel / process / concurrency
    / memory / file-system ideas, then live debug on your C lab or exam drill. Officially 4 units, offered
    Semesters 1 and 2; typical format is lectures, tutorials, and programming labs. Formal prereq is a
    D or better in CS2100 (or CS2100DE / CS2100HS / EE2007 / EE2024 / EE2028); precluded with CG2271,
    EE4214, or the 2001CEGHON pathway. Check NUSMods for the current semester timetable and exam date.
    Bring your lab brief, failing test, or a screenshot of the lecture slide you are stuck on when you
    book.'
  overview_cn: 新加坡国立大学 CS2106 一对一辅导：先补内核 / 进程 / 并发 / 内存 / 文件系统概念，再对着你的 C Lab 或考前题现场 debug。正式 4 学分，Sem
    1 与 Sem 2 均开；常见形式是讲座、tutorial 与编程 Lab。先修通常要求 CS2100（或 CS2100DE / CS2100HS / EE2007 / EE2024 / EE2028）成绩
    D 及以上；与 CG2271、EE4214 或 2001CEGHON 路径互斥。当学期课表与考试时间以 NUSMods 为准。预约时请带上你的 Lab brief、失败测例，或卡住的那页课件截图。
  topics:
  - en: OS architecture — kernel vs user mode, system calls, interrupts
    cn: 操作系统结构 — 内核/用户态、系统调用、中断
  - en: Processes and threads — PCB, fork/exec/wait, scheduling (RR, MLFQ)
    cn: 进程与线程 — PCB、fork/exec/wait、调度（RR、MLFQ）
  - en: Concurrency — critical sections, mutexes, semaphores, condition variables
    cn: 并发 — 临界区、mutex、信号量、条件变量
  - en: Classic sync problems and deadlock (mutual exclusion, hold-and-wait)
    cn: 经典同步问题与死锁（互斥、占有等待）
  - en: Memory — address spaces, paging, TLB, replacement (FIFO, LRU, CLOCK)
    cn: 内存 — 地址空间、分页、TLB、置换（FIFO、LRU、CLOCK）
  - en: File systems — inodes, links, allocation, journaling; protection / ACLs
    cn: 文件系统 — inode、链接、分配、日志；保护 / ACL
  - en: C/Linux labs — shell, processes, sync, memory, and file-system programming
    cn: C/Linux Lab — shell、进程、同步、内存与文件系统编程
  stuck:
  - en: Lecture process model makes sense; your fork/exec/wait lab does not
    cn: 课上进程模型听得懂，自己的 fork/exec/wait Lab 却对不上
  - en: Race or deadlock only shows under timing you cannot reproduce alone
    cn: 竞态 / 死锁只在某种时序下出现，自己复现不了
  - en: Paging / TLB / replacement algorithms mix up when the exam figure changes
    cn: 考试换一张图，分页 / TLB / 置换算法就搅在一起
  - en: Semaphore vs mutex vs condition variable — pick the wrong tool under time pressure
    cn: 限时下分不清该用信号量、mutex 还是条件变量
  - en: Man pages and errno denser than lecture pace; lab fails for opaque reasons
    cn: Man page 和 errno 比课堂更密；Lab 挂了却看不出原因
  session_angles:
  - en: Draw the process / lock / page path before changing C code
    cn: 改 C 代码前先画进程 / 锁 / 页路径
  - en: 'Lab debug: you drive; we chase races, waits, and failing asserts'
    cn: Lab 调试：你来操作；一起追竞态、等待和失败断言
  - en: Translate OS jargon into a bilingual cheat sheet for the 2-hour exam
    cn: 把操作系统术语整理成双语速查，对准两小时大考
  tutoring:
  - en: 'Assignments: approach review and live debug against the real brief.'
    cn: 作业辅导：对着真实 brief 拆题、梳思路、现场 debug。
  - en: 'Labs: approach review and live debug on your C/Linux programming (you at the keyboard).'
    cn: Lab 辅导：拆 brief、梳思路，对着你的 C/Linux 编程现场 debug（你来操作键盘）。
  - en: 'Exam prep: timed drills on scheduling, sync, paging, and file-system question shapes.'
    cn: 考前突击：按调度、同步、分页、文件系统常考题型做限时练习。
  faq:
  - q_en: What does CS2106 cover?
    q_cn: CS2106 学什么？
    a_en: OS structuring and architecture, processes and scheduling, concurrency and synchronisation,
      memory management (including virtual memory and paging), file systems, and protection — tied to
      contemporary Unix/Linux behaviour. Bring the week or lab you are on when booking.
    a_cn: 操作系统结构与体系、进程与调度、并发与同步、内存管理（含虚拟内存与分页）、文件系统与保护——并接到当代 Unix/Linux 行为。预约时说明你卡在哪一周或哪个 Lab。
  - q_en: What are the formal prerequisites?
    q_cn: 正式先修是什么？
    a_en: A grade of D or better in CS2100 (or CS2100DE, CS2100HS, EE2007, EE2024, or EE2028). Preclusions
      include CG2271, EE4214, and the 2001CEGHON pathway — confirm on NUSMods for your cohort.
    a_cn: 通常要求 CS2100（或 CS2100DE、CS2100HS、EE2007、EE2024、EE2028）成绩 D 及以上。互斥包括 CG2271、EE4214 与 2001CEGHON
      路径——以你届 NUSMods 说明为准。
  - q_en: How are labs structured?
    q_cn: Lab 大概怎么上？
    a_en: Expect C programming in a Linux/Unix environment across shell, processes, synchronisation, memory,
      and file-system ideas. Bring your brief, starter, or failing test so we debug your setup — not a
      generic demo.
    a_cn: 常见是在 Linux/Unix 环境下用 C 做 shell、进程、同步、内存与文件系统相关编程。请带上 brief、starter 或失败测例，对着你的环境 debug，而不是泛泛演示。
  - q_en: Are sample slides available?
    q_cn: 有辅导课件样例吗？
    a_en: Yes — sample pages from our concept-review tutoring deck are on this page.
    a_cn: 有，本页有我们概念复习辅导课件的样例页。
