  lead_en: 'CS1010E Programming Methodology at National University of Singapore: Variables, types, and
    expressions in the course language → Control flow — branching, loops, and nested logic → Functions
    / procedures and stepwise decomposition → Collections — arrays/lists/strings and indexing bugs…. Problem
    decomposition and edge cases hit harder than memorising syntax. Tutoring rebuilds that syllabus arc,
    then debugs the lab or assignment where it breaks.'
  lead_cn: 在新加坡国立大学上 CS1010E，主线是课程语言中的变量、类型与表达式 → 控制流 — 分支、循环与嵌套逻辑 → 函数 / 过程与逐步拆题 → 集合 — 数组/列表/字符串与下标坑。真正难的往往是拆题和边界，而不是背语法。辅导先重建这条大纲主线，再对着
    Lab / 作业里断开的地方 debug。
  overview_en: 'One-to-one tutoring for CS1010E Programming Methodology at National University of Singapore.
    Covered topics: Variables, types, and expressions in the course language; Control flow — branching,
    loops, and nested logic; Functions / procedures and stepwise decomposition; Collections — arrays/lists/strings
    and indexing bugs; I/O, specs, and exact output the autograder expects. Bring your brief, failing
    test, lecture slide screenshot, or the topic name you are stuck on. Sample slides from our concept-review
    tutoring deck are below.'
  overview_cn: CS1010E（新加坡国立大学）一对一辅导。覆盖主题包括课程语言中的变量、类型与表达式、控制流 — 分支、循环与嵌套逻辑、函数 / 过程与逐步拆题、集合 — 数组/列表/字符串与下标坑。预约时请带上
    brief、失败测例、卡住的课件截图，或主题名。 下方有我们概念复习辅导课件的样例页。
