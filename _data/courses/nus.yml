  - en: Functions / procedures and stepwise decomposition
    cn: 函数 / 过程与逐步拆题
  - en: Collections — arrays/lists/strings and indexing bugs
    cn: 集合 — 数组/列表/字符串与下标坑
  - en: I/O, specs, and exact output the autograder expects
    cn: I/O、规格与 autograder 要求的精确输出
