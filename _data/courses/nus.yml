  lead_en: CS1010E Programming Methodology at National University of Singapore is where briefs, tooling,
    and autograder edge cases hit harder than syntax itself. The hard part is turning that arc into a
    method you can repeat on the next brief — not rereading slides the night before.
  lead_cn: 在新加坡国立大学上 CS1010E，真正难的往往不是语法，而是 brief 读不透、工具链不熟，以及 autograder 专砸边界。
  overview_en: 'CS1010E Programming Methodology sits in programming & software construction. Evidence
    from

    There is a weekly arc (about week 1–5) plus assessed work that expects you to apply the same ideas
    under deadline pressure. Students stall when terminology outruns notes, when a demo makes sense in
    class but not alone, or when the write-up / autograder asks for a method the notebook never made explicit.
    Sample slides from our concept-review tutoring deck are below.'
  overview_cn: CS1010E 是新加坡国立大学「编程与软件构造」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。学期里常会绕着算法、ADT 与复杂度、编程基础与调试这些点转。大约第
    1–5 周有连续周课主线，作业会要求你在 DDL 下用同一套方法。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告 / autograder 要的方法在
    notebook 里从未写清。 下方有我们概念复习辅导课件的样例页。
