    autograder 不一致。真正难的往往不是语法，而是 brief 读不透、工具链不熟，以及 autograder 专砸边界。辅导先重建这条大纲主线，再对着 Lab / 作业里断开的地方 debug。
  overview_en: 'One-to-one tutoring for INFO1110 Introduction to Programming at University of Sydney.
    Covered topics: Reading the brief — I/O, edges, and marking points before code; Control flow, functions,
    and decomposition; Data basics — arrays/lists/strings and common bugs; Testing locally vs autograder
    mismatches; Debugging method — reproduce, bisect, fix. Bring your brief, failing test, lecture slide
    screenshot, or the topic name you are stuck on.'
  overview_cn: INFO1110（悉尼大学）一对一辅导。覆盖主题包括先读 brief — 输入输出、边界与评分点，再动手、控制流、函数与拆题、数据基础 — 数组/列表/字符串与常见坑、本地测试
