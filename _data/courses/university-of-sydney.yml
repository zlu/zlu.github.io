  - en: Reading the brief — I/O, edges, and marking points before code
    cn: 先读 brief — 输入输出、边界与评分点，再动手
  - en: Control flow, functions, and decomposition
    cn: 控制流、函数与拆题
  - en: Data basics — arrays/lists/strings and common bugs
    cn: 数据基础 — 数组/列表/字符串与常见坑
