    and marking points before code → Control flow, functions, and decomposition → Data basics — arrays/lists/strings
    and common bugs → Testing locally vs autograder mismatches…. Briefs, tooling, and autograder edge
    cases hit harder than syntax itself. Tutoring rebuilds that syllabus arc, then debugs the lab or assignment
    where it breaks.'
