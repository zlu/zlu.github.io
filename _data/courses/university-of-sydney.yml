- title: Fundamentals of Marketing Analytics
  material: MKTG1011-Foundamentals of Marketing Analytics
  code: MKTG1011
  theme: data-science
  meta_description_en: MKTG1011 Sydney tutoring (Fundamentals of Marketing Analytics). Notebook runs on
    the sample cell, fails on the hidden / full dataset case?
  lead_en: MKTG1011 Mktg1011 Fundamentals Of Marketing Analytics at University of Sydney is where messy
    notebooks and weak method stories lose marks even when a model runs. The hard part is turning that
    arc into a method you can repeat on the next brief — not rereading slides the night before.
  lead_cn: 在悉尼大学上 MKTG1011，就算模型能跑，凌乱 notebook 和站不住的方法叙事也会丢分。
  overview_en: MKTG1011 Mktg1011 Fundamentals Of Marketing Analytics sits in data science & analytics.
    Students stall when terminology outruns notes, when a demo makes sense in class but not alone, or
    when the write-up / autograder asks for a method the notebook never made explicit. Sample slides from
    our concept-review tutoring deck are below.
  overview_cn: MKTG1011 是悉尼大学「数据科学与分析」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告
    / autograder 要的方法在 notebook 里从未写清。 下方有我们概念复习辅导课件的样例页。
  topics:
  - en: Notebook workflows the marker can re-run
    cn: 改卷人能复跑的 notebook 工作流
  - en: Pandas / dplyr style transforms and joins
    cn: Pandas / dplyr 风格的变换与 join
  - en: EDA, distributions, and “what question am I answering?”
    cn: 探索性分析、分布，以及“我在回答什么问题”
  - en: Feature hygiene before modelling
    cn: 建模前的特征卫生
  - en: Visualisation that supports a claim
    cn: 能支撑结论的可视化
  - en: Group projects — ownership of one clear analysis thread
    cn: 小组作业——把住一条清晰分析主线
  stuck:
  - en: Notebook runs on the sample cell, fails on the hidden / full dataset case
    cn: notebook 在样例 cell 能过，全量 / 隐藏数据就挂
  - en: Tool output produced, write-up cannot defend method choice
    cn: 工具输出有了，报告却说不清为何选这个方法
  - en: Messy merges and silent NaNs that break later metrics
    cn: 混乱的 merge 与静默 NaN，后面指标全歪
  - en: Pretty plots that do not answer the brief
    cn: 图很漂亮，但没回答题目要求
  - en: Last-minute modelling with no data story
    cn: 临近 DDL 才建模，没有数据故事
  session_angles:
  - en: You type in your environment; we keep the plan visible beside the editor
    cn: 你在自己的环境里打字；计划始终放在编辑器旁边
  - en: Rebuild the analysis pipeline step by step from the brief
    cn: 按 brief 逐步重建分析流水线
  - en: Sanity-check joins, missingness, and leakage risks
    cn: 核验 join、缺失值与泄漏风险
