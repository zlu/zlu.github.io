- code: EE6430
  material: EE6430 – SPECIAL TOPICS IN MACHINE LEARNING
  title: SPECIAL TOPICS IN MACHINE LEARNING
  theme: machine-learning
  meta_description_en: EE6430 NTU tutoring (SPECIAL TOPICS IN MACHINE LEARNING). Tool output produced,
    write-up cannot defend method choice? Bilingual Chinese/English help.
  lead_en: EE6430 SPECIAL TOPICS IN MACHINE LEARNING at Nanyang Technological University is where method
    names blur together until pipelines, metrics, and write-ups diverge. The hard part is turning that
    arc into a method you can repeat on the next brief — not rereading slides the night before.
  lead_cn: 在南洋理工大学上 EE6430，方法名搅在一起，pipeline、指标和报告对不上就会崩。
  overview_en: 'EE6430 SPECIAL TOPICS IN MACHINE LEARNING sits in machine learning & ai. Evidence from

    Students stall when terminology outruns notes, when a demo makes sense in class but not alone, or
    when the write-up / autograder asks for a method the notebook never made explicit. Sample slides from
    our concept-review tutoring deck are below.'
  overview_cn: EE6430 是南洋理工大学「机器学习与人工智能」方向的课，考核通常既看你是否真懂，也看你能不能当场动手。学期里常会绕着神经网络 / 深度学习 / AI、ML 流水线、特征与模型选择这些点转。留学生真正吃力的，往往不是「完全没见过」，而是课上术语来得太快、课上演示自己复不出来，或报告
    / autograder 要的方法在 notebook 里从未写清。 下方有我们概念复习辅导课件的样例页。
