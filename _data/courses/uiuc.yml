- code: CS124
  title: Introduction to Computer Science I
  theme: programming
  meta_description_en: CS124 tutoring (Introduction to Computer Science I). Stuck on Reading the brief
    — I/O, edges, and marking points before code? Bilingual Chinese/English …
  lead_en: 'CS124 Introduction to Computer Science I at University of Illinois Urbana-Champaign: Reading
    the brief — I/O, edges, and marking points before code → Control flow, functions, and decomposition
    → Data basics — arrays/lists/strings and common bugs → Testing locally vs autograder mismatches….
    Briefs, tooling, and autograder edge cases hit harder than syntax itself. Tutoring rebuilds that syllabus
    arc, then debugs the lab or assignment where it breaks.'
  lead_cn: 在伊利诺伊大学厄巴纳-香槟分校上 CS124，主线是先读 brief — 输入输出、边界与评分点，再动手 → 控制流、函数与拆题 → 数据基础 — 数组/列表/字符串与常见坑 → 本地测试
    vs autograder 不一致。真正难的往往不是语法，而是 brief 读不透、工具链不熟，以及 autograder 专砸边界。辅导先重建这条大纲主线，再对着 Lab / 作业里断开的地方
    debug。
  overview_en: 'One-to-one tutoring for CS124 Introduction to Computer Science I at University of Illinois
    Urbana-Champaign. Covered topics: Reading the brief — I/O, edges, and marking points before code;
    Control flow, functions, and decomposition; Data basics — arrays/lists/strings and common bugs; Testing
    locally vs autograder mismatches; Debugging method — reproduce, bisect, fix. Bring your brief, failing
    test, lecture slide screenshot, or the topic name you are stuck on.'
  overview_cn: CS124（伊利诺伊大学厄巴纳-香槟分校）一对一辅导。覆盖主题包括先读 brief — 输入输出、边界与评分点，再动手、控制流、函数与拆题、数据基础 — 数组/列表/字符串与常见坑、本地测试
