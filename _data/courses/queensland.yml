- code: INFS7410
  material: INFS7410
  title: Information Retrieval and Web Search
  theme: web-mobile
  meta_description_en: INFS7410 University tutoring (Information Retrieval and Web Search). Stuck on Math
    foundations and proof habits? Bilingual Chinese/English help.
  lead_en: 'INFS7410 Information Retrieval and Web Search at University of Queensland. Front-end and back-end
    failures mask each other inside one brief. Tutoring: lecture catch-up, assignment debug, exam drills
    — methods you can reuse.'
  lead_cn: 在昆士兰大学上 INFS7410，前后端报错互相掩盖，一份 brief 里很难定位坏在哪一层。辅导对着你卡住的步骤练，练到下一份 brief 还能自己做。
  overview_en: 'INFS7410 Information Retrieval and Web Search (Web, mobile & HCI) at University of Queensland.
    Common topics: Math foundations and proof habits; Web / mobile app structure. Weekly arc about week
    1–13, plus assessed work under deadline. People stall when terms outrun notes, when a class demo does
    not replay alone, or when the write-up / autograder wants a method the notebook never showed. Sample
    slides from our concept-review tutoring deck are below.'
  overview_cn: INFS7410 是昆士兰大学的「Web、移动与人机交互」课，既要真懂，也要能动手。常见内容包括数学基础与证明习惯、Web / 移动应用结构。大约第 1–13 周有连续周课，作业会要求你在
    DDL 下用同一套方法。很多人不是完全没学过，而是课上术语太快、自己复不出来，或报告 / autograder 要的方法在 notebook 里从没写清。 下方有我们概念复习辅导课件的样例页。
