  - en: Weekly lecture arc moves on before last week’s method is solid
    cn: 周课往前赶，上一周的方法还没练稳
  - en: Notebook runs on the sample cell, fails on the hidden / full dataset case
    cn: notebook 在样例 cell 能过，全量 / 隐藏数据就挂
  - en: UI looks done but integration tests fail
    cn: 界面看起来完成了，集成测试不过
