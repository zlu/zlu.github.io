  - {en: "Keep a transform log beside the notebook", cn: "在 notebook 旁保留变换日志"}

- id: web-mobile
  theme: web-mobile
  match: web\s+(?:development|programming|application|technology|design|search)|mobile\s+(?:app|development)|frontend|front[\s-]*end|backend|full[\s-]*stack|human[\s-]*computer|hci|interaction\s+design|information\s+retrieval|multimodal\s+interface|digital\s+media
  hard_en: front-end and back-end failures mask each other inside one brief
