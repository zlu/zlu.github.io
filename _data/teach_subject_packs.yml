# Course-specific subject packs for stub enrichment.
# Match against "code title" (case-insensitive). First match wins.
# Only the page shell is generic — pack topics/stuck/hard must name the subject.
#
# Used by:
#   .scripts/enrich_teach_stubs.py
#   _plugins/teach_pages.rb (synthesize_course_copy fallback)
---
packs:
- id: operating-systems
  theme: systems
  match: operat(?:ing)?\s*systems?|(?:\bos\b).{0,20}(?:system|program)|systems?\s*program
  hard_en: processes, memory, concurrency, and file-system ideas stack faster than labs can catch up
  hard_cn: 进程、内存、并发和文件系统叠得比 Lab 跟得上的速度还快
  topics:
  - {en: "OS architecture — kernel vs user, system calls, interrupts", cn: "操作系统结构 — 内核/用户态、系统调用、中断"}
  - {en: "Processes, threads, PCBs, and scheduling", cn: "进程、线程、PCB 与调度"}
  - {en: "Concurrency — mutexes, semaphores, condition variables, deadlock", cn: "并发 — mutex、信号量、条件变量、死锁"}
  - {en: "Virtual memory — paging, TLB, replacement (FIFO/LRU/CLOCK)", cn: "虚拟内存 — 分页、TLB、置换（FIFO/LRU/CLOCK）"}
  - {en: "File systems — inodes, allocation, journaling, protection", cn: "文件系统 — inode、分配、日志、保护"}
  - {en: "C/Linux labs tying lectures to real behaviour", cn: "把课接到真实行为的 C/Linux Lab"}
  stuck:
  - {en: "Lecture process model clear; fork/wait lab does not match", cn: "课上进程模型清楚，fork/wait Lab 却对不上"}
  - {en: "Race or deadlock only under timing you cannot reproduce", cn: "竞态 / 死锁只在某种时序下出现，复现不了"}
  - {en: "Paging / TLB / replacement mix up when the exam figure changes", cn: "考试换图，分页 / TLB / 置换就搅在一起"}
  session_angles:
  - {en: "Draw process / lock / page path before changing code", cn: "改代码前先画进程 / 锁 / 页路径"}
  - {en: "Reproduce the race, then patch the root cause", cn: "先复现竞态，再修根因"}

- id: computer-networks
  theme: systems
  match: computer\s*networks?|network(?:ing)?\s*(?:and|&)|networks?\s+and\s+(?:appl|commun)|(?:^|[\s/])networks?(?:\s|$)|data\s+communications?|\btcp\b|\bosi\b|socket\s*program|wireless\s*networks?|systems?\s+and\s+networks?
  hard_en: layers, packets, and failure modes blur until you can trace one request end-to-end
  hard_cn: 分层、报文和故障模式搅在一起，直到你能把一次请求从头跟到尾
  topics:
  - {en: "Layered models (OSI / TCP-IP) and where each job lives", cn: "分层模型（OSI / TCP-IP）与各层职责"}
  - {en: "Sockets, TCP vs UDP, and reliable delivery", cn: "Socket、TCP vs UDP 与可靠传输"}
  - {en: "Routing, addressing, and forwarding intuition", cn: "路由、编址与转发直觉"}
  - {en: "HTTP/DNS and application-layer protocols", cn: "HTTP/DNS 与应用层协议"}
  - {en: "Congestion, flow control, and performance trade-offs", cn: "拥塞、流控与性能权衡"}
  - {en: "Lab traces — Wireshark / packet walks when required", cn: "需要时的抓包 / 报文走读 Lab"}
  stuck:
  - {en: "Mixing app vs transport vs network layer when debugging", cn: "排查时把应用 / 传输 / 网络层搅在一起"}
  - {en: "Socket code almost works; handshake or timeout edges fail", cn: "Socket 差不多能跑；握手或超时边界挂掉"}
  - {en: "Protocol diagrams look familiar until the exam scenario is new", cn: "协议图课上眼熟，考试换场景就不会读"}
  session_angles:
  - {en: "Trace one packet path before changing socket code", cn: "改 Socket 代码前先跟完一条报文路径"}
  - {en: "Name the layer that owns the failure", cn: "先说出故障属于哪一层"}

- id: databases
  theme: databases
  match: databases?|relational\s*databases?|\bsql\b|data\s*management|information\s*systems?|dbms
  hard_en: one wrong schema or join quietly breaks every later query and transaction story
  hard_cn: Schema 或 join 偏一点，后面查询和事务叙事会整条链一起歪
  topics:
  - {en: "ER / relational modelling and normalisation", cn: "ER / 关系建模与范式"}
  - {en: "SQL — select, join, aggregation, nested queries", cn: "SQL — 查询、连接、聚合、嵌套"}
  - {en: "Indexes, plans, and why a query is slow", cn: "索引、执行计划与慢查询原因"}
  - {en: "Transactions — ACID, isolation, locking", cn: "事务 — ACID、隔离级别、锁"}
  - {en: "Integrity constraints and schema evolution", cn: "完整性约束与 Schema 演化"}
  - {en: "Application ↔ DB boundary (ORM / prepared statements)", cn: "应用与数据库边界（ORM / 预处理语句）"}
  stuck:
  - {en: "Join results look right until a duplicate or NULL appears", cn: "Join 结果看起来对，一出现重复或 NULL 就崩"}
  - {en: "Normalisation on paper; schema in code still denormalised", cn: "纸上范式对了，代码里 Schema 仍不规范"}
  - {en: "Transaction / isolation questions collapse under time pressure", cn: "限时下事务 / 隔离级别题直接崩盘"}
  session_angles:
  - {en: "Draw the ER, then write the join checklist", cn: "先画 ER，再写 join 清单"}
  - {en: "Explain the plan before tuning indexes", cn: "调索引前先说清执行计划"}

- id: algorithms-ds
  theme: algorithms
  match: algorithms?(?:\s+and\s+data)?|data\s*structures?|algorithm\s*design|algorithm\s*analysis|design\s+and\s+analysis\s+of\s+algorithms|programming\s+techniques
  hard_en: invariants, complexity claims, and code must stay aligned under time pressure
  hard_cn: 限时下不变量、复杂度结论和代码必须说的是同一件事
  topics:
  - {en: "Complexity — Big-O, recurrence, and arguing bounds", cn: "复杂度 — Big-O、递推与界的论证"}
  - {en: "Core ADTs — lists, stacks, queues, trees, heaps, hash tables", cn: "核心 ADT — 表、栈、队列、树、堆、哈希表"}
  - {en: "Sorting and searching families", cn: "排序与查找族"}
  - {en: "Graph algorithms — BFS/DFS, shortest paths, MSTs", cn: "图算法 — BFS/DFS、最短路、最小生成树"}
  - {en: "Greedy, divide-and-conquer, and dynamic programming patterns", cn: "贪心、分治与动态规划模式"}
  - {en: "Writing proofs / invariants that match the code", cn: "写出和代码一致的证明 / 不变量"}
  stuck:
  - {en: "Can follow a worked DP example; blank page under time pressure", cn: "能看懂 DP 例题，限时白纸开不了头"}
  - {en: "Complexity claim and implementation disagree", cn: "复杂度结论和实现说的不是同一件事"}
  - {en: "Graph algorithm chosen wrong for the constraint set", cn: "约束条件下选错了图算法"}
  session_angles:
  - {en: "State invariant and complexity before coding", cn: "写代码前先写不变量和复杂度"}
  - {en: "Reduce the problem to a known pattern, then specialise", cn: "先归到已知模式，再特化"}

- id: machine-learning
  theme: machine-learning
  match: machine\s*learn|statistical\s*machine\s*learn|pattern\s*recogni|supervi(?:sed)?\s*learn|ml\s*and
  hard_en: method names blur until pipelines, metrics, and write-ups diverge
  hard_cn: 方法名搅在一起，pipeline、指标和报告对不上就会崩
  topics:
  - {en: "Supervised learning — linear/logistic models, trees, SVMs", cn: "监督学习 — 线性 / 逻辑回归、树、SVM"}
  - {en: "Train / validation / test splits and leakage traps", cn: "训练 / 验证 / 测试划分与泄漏陷阱"}
  - {en: "Features, scaling, and model selection", cn: "特征、缩放与模型选择"}
  - {en: "Metrics — accuracy, precision/recall, ROC, calibration", cn: "指标 — 准确率、精确率/召回、ROC、校准"}
  - {en: "Regularisation, overfitting, and bias-variance", cn: "正则、过拟合与偏差-方差"}
  - {en: "Notebook pipelines the marker can re-run", cn: "改卷人能复跑的 notebook 流水线"}
  stuck:
  - {en: "Model runs; write-up cannot defend metric or split choice", cn: "模型能跑，报告说不清指标或划分选择"}
  - {en: "Train score high; test collapses from leakage or skew", cn: "训练集分数高；测试因泄漏或分布偏斜崩掉"}
  - {en: "Hyperparameters tuned by gut feel with no protocol", cn: "超参凭感觉调，没有协议"}
  session_angles:
  - {en: "Lock the split and metric before touching models", cn: "碰模型前先锁死划分和指标"}
  - {en: "One ablation at a time; keep a method trail", cn: "一次只做一个消融，保留方法轨迹"}

- id: deep-learning-ai
  theme: machine-learning
  match: deep\s*learn|neural\s*networks?|artificial\s*intell|\bai\b(?:\s|/)|cnn|rnn|transformer|reinforcement\s*learn|topics?\s+in\s+ai|intelligent\s+systems?|quantum\s+computing|decision\s+making\s+with\s+programming
  hard_en: architectures and loss jargon outrun the debugging loop when shapes and gradients fail
  hard_cn: 结构和 loss 术语跑得比 debug 循环快，一遇到维度或梯度问题就停住
  topics:
  - {en: "Neural net basics — layers, activations, backprop intuition", cn: "神经网络基础 — 层、激活、反向传播直觉"}
  - {en: "CNNs / RNNs / Transformers when the course uses them", cn: "课程用到的 CNN / RNN / Transformer"}
  - {en: "Losses, optimisers, and training loops", cn: "损失函数、优化器与训练循环"}
  - {en: "Regularisation — dropout, weight decay, early stopping", cn: "正则 — dropout、权重衰减、早停"}
  - {en: "Shape debugging and common framework errors", cn: "维度 debug 与常见框架报错"}
  - {en: "Eval protocol and reporting that matches the brief", cn: "与 brief 对齐的评估协议与报告"}
  stuck:
  - {en: "Forward pass runs; loss NaNs or never decreases", cn: "前向能跑；loss 变 NaN 或一直不降"}
  - {en: "Architecture named correctly; tensor shapes still wrong", cn: "结构名字说对了，张量维度仍错"}
  - {en: "Cannot explain why this model fits the task in the write-up", cn: "报告里说不清为何这个模型适合该任务"}
  session_angles:
  - {en: "Print shapes at each block before tuning hyperparameters", cn: "调超参前先把每块维度打出来"}
  - {en: "Tie architecture choice back to the data modality", cn: "把结构选择拉回数据模态"}

# Postgrad / accelerated Python problem-solving (e.g. UNSW COMP9021) — before generic intro pack.
- id: python-principles
  theme: programming
  match: principles?\s+of\s+programming|\bcomp\s*9021\b|python\s+(?:programming|principles)|programming\s+in\s+python
  hard_en: the Python learning curve is steep — quizzes and exams punish incomplete problem decompositions, not missing syntax trivia
  hard_cn: Python 学习曲线很陡——quiz / 考试砸的是拆题不完整，不是记不住语法 trivia
  topics:
  - {en: "Python core — lists, tuples, dicts, sets, strings, control flow", cn: "Python 核心 — list/tuple/dict/set、字符串、控制流"}
  - {en: "Functions, lambdas, generators, and complexity intuition", cn: "函数、lambda、生成器与复杂度直觉"}
  - {en: "Files, directories, formatting, and bitwise ops", cn: "文件 / 目录、格式化与位运算"}
  - {en: "Recursion, memoisation, and dynamic programming patterns", cn: "递归、记忆化与动态规划模式"}
  - {en: "Classes / OOP, linked structures, stacks, queues, trees", cn: "类 / OOP、链表结构、栈、队列、树"}
  - {en: "2-D grids, NumPy, regex, and search (DFS/BFS) when examined", cn: "考试中的二维网格、NumPy、正则与搜索（DFS/BFS）"}
  - {en: "Weekly quizzes + assignment problem shapes under time pressure", cn: "限时下的周 quiz + 作业题型"}
  stuck:
  - {en: "Quiz almost done; edge cases on slices, mutability, or dict keys fail", cn: "Quiz 差不多写完；切片、可变性或 dict 键的边界挂掉"}
  - {en: "Recursion / DP idea clear; base case or memo key wrong under exam clock", cn: "递归 / DP 思路清楚；限时下 base case 或 memo 键写错"}
  - {en: "Grid / path / search questions — state representation never settles", cn: "网格 / 路径 / 搜索题 — 状态表示一直定不下来"}
  - {en: "Class design works on sample; equality / hashing / identity breaks tests", cn: "样例上类设计能跑；相等 / 哈希 / 身份在测试里崩"}
  session_angles:
  - {en: "Restate I/O and invariants before writing the first loop", cn: "写第一个循环前先复述输入输出与不变量"}
  - {en: "Solve a tiny hand example, then generalise to the quiz skeleton", cn: "先手推小例子，再推广到 quiz 骨架"}
  - {en: "Timed drill on one quiz shape (grid, recursion, or file parse)", cn: "限时练一种 quiz 题型（网格、递归或文件解析）"}

- id: c-programming
  theme: programming
  match: \bcomp\s*10002\b|\bcmput\s*201\b|programming\s+fundamentals?\b(?:\s+in\s+c\b)?(?!\s+in)|(?:^|[\s])c\s+programming\b|pointers?\s+and\s+arrays|intro(?:duction)?\s+to\s+c\b
  hard_en: C briefs and autotests punish pointer/string edges harder than missing syntax
  hard_cn: C 的 brief 和 autotest 往往先砸指针 / 字符串边界，而不是语法本身
  topics:
  - {en: "C basics — types, control flow, functions, I/O", cn: "C 基础 — 类型、控制流、函数、I/O"}
  - {en: "Arrays, strings, and pointer arithmetic", cn: "数组、字符串与指针运算"}
  - {en: "Memory — stack vs heap, malloc, common leaks", cn: "内存 — 栈 / 堆、malloc、常见泄漏"}
  - {en: "Structs, linked lists, and modular .c/.h layout", cn: "结构体、链表与 .c/.h 模块划分"}
  - {en: "Reading dense briefs and mapping to autotest cases", cn: "读密 brief 并映射到 autotest 用例"}
  - {en: "Debugging with print / gdb when the sample passes but submit fails", cn: "样例能过提交挂时用打印 / gdb 排查"}
  stuck:
  - {en: "Local samples pass; autotest fails on string edges or I/O format", cn: "本地样例能过；autotest 在字符串边界或 I/O 格式挂"}
  - {en: "Pointer diagram clear; your code still segfaults", cn: "指针图画得清，代码仍 segfault"}
  - {en: "Brief read thrice; still unsure which ADT to build", cn: "brief 读了三遍，仍不确定要建哪个 ADT"}
  session_angles:
  - {en: "Draw the pointer / array picture before typing", cn: "动手前先画指针 / 数组图"}
  - {en: "Bisect the failing autotest with a minimal repro", cn: "用最小复现二分失败的 autotest"}

- id: intro-programming
  theme: programming
  match: introduction\s+to\s+programming|programming\s+(?:methodology|practice|abstractions|technologies)|programming\s+as\s+problem|intro(?:duction)?\s+to\s+(?:cs|computing|computer\s*science)|computational\s+thinking|structured\s+programming|problem\s+solving\s+and\s+programming|imperative(?:\s+and\s+functional)?\s+programming|functional\s+programming|procedural\s+programming|computer\s+programming|intermediate\s+programming|further\s+programming|foundations?\s+of\s+programming|programming\s+with\s+|programming\s+i\b|programming\s+for\s+engineers|fundamentals?\s+of\s+computer\s+science|computation,\s*programs|programs,\s+and\s+programming|structure\s+and\s+interpretation
  hard_en: problem decomposition and edge cases hit harder than memorising syntax
  hard_cn: 真正难的往往是拆题和边界，而不是背语法
  topics:
  - {en: "Variables, types, and expressions in the course language", cn: "课程语言中的变量、类型与表达式"}
  - {en: "Control flow — branching, loops, and nested logic", cn: "控制流 — 分支、循环与嵌套逻辑"}
  - {en: "Functions / procedures and stepwise decomposition", cn: "函数 / 过程与逐步拆题"}
  - {en: "Collections — arrays/lists/strings and indexing bugs", cn: "集合 — 数组/列表/字符串与下标坑"}
  - {en: "I/O, specs, and exact output the autograder expects", cn: "I/O、规格与 autograder 要求的精确输出"}
  - {en: "Testing and debugging — reproduce, bisect, fix", cn: "测试与调试 — 复现、二分、再修"}
  stuck:
  - {en: "Sample cases pass; submission fails on edges or I/O format", cn: "样例能过；提交在边界或 I/O 格式上挂"}
  - {en: "Spec read three times, still unsure what to implement", cn: "规格读了三遍仍不确定要实现什么"}
  - {en: "Code that almost works with no systematic debug plan", cn: "代码差不多能跑，却没有系统 debug 计划"}
  session_angles:
  - {en: "Restate I/O and edges on a whiteboard first", cn: "先在白板上复述输入输出和边界"}
  - {en: "Bisect the failing test with print / debugger discipline", cn: "用打印 / 调试器纪律二分失败用例"}

- id: oop
  theme: programming
  match: object[\s-]*oriented|oriented\s+programming|\boop\b|java\s+program|fundamentals?\s+in\s+java|java\s+fundamentals|programming\s+(?:ii|2)|software\s+construction|programming\s+in\s+the\s+large|c\+\+\s*programming|programming\s+with\s+c\+\+|software\s+libraries
  hard_en: class design and ownership bugs hide behind “it compiles”
  hard_cn: 类设计和所有权问题藏在「能编译」后面
  topics:
  - {en: "Classes, objects, encapsulation, and invariants", cn: "类、对象、封装与不变量"}
  - {en: "Inheritance, interfaces, and polymorphism", cn: "继承、接口与多态"}
  - {en: "Design before typing — responsibilities and collaborators", cn: "先设计再写 — 职责与协作关系"}
  - {en: "Testing objects and mutable state", cn: "测对象与可变状态"}
  - {en: "Common memory / reference pitfalls in the course language", cn: "课程语言里的常见引用 / 内存坑"}
  - {en: "Refactoring for clarity under an autograder", cn: "在 autograder 下为清晰度重构"}
  stuck:
  - {en: "Methods work in isolation; object graph breaks under the brief", cn: "方法单独能跑；对象关系一接 brief 就断"}
  - {en: "Inheritance used where composition was needed", cn: "该用组合却用了继承"}
  - {en: "Equals/hash or ownership bugs that only show in tests", cn: "equals/hash 或所有权 bug 只在测试里出现"}
  session_angles:
  - {en: "CRC / responsibility sketch before opening the editor", cn: "打开编辑器前先画职责草图"}
  - {en: "Write the failing test that names the invariant", cn: "先写点名不变量的失败测试"}

- id: computer-organisation
  theme: systems
  match: computer\s+(?:organisation|organization|architecture|systems?|processors?)|computer\s+systems?\s+fundamentals|program\s+execution|microprocessors?|assembly|digital\s+logic|rechnerarchitektur|principles\s+of\s+computer\s+systems|introduction\s+to\s+(?:software\s+)?systems|systems?\s+architecture
  hard_en: assembly, data representation, and microarchitecture terms outrun note-taking
  hard_cn: 汇编、数据表示和微体系术语比记笔记速度还快
  topics:
  - {en: "Data representation — ints, floats, endianness, bitwise ops", cn: "数据表示 — 整数、浮点、端序、位运算"}
  - {en: "Assembly / ISA basics and calling conventions", cn: "汇编 / ISA 基础与调用约定"}
  - {en: "CPU datapath, control, and pipelining intuition", cn: "CPU 数据通路、控制与流水线直觉"}
  - {en: "Memory hierarchy — cache, locality, virtual memory intro", cn: "存储层次 — 缓存、局部性、虚拟内存入门"}
  - {en: "How C maps to machine-level behaviour", cn: "C 如何落到机器层行为"}
  - {en: "Labs with simulators / assembly tooling when required", cn: "需要时的模拟器 / 汇编工具 Lab"}
  stuck:
  - {en: "Assembly control clear in lecture; your program clobbers registers", cn: "课上汇编控制流清楚，自己的程序却弄坏寄存器"}
  - {en: "IEEE-754 or bitwise exam figures collapse under time", cn: "限时下 IEEE-754 或位运算题崩盘"}
  - {en: "Cache / pipeline questions feel familiar until the figure changes", cn: "缓存 / 流水线题眼熟，换图就不会"}
  session_angles:
  - {en: "Hand-trace registers and memory before editing", cn: "改之前先手推寄存器与内存"}
  - {en: "Connect each C line to the machine events it causes", cn: "把每行 C 接到它触发的机器事件"}

- id: software-engineering
  theme: web-mobile
  match: software\s+engineering|software\s+design|software\s+architecture|software\s+product|software\s+foundations|software\s+development|agile|full[\s-]*stack|dev(?:elopment)?\s*methods|\bdevops\b|it\s+solution\s+architecture|creative\s+programming
  hard_en: specs, teamwork, and demo evidence matter as much as whether the feature runs
  hard_cn: 规格、协作和 demo 证据，往往和「功能能不能跑」一样重要
  topics:
  - {en: "Requirements — user stories, use cases, acceptance criteria", cn: "需求 — user story、use case、验收标准"}
  - {en: "Design — modularity, APIs, and maintainability", cn: "设计 — 模块化、API 与可维护性"}
  - {en: "Git workflows and code review habits", cn: "Git 工作流与 code review 习惯"}
  - {en: "Testing — unit, integration, and demo evidence", cn: "测试 — 单元、集成与 demo 证据"}
  - {en: "HTTP / backend or UI structure the course actually uses", cn: "课程实际用的 HTTP / 后端或 UI 结构"}
  - {en: "Iteration planning and defending design in demos", cn: "迭代规划与在 demo 中为设计辩护"}
  stuck:
  - {en: "Feature works; demo cannot explain design trade-offs", cn: "功能能跑，demo 讲不清设计权衡"}
  - {en: "Tests pass locally; CI or tutor demo fails on edges", cn: "本地测试能过；CI 或 tutor demo 在边界挂"}
  - {en: "Team Git history messy after a bad merge", cn: "错误合并后团队 Git 历史一团糟"}
  session_angles:
  - {en: "Map interface → tests → demo narrative before coding", cn: "写代码前先对齐接口 → 测试 → demo 叙述"}
  - {en: "Own one vertical slice end-to-end", cn: "端到端拿下一小条垂直切片"}

- id: security
