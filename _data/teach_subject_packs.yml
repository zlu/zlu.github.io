  topics:
  - {en: "DFA / NFA / ε-NFA and equivalence ideas", cn: "DFA / NFA / ε-NFA 与等价思想"}
  - {en: "Regular expressions and languages", cn: "正则表达式与语言"}
  - {en: "Grammars, parsing, and ambiguity when taught", cn: "课程中的文法、解析与歧义"}
  - {en: "Pumping lemmas / decidability sketches when required", cn: "需要时的泵引理 / 可判定性草图"}
  - {en: "Compiler pipeline stages when in syllabus", cn: "大纲中的编译流水线阶段"}
  - {en: "Reading and drawing machines under time pressure", cn: "限时下读图与画自动机"}
  stuck:
  - {en: "Definitions memorised; cannot build the machine for a new language", cn: "定义背过了，新语言却画不出自动机"}
