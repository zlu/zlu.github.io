  - {en: "Check acceptance on two strings before submitting the diagram", cn: "交图前先用两个串检查接受情况"}

- id: distributed-systems
  theme: systems
  match: distributed\s+systems?|cloud\s+computing|parallel(?:\s+and\s+|\s+)(?:distributed|computing)|concurrent\s+programming|high[\s-]*performance
  hard_en: partial failure and consistency models make “it worked on my node” meaningless
  hard_cn: 部分失效和一致性模型会让「我这台节点能跑」变得毫无意义
  topics:
  - {en: "Models of distribution — nodes, links, partial failure", cn: "分布模型 — 节点、链路、部分失效"}
  - {en: "RPC, messaging, and serialisation basics", cn: "RPC、消息与序列化基础"}
  - {en: "Consistency, replication, and consensus intuition", cn: "一致性、复制与共识直觉"}
  - {en: "Clocks, ordering, and concurrency control", cn: "时钟、排序与并发控制"}
  - {en: "Fault tolerance and idempotent design", cn: "容错与幂等设计"}
  - {en: "Lab systems — tracing failures across components", cn: "Lab 系统 — 跨组件追踪故障"}
  stuck:
  - {en: "Happy path works; partition or retry logic breaks state", cn: "快乐路径能跑；分区或重试逻辑弄坏状态"}
  - {en: "Consistency model named; behaviour under failure unclear", cn: "一致性模型名字会背，失效下行为说不清"}
  - {en: "Logs from multiple nodes do not tell one story", cn: "多节点日志拼不成一个故事"}
  session_angles:
  - {en: "Draw the failure scenario before changing code", cn: "改代码前先画失效场景"}
  - {en: "Make retries idempotent on purpose", cn: "有意识地把重试做成幂等"}

- id: computer-vision
  theme: machine-learning
