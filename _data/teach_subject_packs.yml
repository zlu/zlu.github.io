  - {en: "Fix the contract, then the presentation", cn: "先修契约，再修展示"}

- id: graphics
  theme: programming
  match: computer\s+graphics|graphics\s+program|rendering|game\s+(?:design|development|engine)|animation
  hard_en: math, pipelines, and shader/state bugs stack until demos freeze
