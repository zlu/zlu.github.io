  hard_cn: 就算图画出来了，脏表和站不住的方法叙事也会丢分
  topics:
  - {en: "Data wrangling — tidy tables, joins, missingness", cn: "数据整理 — 整洁表、连接、缺失"}
  - {en: "EDA and visualisation that answer a question", cn: "能回答问题的 EDA 与可视化"}
  - {en: "Feature hygiene and leakage checks", cn: "特征卫生与泄漏检查"}
  - {en: "Simple models / summaries appropriate to the brief", cn: "适合 brief 的简单模型 / 汇总"}
