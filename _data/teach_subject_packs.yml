- id: nlp
  theme: machine-learning
  match: natural\s+language|\bnlp\b|language\s+models?|text\s+(?:mining|processing)|computational\s+linguistics
  hard_en: tokenisation, metrics, and data splits decide results before model fancy-ness
  hard_cn: 往往先由分词、指标和数据划分决定结果，而不是模型花哨程度
  topics:
  - {en: "Text preprocessing and tokenisation", cn: "文本预处理与分词"}
  - {en: "Classical features — n-grams, TF-IDF when taught", cn: "课程中的经典特征 — n-gram、TF-IDF"}
  - {en: "Sequence / embedding / LM approaches in syllabus", cn: "大纲中的序列 / 向量 / 语言模型方法"}
  - {en: "Evaluation — accuracy, F1, BLEU/ROUGE when used", cn: "评估 — 准确率、F1、BLEU/ROUGE（若使用）"}
  - {en: "Dataset pitfalls — leakage, class imbalance, domain shift", cn: "数据陷阱 — 泄漏、类别不平衡、域偏移"}
