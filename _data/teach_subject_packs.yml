  hard_en: threat models and crypto vocabulary form a wall before the lab even builds
  hard_cn: 威胁模型和密码学术语先堆成一堵墙，Lab 还没编译就劝退
  topics:
  - {en: "Threat modelling — assets, attackers, trust boundaries", cn: "威胁建模 — 资产、攻击者、信任边界"}
  - {en: "Crypto primitives — symmetric, public-key, hashing, TLS intuition", cn: "密码学原语 — 对称、公钥、哈希、TLS 直觉"}
  - {en: "Authentication, authorisation, and session security", cn: "认证、授权与会话安全"}
  - {en: "Common web / network vulnerabilities when in syllabus", cn: "大纲中的常见 Web / 网络漏洞"}
  - {en: "Secure coding habits and failure modes", cn: "安全编码习惯与失败模式"}
  - {en: "Lab setup and reporting findings clearly", cn: "Lab 环境与把发现写清楚"}
  stuck:
  - {en: "Lab setup unfinished; report lists tools without a finding", cn: "Lab 环境没配好；报告只罗列工具没有发现"}
  - {en: "Primitive names memorised; wrong tool for the threat", cn: "原语名字背过了，威胁却选错工具"}
  - {en: "Crypto math and protocol steps diverge under exam pressure", cn: "限时下密码学计算和协议步骤对不上"}
  session_angles:
  - {en: "Write the threat model before picking a primitive", cn: "选原语前先写威胁模型"}
  - {en: "One reproducible finding beats a tool dump", cn: "一个可复现发现胜过工具清单"}

- id: discrete-math
  theme: math-for-cs
  match: discrete\s+(?:math|structures|mathematics)|foundations\s+of\s+computing|(?:^|[\s/])logic(?:\s|$)|logic\s+and|proofs?\s+and|computability|mathematics\s+for\s+computer|models?\s+of\s+computation|theoretical\s+computer\s+science|computing\s+theory|formale\s+sprache|great\s+ideas\s+in\s+theoretical
  hard_en: symbols and proof phrasing outrun calculation skill
  hard_cn: 符号与证明表述往往比计算本身更劝退
  topics:
  - {en: "Logic, sets, and proof strategies", cn: "逻辑、集合与证明策略"}
  - {en: "Induction and invariants", cn: "归纳与不变量"}
  - {en: "Relations, functions, and counting", cn: "关系、函数与计数"}
  - {en: "Graphs / trees as discrete structures", cn: "作为离散结构的图 / 树"}
  - {en: "Number theory or modular arithmetic when required", cn: "需要时的数论 / 模运算"}
  - {en: "Translating word problems into formal statements", cn: "把文字题翻译成形式陈述"}
  stuck:
  - {en: "Can follow a proof; cannot start from a blank page", cn: "能看懂证明，白纸上开不了头"}
  - {en: "Notation piles up faster than bilingual notes", cn: "符号比双语笔记堆得还快"}
  - {en: "Induction hypothesis stated wrong for the claim", cn: "归纳假设和要证的命题对不上"}
  session_angles:
  - {en: "Restate the claim in one sentence before proving", cn: "证明前先用一句话复述命题"}
  - {en: "Pick the proof pattern, then fill details", cn: "先选证明模式，再填细节"}

- id: probability-stats
  theme: math-for-cs
  match: probability|statistics|statistical\s+(?:methods|learning|modelling|modeling)|stochastic|bayesian(?!\s*network\s*only)
  hard_en: notation and modelling assumptions fail before the arithmetic does
  hard_cn: 往往先倒在符号和建模假设上，而不是四则运算
  topics:
  - {en: "Probability axioms, conditioning, and Bayes", cn: "概率公理、条件概率与贝叶斯"}
  - {en: "Random variables, expectation, variance", cn: "随机变量、期望、方差"}
  - {en: "Common distributions and when to use them", cn: "常见分布与选用时机"}
  - {en: "Estimation, confidence, and hypothesis tests when taught", cn: "课程中的估计、置信与假设检验"}
  - {en: "Modelling assumptions you must state in write-ups", cn: "报告里必须写明的建模假设"}
  - {en: "Connecting formulas to the story in the brief", cn: "把公式接到 brief 里的故事"}
  stuck:
  - {en: "Formula memorised; conditioning direction flipped", cn: "公式背过了，条件方向却弄反"}
  - {en: "Computation correct; modelling assumption never stated", cn: "算对了，建模假设从没写出来"}
  - {en: "Exam word problems — unsure which distribution applies", cn: "考试文字题 — 不确定该用哪个分布"}
  session_angles:
  - {en: "Draw the sample space / dependence before calculating", cn: "算之前先画样本空间 / 依赖关系"}
  - {en: "Name the assumption that makes the formula legal", cn: "说出让公式成立的假设"}

- id: linear-algebra-calculus
  theme: math-for-cs
  match: linear\s*algebra|calculus|multivariable|matrix\s+methods|mathematical\s+methods|numer(?:ical)?\s+(?:analysis|methods|computation)|optimisation|optimization
  hard_en: symbols and geometric intuition disconnect under exam pressure
  hard_cn: 限时下符号和几何直觉对不上
  topics:
  - {en: "Vectors, matrices, and linear maps", cn: "向量、矩阵与线性映射"}
  - {en: "Systems of equations, rank, and invertibility", cn: "方程组、秩与可逆性"}
  - {en: "Eigenvalues / SVD intuition when in syllabus", cn: "大纲中的特征值 / SVD 直觉"}
  - {en: "Derivatives, gradients, and multivariable pictures", cn: "导数、梯度与多变量图像"}
  - {en: "Connecting calculus/linear algebra to CS applications", cn: "把微积分 / 线性代数接到 CS 应用"}
  - {en: "Exam technique — setup before algebra grind", cn: "应试技巧 — 先摆好再硬算"}
  stuck:
  - {en: "Can compute mechanically; cannot explain geometrically", cn: "能机械算，几何上讲不清"}
  - {en: "Setup wrong; pages of algebra on the wrong object", cn: "对象设错，代数算了好几页"}
  - {en: "Notation from lectures does not transfer to the exam figure", cn: "课上符号迁不到考试那张图"}
  session_angles:
  - {en: "Sketch the geometric picture, then compute", cn: "先画几何图像，再计算"}
  - {en: "Name the unknown and the space it lives in", cn: "先命名未知量及其所在空间"}

- id: automata-compilers
  theme: automata
