label_en: Programming & software construction
label_cn: 编程与软件构造
lead_en: First- and second-year programming courses fail students on parameter modes, recursion base cases, and container edge behaviour—not on “knowing syntax.” I tutor with bilingual walkthroughs of the concept, then pair-debug until the design and tests hold.
lead_cn: 低年级编程课真正挂人的，常常不是「语法会不会」，而是传参模式搞不清、递归终止条件写错、容器边界不会查。辅导时我会先用中英双语把概念和设计拆开，再在你的环境里结对 debug，直到你能自己解释每一处改动。
