title: Zhao Lü
url: https://zlu.me
lang: en
logo: /assets/images/avatar.png
# Visible in the sidebar (and browser title via jekyll-seo-tag). Keep this personal.
tagline: code · read · fitness
keywords: "Zhao Lü, zlu, AI, machine learning, data science, computer science, Silicon Valley engineer, CS tutor, AI educator"
# Meta description for search engines — credentials live here, not in the visible tagline.
description: "Zhao Lü — Silicon Valley engineer, AI educator, and CS tutor. AI & data science educator and bilingual tutoring for Chinese students studying abroad."
author: zlu
# Tutor-focused keywords for teach pages that opt in via page.keywords or site.tutor_keywords
tutor_keywords: "留学辅导，留学生辅导,留学生课程辅导,留学生补习,留学生在线辅导,留学生作业辅导,美国留学生辅导,英国留学生辅导,澳洲留学生辅导,新西兰留学辅导,加拿大留学生辅导,香港留学生辅导,留学生一对一辅导,留学生线上辅导，人工智能辅导，数据科学辅导，计算机课程辅导, AI辅导，Python辅导，online 1-1 tutoring for chinese students in australia, artificial intelligence tutoring"
rss_path: feeds
markdown: kramdown
redcarpet:
  extensions: ["strikethrough"]
highlighter: rouge
port: 4000
exclude: ["vendor"]
# Public base URL for web-sized portfolio images on Cloudflare R2 (no Worker).
photo_cdn: "https://media.zlu.me"
collections:
  archives:
    output: true
    permalink: /archive/:title/
  ai-glossary:
    output: true
    permalink: /ai-glossary/:name/ 
  med-glossary:
    output: true
    permalink: /med-glossary/:name/
  tags:
    output: true
    permalink: /tags/:name/
  photos:
    output: false
  albums:
    output: true
    permalink: /photos/:name/
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
mermaid:
  src: 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js'
  initialize:
    startOnLoad: true
    theme: 'neutral'
    flowchart:
      useMaxWidth: true
    sequence:
      useMaxWidth: true
twitter:
  username: zlu
  card: summary
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/avatar.png
  - scope:
      path: ""
      type: ai-glossary
    values:
      layout: glossary
      sitemap: true
  - scope:
      path: ""
      type: med-glossary
    values:
      layout: glossary
      sitemap: true
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      sitemap: true
  - scope:
      path: ""
      type: tags
    values:
      layout: tag
      # Thin tag indexes: keep crawlable via post links, omit from sitemap to save Bing crawl budget
      sitemap: false
  - scope:
      path: "admin"
    values:
      sitemap: false
      robots: noindex
  - scope:
      path: ""
      type: photos
    values:
      published: true
  - scope:
      path: ""
      type: albums
    values:
      layout: photo_album
      published: true
      sitemap: true
