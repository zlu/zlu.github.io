title: Zhao Lü
url: https://zlu.me
lang: en
logo: /assets/images/avatar.png
tagline: Silicon Valley engineer, AI educator, and CS tutor
keywords: "Zhao Lü, zlu, AI, machine learning, data science, computer science, Silicon Valley"
description: "Zhao Lü — Silicon Valley engineer, AI & data science educator, and bilingual CS tutor for Chinese students studying abroad. Teach, consult, technology, life."
author: zlu
# Tutor-focused keywords for teach pages that opt in via page.keywords or site.tutor_keywords
tutor_keywords: "留学辅导，留学生辅导,留学生课程辅导,留学生补习,留学生在线辅导,留学生作业辅导,美国留学生辅导,英国留学生辅导,澳洲留学生辅导,新西兰留学辅导,加拿大留学生辅导,香港留学生辅导,留学生一对一辅导,留学生线上辅导，人工智能辅导，数据科学辅导，计算机课程辅导, AI辅导，Python辅导，online 1-1 tutoring for chinese students in australia, artificial intelligence tutoring"
rss_path: feeds
markdown: kramdown
redcarpet:
  extensions: ["strikethrough"]
highlighter: rouge
port: 4000
exclude: ["vendor"]
collections:
  archives:
    output: true
    permalink: /archive/:title/
  ai-glossary:
    output: true
    permalink: /ai-glossary/:name/ 
  med-glossary:
    output: true
    permalink: /med-glossary/:name/
  tags:
    output: true
    permalink: /tags/:name/
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
mermaid:
  src: 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js'
  initialize:
    startOnLoad: true
    theme: 'neutral'
    flowchart:
      useMaxWidth: true
    sequence:
      useMaxWidth: true
twitter:
  username: zlu
  card: summary
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/avatar.png
  - scope:
      path: ""
      type: ai-glossary
    values:
      layout: page
  - scope:
      path: ""
      type: med-glossary 
    values:
      layout: page
  - scope:
      path: ""
      type: tags
    values:
      layout: tag
