  <div class="teach-about-body">
    <p data-en="I’m Zhao Lü (吕钊), born in Beijing. I’ve lived and worked in the US, UK, Brazil, Switzerland, France, and Germany. For more than fifteen years I’ve been a Silicon Valley engineer — storage, insurance, telecom, social — and hold five patents. Lately I focus on machine learning, algorithms, and teaching."
       data-cn="我是吕钊（Zhao Lü），北京人。在美国、英国、巴西、瑞士、法国、德国生活与工作过。硅谷做工程师十几年，做过存储、保险、电信、社交，有五项专利。近年更专注机器学习、算法，以及教学。">我是吕钊（Zhao Lü），北京人。在美国、英国、巴西、瑞士、法国、德国生活与工作过。硅谷做工程师十几年，做过存储、保险、电信、社交，有五项专利。近年更专注机器学习、算法，以及教学。</p>
    <p data-en="I tutor Chinese CS students abroad one-to-one: AI, data science, and university coursework. You talk to the person who teaches — no sales handoff, no agency markup."
       data-cn="我给海外中国 CS 留学生做一对一：人工智能、数据科学、以及学校课程。咨询和上课是同一个人 —— 没有销售转接，也没有中介加价。">我给海外中国 CS 留学生做一对一：人工智能、数据科学、以及学校课程。咨询和上课是同一个人 —— 没有销售转接，也没有中介加价。</p>
