<section class="teach-hero" id="teach-book" aria-labelledby="teach-hero-title">
  <div class="teach-hero-copy">
    <div class="teach-hero-top">
      <p class="teach-hero-brand">
        <img class="teach-brand-mark" src="/assets/images/logo-zlu.png" width="28" height="28" alt="zlu">
        Zhao Lü · 吕钊
      </p>
      {% include teach-lang-switcher.html %}
    </div>
    <h1 id="teach-hero-title"
        data-en="Bilingual Computer Science tutoring"
        data-cn="给海外中国留学生的计算机一对一辅导">给海外中国留学生的计算机一对一辅导</h1>
    <p class="teach-hero-lead"
       data-en="Stuck in lectures, assignments, exams, projects, or research write-ups — explained and debugged with you, in Chinese and English. Direct WeChat booking. No middleman."
       data-cn="课听不懂、作业卡壳、考前慌、报告与研究论文不会写 —— 用中英双语讲透、一起调试。微信直约，无中介。">课听不懂、作业卡壳、考前慌、报告与研究论文不会写 —— 用中英双语讲透、一起调试。微信直约，无中介。</p>

      <a href="#teach-hub-find" class="btn btn-primary teach-hero-primary"
         data-en="Find your school"
         data-cn="找学校 / 课号">找学校 / 课号</a>

  </div>
  <aside class="teach-hero-book" id="teach-book-qr" aria-label="Book a session">
    <h2 class="teach-book-title"
        data-en="Book on WeChat"
        data-cn="微信预约">微信预约</h2>
    <p class="teach-book-hint"
       data-en="Scan and send: school + course code + deadline."
       data-cn="扫码后发送：学校 + 课号 + 截止日期。">扫码后发送：学校 + 课号 + 截止日期。</p>
    <img src="/assets/images/br-wechat-qr.JPG"
         class="wechat-qr teach-hero-qr"
         alt="WeChat QR code"
         width="148"
         height="148">
    <a href="mailto:hello@zlu.me?subject=CS%20tutoring%20inquiry"
       class="btn btn-outline-primary teach-hero-email"
       data-en="Email"
       data-cn="发邮件">发邮件</a>
