<section class="teach-find-school" aria-labelledby="teach-find-title" id="teach-hub-find">
  <h2 id="teach-find-title"
      data-en="Find your school"
      data-cn="找你的学校">找你的学校</h2>
  <p class="teach-section-lead"
     data-en="{{ site.data.teach_uni_count }} universities · {{ site.data.teach_course_count }} courses. If your code isn’t listed, WeChat me anyway."
     data-cn="目录现有 {{ site.data.teach_uni_count }} 所大学、{{ site.data.teach_course_count }} 门课。列表没有的课号也可以微信问。">目录现有 {{ site.data.teach_uni_count }} 所大学、{{ site.data.teach_course_count }} 门课。列表没有的课号也可以微信问。</p>

  <div class="teach-hub-search" data-teach-hub-search>
    <label class="teach-sr-only" for="teach-hub-search-input"
           data-en="Search university or course"
           data-cn="搜索大学或课号">搜索大学或课号</label>
    <input type="search"
           id="teach-hub-search-input"
           class="teach-uni-search teach-hub-search-input"
           autocomplete="off"
           spellcheck="false"
           data-en-placeholder="Search uni or course… e.g. UNSW, COMP1511, NUS"
           data-cn-placeholder="搜索学校或课号… 如 UNSW、COMP1511、港科大"
           placeholder="搜索学校或课号… 如 UNSW、COMP1511、港科大">
    <p class="teach-hub-search-hint"
       data-en="Type a school name or course code. Results link to existing tutoring pages."
       data-cn="输入学校名或课号，结果跳转到已有辅导页。">输入学校名或课号，结果跳转到已有辅导页。</p>
    <ul class="teach-hub-search-results" id="teach-hub-search-results" role="listbox" hidden></ul>
    <p class="teach-hub-search-empty" id="teach-hub-search-empty" hidden
       data-en="No match in the directory. WeChat me the school + course code anyway."
       data-cn="目录里没有匹配。仍可微信发我学校 + 课号。">目录里没有匹配。仍可微信发我学校 + 课号。</p>
  </div>

  <script type="application/json" id="teach-hub-search-data">{% assign hub_unis = site.data.teach_universities %}[{% for uni in hub_unis %}{"n":{{ uni.name | jsonify }},"s":{{ uni.slug | jsonify }}{% if uni.abbr and uni.abbr != "" %},"ab":{{ uni.abbr | jsonify }}{% endif %}{% if uni.name_cn and uni.name_cn != "" %},"cn":{{ uni.name_cn | jsonify }}{% endif %}{% if uni.label_cn and uni.label_cn != "" %},"lc":{{ uni.label_cn | jsonify }}{% endif %},"c":[{% for course in uni.courses %}{"c":{{ course.code | jsonify }},"t":{{ course.title | jsonify }},"sl":{{ course.slug | jsonify }}{% assign alias_list = course.aliases | default: empty %}{% if alias_list.size > 0 %},"a":{{ alias_list | jsonify }}{% endif %}}{% unless forloop.last %},{% endunless %}{% endfor %}]}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>

  <p class="teach-find-primary">
    <a href="/teach/universities/"
       data-en="Browse the university directory →"
       data-cn="浏览大学目录 →">浏览大学目录 →</a>
  </p>
  <p class="teach-region-links">
    <span data-en="By region:" data-cn="按地区：">按地区：</span>
    <a href="/teach/australia/" data-en="Australia" data-cn="澳大利亚">澳大利亚</a>
    <a href="/teach/uk/" data-en="UK" data-cn="英国">英国</a>
    <a href="/teach/usa/" data-en="USA" data-cn="美国">美国</a>
    <a href="/teach/canada/" data-en="Canada" data-cn="加拿大">加拿大</a>
    <a href="/teach/hong-kong/" data-en="Hong Kong" data-cn="香港">香港</a>
    <a href="/teach/singapore/" data-en="Singapore" data-cn="新加坡">新加坡</a>
    <a href="/teach/germany/" data-en="Germany" data-cn="德国">德国</a>
    <a href="/teach/ireland/" data-en="Ireland" data-cn="爱尔兰">爱尔兰</a>
    <a href="/teach/china/" data-en="China / Macau" data-cn="中国 / 澳门">中国 / 澳门</a>
  </p>
</section>
