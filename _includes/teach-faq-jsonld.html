{%- comment -%}
  FAQPage JSON-LD. Pass faq_items as an array of {q, a} (or question/answer).
{%- endcomment -%}
{%- assign items = include.faq_items -%}
{%- if items and items.size > 0 -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {%- for item in items -%}
    {%- assign q = item.q | default: item.question -%}
    {%- assign a = item.a | default: item.answer -%}
    {
      "@type": "Question",
      "name": {{ q | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ a | jsonify }}
      }
    }{% unless forloop.last %},{% endunless %}
    {%- endfor -%}
  ]
}
</script>
{%- endif -%}
