backend:
  name: github
  repo: zlu/zlu.github.io
  branch: main

media_folder: "assets/images/uploads"

collections:
  # First in the sidebar so it's obvious — New Trip folder is the blue "New …" button here
  - name: "albums"
    label: "Trip folders"
    label_singular: "Trip folder"
    description: "Create a trip folder here (New Trip folder). Then open Photos and set Folder on each shot."
    folder: "_albums"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{fields.key}}"
    identifier_field: "title"
    summary: "{{title}} — {{key}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Shown on /photos/, e.g. Kyoto 2024" }
      - {
          label: "Folder key",
          name: "key",
          widget: "string",
          hint: "URL id, lowercase + hyphens only. Example: kyoto-2024 → site path /photos/kyoto-2024/",
          pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Lowercase letters, numbers, hyphens only"],
        }
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
          hint: "Sort order on /photos/ (newest first)",
        }
      - { label: "Place", name: "place", widget: "string", required: false }
      - {
          label: "Cover image URL",
          name: "cover",
          widget: "string",
          required: false,
          hint: "Optional; otherwise newest photo in the folder",
        }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "Description", name: "body", widget: "markdown", required: false }

  - name: "photos"
    label: "Photos"
    label_singular: "Photo"
    description: "Assign each photo to a Trip folder (create folders under Trip folders first)."
    folder: "_photos"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{place}}"
    sortable_fields: ["title", "date", "place"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - {
          label: "Folder",
          name: "album",
          widget: "relation",
          collection: "albums",
          required: false,
          search_fields: ["title", "key", "place"],
          value_field: "key",
          display_fields: ["title", "key"],
          hint: "Choose a trip. If the list is empty, create one under Trip folders first.",
        }
      - { label: "Taken at", name: "taken_at", widget: "string", required: false, hint: "ISO datetime from EXIF" }
      - { label: "Timezone", name: "timezone", widget: "string", required: false, hint: "e.g. +09:00" }
      - { label: "Place", name: "place", widget: "string", required: false }
      - { label: "Latitude", name: "lat", widget: "number", required: false, value_type: "float" }
      - { label: "Longitude", name: "lon", widget: "number", required: false, value_type: "float" }
      - { label: "Camera", name: "camera", widget: "string", required: false }
      - {
          label: "Web image URL",
          name: "image",
          widget: "string",
          hint: "Public R2 URL from the local uploader",
        }
      - {
          label: "Thumb URL",
          name: "thumb",
          widget: "string",
          required: false,
        }
      - {
          label: "Original path (Baidu)",
          name: "original",
          widget: "string",
          required: false,
        }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - {
          label: "Description",
          name: "body",
          widget: "markdown",
          required: false,
          hint: "Shown in the lightbox when someone clicks the photo",
        }

  - name: "travels"
    label: "Travels"
    folder: "travels/"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "blog"
    label: "Blog"
    folder: "_posts/"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "drafts"
    label: "Drafts"
    folder: "_drafts/"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "frontmatter"
    extension: ".md"
    editor:
      preview: true
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "courses"
    label: "Tutored Courses"
    folder: "_data/courses/"
    create: true
    slug: "{{university | slugify}}"
    format: "yaml-frontmatter"
    extension: ".yml"
    fields:
      - { label: "University Name", name: "university", widget: "string" }
      - {
          label: "Teaching folder",
          name: "teaching_folder",
          widget: "string",
          required: false,
          hint: "Folder name under ~/baidu-sync/teaching (e.g. cardiff). Defaults to this file’s slug.",
        }
      - label: "Courses"
        name: "courses"
        widget: "list"
        fields:
          - {
              label: "Course Code",
              name: "code",
              widget: "string",
              required: false,
            }
          - { label: "Course Title", name: "title", widget: "string" }
          - {
              label: "Department/Notes",
              name: "department",
              widget: "string",
              required: false,
            }
          - {
              label: "Material folder",
              name: "material",
              widget: "string",
              required: false,
              hint: "Subfolder under teaching/<uni>/ — private materials only; never published.",
            }
  - name: "ai-glossary"
    label: "AI Glossary"
    folder: "_ai-glossary/"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Term", name: "title", widget: "string" }
      - { label: "SEO Description", name: "description", widget: "string", required: false }
      - { label: "Keywords", name: "keywords", widget: "string", required: false }
      - { label: "Synonyms", name: "synonyms", widget: "list", required: false }
      - {
          label: "Related Terms",
          name: "related",
          widget: "list",
          required: false,
        }
      - { label: "Definition", name: "body", widget: "markdown" }
  - name: "med-glossary"
    label: "Medicine Glossary"
    folder: "_med-glossary/"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Term", name: "title", widget: "string" }
      - { label: "Term English", name: "term-en", widget: "list", required: false }
      - {
          label: "Related Terms",
          name: "related",
          widget: "list",
          required: false,
        }
      - { label: "Definition", name: "body", widget: "markdown" }
